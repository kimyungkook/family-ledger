    var rules = [
      {k:['식당','레스토랑','치킨','피자','족발','보쌈','갈비','삼겹','국밥','설렁탕','냉면','칼국수','분식','떡볶이','김밥','라멘','초밥','돈까스','햄버거','맥도날드','버거킹','롯데리아','맘스터치','배달','요기요','배민','쿠팡이츠','휴게소'], c:'food', s:'외식'},
      {k:['카페','스타벅스','투썸','이디야','메가커피','빽다방','할리스','베이커리','파리바게뜨','뚜레쥬르','던킨','아이스크림','베스킨라빈스','설빙','디저트'], c:'food', s:'간식/후식/디저트'},
      {k:['홈플러스','롯데마트','하나로','농협','슈퍼','식자재'], c:'food', s:'식자재'},
      {k:['쿠팡','네이버쇼핑','11번가','옥션','지마켓','위메프','알리','테무'], c:'shop', s:'온라인'},
      {k:['백화점','아울렛'], c:'shop', s:'오프라인'},
      {k:['넷플릭스','유튜브','웨이브','왓챠','디즈니','티빙'], c:'culture', s:'OTT'},
      {k:['cgv','메가박스','롯데시네마','영화'], c:'culture', s:'예술공연'},
      {k:['주유','sk에너지','gs칼텍스','s-oil','충전소'], c:'trans', s:'주유'},
      {k:['택시','카카오t'], c:'trans', s:'택시'},
      {k:['버스','시내버스','고속버스'], c:'trans', s:'버스'},
      {k:['지하철','메트로','ktx','srt'], c:'trans', s:'지하철'},
      {k:['skt','kt','lg유플러스','통신'], c:'comm', s:'기타'},
      {k:['보험','삼성생명','현대해상','메리츠'], c:'ins', s:'아빠'},
      {k:['병원','의원','클리닉','치과','피부과','한의원','내과','안과'], c:'health', s:'병원'},
      {k:['약국'], c:'health', s:'약'},
      {k:['학원','과외'], c:'edu', s:'학원'},
      {k:['서점','교보문고','알라딘'], c:'edu', s:'서적'},
      {k:['올리브영','다이소','화장품'], c:'daily', s:'위생&케어용품'},
      {k:['세제','청소'], c:'daily', s:'세제&청소용품'},
      {k:['가전','하이마트'], c:'daily', s:'가전&가구'},
      {k:['관리비','전기','수도','가스','한전'], c:'util', s:''},
      {k:['축의금','결혼식'], c:'event', s:'결혼'},
      {k:['장례','부의금','상조'], c:'event', s:'장례'},
      {k:['대출','이자','상환'], c:'finance', s:'대출이자'},
      {k:['호텔','펜션','리조트','숙소'], c:'leisure', s:'여행'},
      {k:['정비','카센터','타이어','세차'], c:'other', s:'정비&수리'}
    ];
    for(var ri=0; ri<rules.length; ri++) {
      for(var ki=0; ki<rules[ri].k.length; ki++) {
        if(st.indexOf(rules[ri].k[ki]) >= 0) return {c:rules[ri].c, s:rules[ri].s};
      }
    }
    if(isMart) return {c:'food',s:'식자재'};
    if(isCVS)  return {c:'other',s:'편의점'};
 
    /* 학습 데이터 참조 */
    var learned = getLearnedCategory(storeName);
    if(learned) return {c:learned.catId, s:learned.subCat};
 
    return {c:'other',s:''};
  }
 
 /* ── CSV/엑셀 파일 읽기 ── */
  function handleFile(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    setErrMsg('');
    var ext = file.name.split('.').pop().toLowerCase();
    setUploadFileName(file.name);
    if(ext === 'csv' || ext === 'txt') {
      /* CSV 파싱 */
      if(typeof Papa === 'undefined') {
        setErrMsg('CSV 파서가 로딩되지 않았습니다.');
        return;
      }
      Papa.parse(file, {
        header: true,
        encoding: 'UTF-8',
        skipEmptyLines: true,
        complete: function(result) {
          processData(result.data);
        },
        error: function(err) {
          setErrMsg('CSV 읽기 실패: ' + err.message);
        }
      });
    } else if(ext === 'xlsx' || ext === 'xlsm' || ext === 'xls') {
      /* ★ 엑셀 파싱 (SheetJS) */
      if(typeof XLSX === 'undefined') {
        setErrMsg('엑셀 파서가 로딩되지 않았습니다. 페이지를 새로고침 해주세요.');
        return;
      }
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = new Uint8Array(ev.target.result);
          var workbook = XLSX.read(data, {type:'array'});
          var sheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[sheetName];
          var rawRows = XLSX.utils.sheet_to_json(worksheet, {header:1, defval:''});

          /* ★ 신한카드 명세서 자동 감지 및 파싱 */
          var parsed = [];
          var isShinhan = rawRows.some(function(r){ return String(r[0]||'').indexOf('총합계') >= 0 || String(r[1]||'') === '본인'; });

          if(isShinhan) {
            /* 신한카드 포맷: A=일자, B=본인, C=가맹점, D=이용금액, F=내실금액 */
            for(var ri = 0; ri < rawRows.length; ri++) {
              var row = rawRows[ri];
              var cellA = String(row[0] || '').trim();
              var cellB = String(row[1] || '').trim();
              var cellC = String(row[2] || '').trim();
              var cellD = row[3]; /* 이용금액 */
              var cellF = row[5]; /* 내실금액 */

              /* 유효 데이터 행: B열이 '본인'이고 C열(가맹점)이 있는 행 */
              if(cellB !== '본인' || !cellC) continue;
              /* 합계/소계 행 스킵 */
              if(cellC.indexOf('합계') >= 0 || cellC.indexOf('소계') >= 0) continue;

              /* 날짜 변환: 26.03.13 → 2026-03-13 / 25.05.11 → 2025-05-11 */
              var dateStr = '';
              var dm = cellA.match(/^(\d{2})\.(\d{2})\.(\d{2})$/);
              if(dm) {
                var yr = parseInt(dm[1]);
                dateStr = (yr < 50 ? '20' : '19') + dm[1] + '-' + dm[2] + '-' + dm[3];
              } else {
                dateStr = new Date().toISOString().split('T')[0];
              }

              /* 금액: D열(이용금액) 우선, 없으면 F열(내실금액) */
              var rawAmt = cellD ? String(cellD) : String(cellF || '0');
              var amount = Math.abs(parseInt(String(rawAmt).replace(/[^0-9-]/g,'')) || 0);
              if(amount <= 0) {
                /* D열도 F열도 없으면 스킵 */
                var fallback = Math.abs(parseInt(String(cellF || '0').replace(/[^0-9-]/g,'')) || 0);
                if(fallback > 0) amount = fallback; else continue;
              }

              parsed.push({
                store: cellC,
                amount: amount,
                date: dateStr,
                method: '신한카드'
              });
            }
          } else {
            /* 일반 엑셀: 첫 번째 행을 헤더로 사용 */
            if(rawRows.length < 2) { setErrMsg('데이터가 비어있습니다.'); return; }
            var headers = rawRows[0].map(function(h){ return String(h||'').trim(); });
            var storeIdx = headers.findIndex(function(h){ return h.indexOf('가맹점')>=0||h.indexOf('상호')>=0||h.indexOf('이용처')>=0||h.indexOf('매장')>=0; });
            var amtIdx = headers.findIndex(function(h){ return h.indexOf('금액')>=0||h.indexOf('결제')>=0||h.indexOf('이용금액')>=0; });
            var dateIdx = headers.findIndex(function(h){ return h.indexOf('날짜')>=0||h.indexOf('일자')>=0||h.indexOf('일시')>=0; });
            if(storeIdx < 0) storeIdx = 0;
            if(amtIdx < 0) amtIdx = 1;
            if(dateIdx < 0) dateIdx = 2;

            for(var gi = 1; gi < rawRows.length; gi++) {
              var grow = rawRows[gi];
              var gStore = String(grow[storeIdx] || '').trim();
              var gAmt = Math.abs(parseInt(String(grow[amtIdx] || '0').replace(/[^0-9-]/g,'')) || 0);
              var gDate = String(grow[dateIdx] || '').trim().replace(/\./g,'-').replace(/\//g,'-');
              if(gDate.length === 8) gDate = gDate.slice(0,4)+'-'+gDate.slice(4,6)+'-'+gDate.slice(6,8);
              if(!gDate || gDate.length < 10) gDate = new Date().toISOString().split('T')[0];
              if(gAmt > 0 && gStore) {
                parsed.push({ store: gStore, amount: gAmt, date: gDate, method: '카드' });
              }
            }
          }

          if(parsed.length === 0) {
            setErrMsg('유효한 거래 데이터를 찾지 못했습니다.\n엑셀 파일 형식을 확인해주세요.');
            return;
          }

          /* forceCorrect 적용 후 rows 상태에 세팅 */
          var finalRows = parsed.map(function(p, idx) {
            var result = forceCorrect(p.store, p.amount);
            return {
              id: Date.now() + idx,
              store: p.store,
              amount: p.amount,
              date: p.date,
              method: p.method,
              catId: result.c,
              subCat: result.s,
              selected: true,
              saved: false
            };
          });
          setRows(finalRows);
          setStatus('preview');
        } catch(ex) {
          setErrMsg('엑셀 파일 읽기 실패: ' + ex.message);
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      setErrMsg('지원 형식: .csv, .xlsx, .xlsm\n카드사 앱에서 다운로드한 파일을 업로드하세요.');
    }
    e.target.value = '';
  }
 
  /* ── 데이터 처리 + 자동 분류 ── */
  function processData(data) {
    if(!data || data.length === 0) { setErrMsg('데이터가 비어있습니다.'); return; }
    var cols = Object.keys(data[0]);
    var storeCol = cols.find(function(c){return c.indexOf('가맹점')>=0||c.indexOf('상호')>=0||c.indexOf('이용처')>=0||c.indexOf('매장')>=0;}) || cols[0];
    var amtCol = cols.find(function(c){return c.indexOf('금액')>=0||c.indexOf('결제')>=0||c.indexOf('이용금액')>=0;}) || cols[1];
    var dateCol = cols.find(function(c){return c.indexOf('날짜')>=0||c.indexOf('일자')>=0||c.indexOf('일시')>=0||c.indexOf('거래')>=0;}) || cols[2];
    var methodCol = cols.find(function(c){return c.indexOf('카드')>=0||c.indexOf('결제수단')>=0;});
 
    var parsed = data.map(function(row, idx) {
      var store = (row[storeCol] || '').trim();
      var rawAmt = (row[amtCol] || '0').replace(/[^0-9-]/g, '');
      var amount = Math.abs(parseInt(rawAmt) || 0);
      var date = (row[dateCol] || '').trim();
      if(date.length >= 8) {
        date = date.replace(/\./g, '-').replace(/\//g, '-');
        if(date.length === 8) date = date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8);
      }
      if(!date || date.length < 10) date = new Date().toISOString().split('T')[0];
      var method = methodCol ? (row[methodCol] || '카드').trim() : '카드';
      var result = forceCorrect(store, amount);
 
      return {
        id: Date.now() + idx,
        store: store,
        amount: amount,
        date: date,
        method: method,
        catId: result.c,
        subCat: result.s,
        selected: amount > 0,
        saved: false
      };
    }).filter(function(r) { return r.amount > 0 && r.store; });
 
    setRows(parsed);
    setStatus('preview');
  }
 
  /* ── 선택된 항목 일괄 저장 ── */
  function saveAll() {
    var targets = rows.filter(function(r){ return r.selected && !r.saved; });
    if(targets.length === 0) return alert('저장할 항목이 없습니다.');
    setStatus('saving');
    var saved = 0;
    targets.forEach(function(r, idx) {
      setTimeout(function() {
        saveLearnedCategory(r.store, r.catId, r.subCat);
        onAdd({
          id: Date.now() + idx,
          type: 'expense',
          amount: r.amount,
          catId: r.catId,
          subCat: r.subCat,
          store: r.store,
          member: 'dad',
          date: r.date,
          method: r.method,
          source: 'bulk'
        }, false);
        saved++;
        setProgress(Math.round(saved / targets.length * 100));
        if(saved === targets.length) {
          var updatedRows = rows.map(function(row){ return row.selected ? Object.assign({},row,{saved:true}) : row; });
          setRows(updatedRows);
          setStatus('done');
          /* ★ 보관함에 자동 기록 */
          var archive = lsGet(LS_CARD_ARCHIVE, []);
          var cardName = '카드';
          if(uploadFileName.indexOf('신한') >= 0) cardName = '신한카드';
          else if(uploadFileName.indexOf('국민') >= 0 || uploadFileName.indexOf('KB') >= 0) cardName = 'KB국민카드';
          else if(uploadFileName.indexOf('하나') >= 0) cardName = '하나카드';
          else if(uploadFileName.indexOf('우리') >= 0) cardName = '우리카드';
          else if(uploadFileName.indexOf('현대') >= 0) cardName = '현대카드';
          else if(uploadFileName.indexOf('삼성') >= 0) cardName = '삼성카드';
          else if(uploadFileName.indexOf('롯데') >= 0) cardName = '롯데카드';
          else if(uploadFileName.indexOf('NH') >= 0 || uploadFileName.indexOf('농협') >= 0) cardName = 'NH농협카드';
          archive.unshift({
            id: Date.now(),
            uploadDate: new Date().toISOString().split('T')[0],
            cardName: cardName,
            fileName: uploadFileName,
            totalCount: rows.length,
            savedCount: targets.length,
            skippedCount: rows.length - targets.length,
            items: updatedRows.map(function(r){ return {store:r.store, amount:r.amount, date:r.date, catId:r.catId, subCat:r.subCat, method:r.method, saved:r.saved}; })
          });
          lsSet(LS_CARD_ARCHIVE, archive);
        }
      }, idx * 100);
    });
  }

    setRows(rows.map(function(r){ return r.id===id ? Object.assign({},r,changes) : r; }));

function VoiceIn(props) {
  var apiKey = lsGet(LS_GEMINI, '');
  var isRecording = useState(false); var setIsRecording = isRecording[1]; isRecording = isRecording[0];
  var transcript = useState('');     var setTranscript = transcript[1]; transcript = transcript[0];
  function startVoice() {
    if(!apiKey) return alert('API 키 필요');
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert('지원불가 브라우저');
    var rec = new SpeechRecognition(); rec.lang = 'ko-KR'; rec.start(); setIsRecording(true);
    rec.onresult = function(e) {
      var speech = e.results[0][0].transcript; setTranscript(speech); setIsRecording(false);

function CardArchiveModal(props) {
  var onClose = props.onClose;

  var archives = useState(function(){ return lsGet(LS_CARD_ARCHIVE, []); });
  var setArchives = archives[1]; archives = archives[0];
  var detailId = useState(null); var setDetailId = detailId[1]; detailId = detailId[0];
  var selItems = useState({}); var setSelItems = selItems[1]; selItems = selItems[0];

  function deleteArchive(id) {
    if(!confirm('이 업로드 기록을 삭제할까요?')) return;
    var updated = archives.filter(function(a){ return a.id !== id; });
    setArchives(updated);
    lsSet(LS_CARD_ARCHIVE, updated);
    if(detailId === id) setDetailId(null);
  }

  function reAddSelected(arc) {
    var keys = Object.keys(selItems).filter(function(k){ return selItems[k]; });
    if(keys.length === 0) return alert('등록할 항목을 선택하세요.');
    var unsaved = arc.items.filter(function(item, idx){ return !item.saved && selItems[idx]; });
    unsaved.forEach(function(item, i) {
      setTimeout(function() {
        onReAdd({
          id: Date.now() + i,
          type: 'expense',
          amount: item.amount,
          catId: item.catId,
          subCat: item.subCat || '',
          store: item.store,
          member: 'dad',
          date: item.date,
          method: item.method || '카드',
          source: 'bulk'
        }, false);
      }, i * 100);
    });
    /* 보관함에서 해당 항목 saved 처리 */
    var updatedArchives = archives.map(function(a) {
      if(a.id !== arc.id) return a;
      var newItems = a.items.map(function(item, idx) {
        if(selItems[idx]) return Object.assign({}, item, {saved: true});
        return item;
      });
      return Object.assign({}, a, {
        items: newItems,
        savedCount: newItems.filter(function(it){ return it.saved; }).length,
        skippedCount: newItems.filter(function(it){ return !it.saved; }).length

    });
    setArchives(updatedArchives);
    lsSet(LS_CARD_ARCHIVE, updatedArchives);
    setSelItems({});

            return h(GCard, {key:arc.id, style:{marginBottom:10, border:'1px solid '+C.border, cursor:'pointer'}},
              h('div', {onClick:function(){ setDetailId(arc.id); setSelItems({}); }, style:{display:'flex', alignItems:'center', gap:10}},
                h('div', {style:{width:40, height:40, borderRadius:10, background:C.accent+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}, '💳'),
                h('div', {style:{flex:1, minWidth:0}},
                  h('p', {style:{color:C.text, fontSize:13, fontWeight:700, margin:'0 0 2px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}, arc.cardName + ' — ' + arc.fileName),
                  h('p', {style:{color:C.muted, fontSize:10, margin:0}}, arc.uploadDate + ' 업로드')
                ),
                h('div', {style:{textAlign:'right', flexShrink:0}},
                  h('p', {style:{color:C.green, fontSize:12, fontWeight:700, margin:'0 0 2px'}}, '등록 ' + arc.savedCount + '건'),

                )

                h('button', {onClick:function(e){ e.stopPropagation(); deleteArchive(arc.id); }, style:{padding:'4px 10px', borderRadius:6, border:'none', background:C.red+'22', color:C.red, fontSize:10, fontWeight:700, cursor:'pointer'}}, '🗑️ 삭제')
              )
            );
          })
    )
    : h('div', null,
        h('div', {style:{display:'flex', alignItems:'center', gap:8, marginBottom:14}},
          h('button', {onClick:function(){ setDetailId(null); setSelItems({}); }, style:{background:'none', border:'none', fontSize:18, color:C.muted, cursor:'pointer'}}, '←'),
          h('div', {style:{flex:1}},
            h('p', {style:{color:C.text, fontSize:14, fontWeight:700, margin:0}}, detail.cardName),

        ),
        h('div', {style:{maxHeight:400, overflowY:'auto'}},
          (detail.items || []).map(function(item, idx) {
            var cat = getCat(item.catId);
            var isUnsaved = !item.saved;
            var isSel = !!selItems[idx];
            return h('div', {key:idx, style:{display:'flex', alignItems:'center', gap:8, padding:'8px 0', borderBottom:'1px solid '+C.faint, opacity:item.saved?0.5:1}},

              h('div', {style:{flex:1, minWidth:0}},

      )
  );

// 엑셀/CSV 업로드를 처리하는 전문 컴포넌트입니다.
function BulkIn(props) {
  var fileRef = useRef(null);

  var handleFile = function(e) {
    var file = e.target.files[0];
    if (!file) return;

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        var newTxs = results.data.map(function(row) {
          return {
            id: Date.now() + Math.random(),
            date: row['날짜'] || new Date().toISOString().split('T')[0],
            type: row['유형'] === '수입' ? 'income' : 'expense',
            amount: parseInt(row['금액']) || 0,
            catId: row['카테고리ID'] || 'other',
            store: row['상호명'] || 'CSV업로드',
            member: row['구성원ID'] || 'user',
            method: row['결제수단'] || '기타',
            source: 'bulk'
          };
        });

        // 데이터 저장 (기본 가계부 로직 준수)
        newTxs.forEach(function(tx) {
          props.onAdd(tx); // 상위 컴포넌트의 저장 함수 호출
        });

        alert(newTxs.length + '건의 데이터가 성공적으로 등록되었습니다.');
        props.onBack();
      }
    });
  };

  return h('div', {style:{padding:'0 16px'}},
    h(Hdr, {title:'대량 업로드', left:h('button',{onClick:props.onBack, style:{background:'none',border:'none',color:C.accent}},'←')}),
    h('div', {style:{textAlign:'center', padding:'40px 20px', background:C.card, borderRadius:16, border:'2px dashed '+C.faint}},
      h('input', {type:'file', ref:fileRef, style:{display:'none'}, accept:'.csv', onChange:handleFile}),
      h('div', {style:{fontSize:48, marginBottom:16}}, '📊'),
      h('p', {style:{color:C.text, fontWeight:700}}, 'CSV 파일을 선택해주세요'),
      h('p', {style:{color:C.muted, fontSize:12, marginBottom:24}}, '날짜, 유형, 금액, 카테고리ID... 항목이 필요합니다.'),
      h('button', {
        onClick: function(){ fileRef.current.click(); },
        style: {background:C.accent, color:'#fff', border:'none', padding:'12px 24px', borderRadius:8, fontWeight:700}
      }, '파일 찾기')
    )
  );
}

          '100%{transform:translateY(0px) rotate(0deg) scale(1)}' +
        '}';
      document.head.appendChild(_sEl);
    }
    
    var ctx = cv.getContext('2d');
    var cSize = size * 1.8; // 파동 반경 축소에 맞춰 캔버스 크기도 1.8배로 타협
    cv.width = cSize;
    cv.height = cSize;
    
    var cx = cSize / 2, cy = cSize / 2;
    var R = size * 0.38;
    var R_in = size * 0.25;

    function draw() {
      timeRef.current += 0.012;
      var t = timeRef.current;
      var total = data.reduce(function(s, d) { return s + d.value; }, 0);
      
      // 화면 지우기 (사각틀 원천 차단)
      ctx.clearRect(0, 0, cSize, cSize);

      if (total === 0) return;

      var currentTheme = localStorage.getItem('flai_theme') || 'dark';
      var isLight = currentTheme === 'light';
      var baseTime = Date.now();

      // =========================================================
      // ★ 1. 카멜레온 물결 파동 렌더링 (범위 축소, 두께 얇게, 허연 원형 제거)
      // =========================================================
      var numWaves = 3; 
      for (var w = 0; w < numWaves; w++) {
        var waveCycle = 4000; 
        var phase = ((baseTime + w * (waveCycle / numWaves)) % waveCycle) / waveCycle; 
        
        // 반경 확장을 대폭 축소하여 옆 글씨(KPI) 침범을 막음
        var waveRadius = R + phase * (size * 0.25);
        // 부드럽게 사라지도록 투명도 조절
        var waveAlpha = Math.max(0, (1.0 - phase * 1.5)) * 0.6; 
        var hue = (baseTime * 0.08 + w * 120) % 360; // 무지개 색상 변환
        
        ctx.beginPath();
        for (var a = 0; a <= Math.PI * 2; a += 0.1) {
          // 물결 일렁임(Noise) 정도도 얌전하게 축소
          var noise = Math.sin(a * 6 + baseTime * 0.003) * (4 + phase * 6);
          var curR = waveRadius + noise;
          var wx = cx + Math.cos(a) * curR;
          var wy = cy + Math.sin(a) * curR;
          if (a === 0) ctx.moveTo(wx, wy);
          else ctx.lineTo(wx, wy);
        }
        ctx.closePath();
        
        ctx.strokeStyle = 'hsla(' + hue + ', 100%, 60%, ' + waveAlpha + ')';
        ctx.lineWidth = 1 + phase * 4; // 선 두께를 얇게 유지 (떡짐 방지)
        ctx.shadowColor = 'hsl(' + hue + ', 100%, 60%)';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

       // =========================================================
      // ★ 2. 투명한 유리 케이스 안의 선명한 도넛 차트 (Glassmorphism)
      // =========================================================
      
      // (1) 유리관 배경 (어두운 바닥면 렌더링)
      ctx.beginPath();
      ctx.arc(cx, cy, (R + R_in) / 2, 0, Math.PI * 2);
      ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.3)';
      ctx.lineWidth = R - R_in;
      ctx.stroke();

      // (2) 데이터 코어 렌더링 (조각 간 경계를 명확하게 분리)
      var sAngle = -Math.PI / 2;
      var gap = 0.06; // 데이터 조각 사이의 명확한 간격(Gap)
      
      data.forEach(function(d, idx) {
        var arc = (d.value / total) * Math.PI * 2;
        if (arc < 0.01) { sAngle += arc; return; }

        var palette = isLight ? [
          '#FF7E67', '#00CECE', '#FFC312', '#00E676', '#D980FA'
        ] : [
          '#FF007C', '#00E5FF', '#FFD600', '#69F0AE', '#CE93D8'
        ];
        var col = palette[idx % palette.length];

        var start = sAngle + (data.length > 1 ? gap / 2 : 0);
        var end = sAngle + arc - (data.length > 1 ? gap / 2 : 0);
        if (end < start) end = start;

        // 튜브 안에 담긴 선명한 형광 액체
        ctx.beginPath();
        ctx.arc(cx, cy, (R + R_in) / 2, start, end);
        ctx.strokeStyle = col;
        ctx.lineWidth = (R - R_in) * 0.85; // 유리벽과 살짝 틈을 주어 입체감 향상
        ctx.lineCap = 'butt'; // 직각 절단면으로 경계 뚜렷하게 분할
        ctx.shadowColor = col;
        ctx.shadowBlur = 4; // 빛 번짐을 최소화하여 선명도 극대화
        ctx.stroke();
        ctx.shadowBlur = 0;

        sAngle += arc;
      });

      // (3) 유리 케이스 표면 덮어씌우기 (빛 반사 및 굴절 효과)
      // 외곽 유리벽 테두리
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.strokeStyle = isLight ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      
      // 내곽 유리벽 테두리
      ctx.beginPath();
      ctx.arc(cx, cy, R_in, 0, Math.PI * 2);
      ctx.strokeStyle = isLight ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 상단 입체 반사광 (유리관 위에 맺히는 볼록한 빛)
      ctx.beginPath();
      ctx.arc(cx, cy, R - (R - R_in) * 0.25, -Math.PI * 0.8, -Math.PI * 0.2);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = (R - R_in) * 0.15;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 하단 어두운 굴절 (입체감 부여)
      ctx.beginPath();
      ctx.arc(cx, cy, R_in + (R - R_in) * 0.25, Math.PI * 0.2, Math.PI * 0.8);
      ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.4)';
      ctx.lineWidth = (R - R_in) * 0.15;
      ctx.lineCap = 'round';
      ctx.stroke();

      // =========================================================
      // ★ 3. 중앙 텍스트 캡 보호막
      ctx.beginPath(); ctx.arc(cx, cy, R_in, 0, Math.PI * 2);
      ctx.fillStyle = isLight ? '#FFFFFF' : '#0B0D19';
      ctx.shadowColor = isLight ? 'rgba(0,0,0,0.04)' : 'rgba(0,245,255,0.08)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = isLight ? '#CBD5E1' : 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = isLight ? '#64748B' : 'rgba(255,255,255,0.5)';
      ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('총지출', cx, cy - 6);

      ctx.fillStyle = isLight ? '#0F172A' : '#FFFFFF';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(totalLabel, cx, cy + 6);

      rafRef.current = requestAnimationFrame(draw);
    }
    
    draw();
    
    return function() { cancelAnimationFrame(rafRef.current); };
  }, [data, size, totalLabel]);

  // 반환부 (캔버스 위치 중앙 정렬 및 주변 UI 밀림 방지)
  return h('div', {style:{
    position:'relative', flexShrink:0,
    width: size + 'px', height: size + 'px',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    overflow: 'visible',
    animation:'hpdFloat 5.4s ease-in-out infinite'
  }},
    h('canvas', {
      ref: cvRef, 
      style: {
        position:'absolute', zIndex:2,
        top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
        width: (size * 1.8) + 'px', height: (size * 1.8) + 'px', 
        display:'block', pointerEvents:'none'
      }
    })
  );
}

/* 2. 기둥 내부에서 번개가 질주하는 전류 에너지 프로그레스 바 (4.5초 주기 정교화 버전) */
function PlasmaProgressBar(props) {
  var pct = props.pct || 0;
  var color = props.color || '#00FFFF';
  var height = props.height || 10;
  var cvRef = React.useRef(null);
  var rafRef = React.useRef(null);

  React.useEffect(function() {
    var cv = cvRef.current; if (!cv) return;
    var ctx = cv.getContext('2d');
    cv.height = height;
    var W = cv.width;

    function draw() {
      ctx.clearRect(0, 0, W, height);
      var isLight = localStorage.getItem('flai_theme') === 'light';

      ctx.beginPath();
      ctx.moveTo(0, height / 2); ctx.lineTo(W, height / 2);
      ctx.strokeStyle = isLight ? '#E2E8F0' : 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.stroke();

      // 4.5초 주기 정밀 시간 제어 연산
      var cycleDuration = 4500;
      var surgeDuration = 2000;
      var t = Date.now() % cycleDuration;

      var progress = 1.0;
      if (t < surgeDuration) {
        progress = t / surgeDuration;
      }

      var currentW = (pct / 100) * W * progress;

      if (currentW > 0) {
        ctx.beginPath();
        ctx.moveTo(0, height / 2); ctx.lineTo(currentW, height / 2);
        ctx.strokeStyle = color + '22';
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.beginPath();
        var segments = Math.max(5, Math.floor(currentW / 14));
        ctx.moveTo(0, height / 2);
        for (var i = 1; i <= segments; i++) {
          var x = (i / segments) * currentW;
          var jitter = (Math.random() - 0.5) * 4.5;
          if (i === segments) jitter = 0;
          ctx.lineTo(x, height / 2 + jitter);
        }
        ctx.strokeStyle = isLight ? '#00BFA5' : '#00F5FF'; // 밝은 청색 고정
        ctx.lineWidth = 1.8;
        ctx.shadowColor = isLight ? '#00BFA5' : '#00F5FF';
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 0.6;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(currentW, height / 2, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = isLight ? '#00BFA5' : '#00F5FF';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      rafRef.current = requestAnimationFrame(draw);
    }
    draw();
    return function() { cancelAnimationFrame(rafRef.current); };
  }, [pct, color, height]);

  return h('canvas', { ref: cvRef, style: { width: '100%', height: height + 'px', display: 'block', pointerEvents: 'none' } });
}

function App() {

  var curUser   = useState(savedUser);     var setCurUser  = curUser[1];   curUser  = curUser[0];

  var isPopNav = useRef(false);

      if (e.state && e.state.tab) {
        isPopNav.current = true;
        setTab(e.state.tab);
      }
    }
    window.addEventListener('popstate', handlePop);
    return function() { window.removeEventListener('popstate', handlePop); };
  }, []);
  var dpArr = useState('이번달'); var globalDp = dpArr[0]; var setGlobalDp = dpArr[1];
  var baseDateArr = useState(new Date()); var globalBaseDate = baseDateArr[0]; var setGlobalBaseDate = baseDateArr[1];
  var toast     = useState(null);          var setToast    = toast[1];     toast    = toast[0];
  var txs       = useState(function(){ return lsGet(LS_TXS, []); });       var setTxs = txs[1]; txs = txs[0];
  var cards     = useState(function(){ return lsGet(LS_CARDS, INIT_CARDS); }); var setCards = cards[1]; cards = cards[0];
  var fixedExps = useState(function(){ return lsGet(LS_FIXED, []); });     var setFixedExps = fixedExps[1]; fixedExps = fixedExps[0];
  var startDay  = useState(function(){ return lsGet(LS_START_DAY, 1); });  var setStartDay = startDay[1]; startDay = startDay[0];
  var dupModal  = useState(null);          var setDupModal  = dupModal[1];  dupModal  = dupModal[0];
  var pendingTx = useState(null);          var setPendingTx = pendingTx[1]; pendingTx = pendingTx[0];

/* ★★★ [고정지출 자동기록 v2] 중복방지 + 확인창 ★★★ */
  useEffect(function() {
    try {
      var today = new Date();
      var todayDay  = today.getDate();
      var monthKey  = today.toISOString().slice(0, 7); /* YYYY-MM */
      var recorded  = lsGet(LS_AUTO_RECORDED, {});
      var currentFixed = lsGet(LS_FIXED, []);
      var existingTxs  = lsGet(LS_TXS, []);

      /* ─── 이번 달에 아직 자동기록 안 된 항목만 추림 ─── */
      var toRecord = currentFixed.filter(function(fx) {
        if(!fx.dayOfMonth) return false;
        /* 아직 해당 날짜가 안 됐으면 건너뜀 */
        if(todayDay < parseInt(fx.dayOfMonth)) return false;

        /* 방어막 1: LS_AUTO_RECORDED 체크 */
        var recordKey = String(fx.id) + '_' + monthKey;
        if(recorded[recordKey]) return false;

        /* 방어막 2: 실제 txs에서도 같은 항목 이미 있는지 체크
           (앱 재설치 / localStorage 초기화 대비) */
        var alreadyExists = existingTxs.some(function(t) {
          return t.source === 'auto_fixed'
              && t.date && t.date.startsWith(monthKey)
              && String(t.amount) === String(fx.amount)
              && (t.store || '') === (fx.store || '');
        });
        if(alreadyExists) {
          /* txs엔 있는데 recorded엔 없으면 동기화 */
          recorded[recordKey] = true;
          lsSet(LS_AUTO_RECORDED, recorded);
          return false;
        }

        return true;
      });

      if(toRecord.length === 0) return;

      /* ─── 확인창 (중복 방지의 마지막 방어선) ─── */
      var msg = '📌 오늘 자동기록할 고정지출 ' + toRecord.length + '건:\n\n'
        + toRecord.map(function(fx) {
            return '• ' + (fx.store||'미입력') + '  ' + fmt(fx.amount)
              + '  (매월 ' + fx.dayOfMonth + '일)';
          }).join('\n')
        + '\n\n지출 내역에 자동 기록할까요?';

      if(!window.confirm(msg)) return;

      /* ─── LS_AUTO_RECORDED를 먼저 한 번에 저장 (중복 방지 핵심!) ─── */
      var newRecorded = Object.assign({}, recorded);
      toRecord.forEach(function(fx) {
        newRecorded[String(fx.id) + '_' + monthKey] = true;
      });
      lsSet(LS_AUTO_RECORDED, newRecorded); /* 동기 저장 → 이후 중복 차단 */

      /* ─── 실제 저장 ─── */
      var todayStr = today.toISOString().split('T')[0];
      toRecord.forEach(function(fx, idx) {
        var autoTx = {
          id: Date.now() + idx,
          type: 'expense',
          amount: fx.amount,
          catId: fx.catId || 'other',
          subCat: fx.subCat || '',
          store: fx.store || '고정지출',
          memo: '📌 자동기록 (매월 ' + fx.dayOfMonth + '일)',
          member: fx.member || 'dad',
          date: todayStr,
          method: fx.method || '기타',
          source: 'auto_fixed'
        };
        if(fbDb) {
          fbSaveTx(autoTx);
        } else {
          setTxs(function(prev) {
            var n = [autoTx].concat(prev);
            lsSet(LS_TXS, n);
            return n;
          });
        }
      });

      /* ─── 완료 토스트 ─── */
      setTimeout(function() {
        setToast('📌 고정지출 ' + toRecord.length + '건 자동기록 완료!');
        setTimeout(function(){ setToast(null); }, 3000);
      }, 800);

      /* ─── 알림 발송 ─── */
      if('Notification' in window && Notification.permission === 'granted') {
        setTimeout(function() {
          sendNotif(
            '📌 고정지출 자동기록 완료',
            toRecord.length + '건이 오늘 자동으로 기록되었습니다',
            'auto-fixed-' + Date.now()
          );
        }, 2000);
      }
    } catch(autoErr) { console.warn('[자동기록 오류]', autoErr); }
  }, []);
  /* ★★★ [자동기록 끝] ★★★ */

  // ★ 추가: 알림 무한반복을 막기 위한 방어벽
   // ★ 알림: 첫 Firebase 스냅샷은 무시, 이후에는 "이전에 없던 id"만 새 내역으로 판정 (arr[0]은 날짜 정렬이라 틀릴 수 있음)
  var isFirstLoad = useRef(true);
  var prevTxIdsRef = useRef(new Set());

  useEffect(function(){
    var r = fbRef('txs'); if(!r) return;
    r.on('value', function(snap){ 
      var data = snap.val(); 
      if(data){ 
          var arr = Object.values(data).sort(function(a,b){
          var td = new Date(b.date||0) - new Date(a.date||0);
          if (td !== 0) return td;
          return (Number(b.id)||0) - (Number(a.id)||0);
        });  
        
       // ★★★ [실제 휴대폰 네이티브 알림 시스템] ★★★
        if(!isFirstLoad.current) {
          var prevSet = prevTxIdsRef.current;
          var newItems = arr.filter(function(t){ return t && !prevSet.has(String(t.id)); });
          if(newItems.length > 0) {
            newItems.sort(function(a,b){ return (Number(b.id)||0) - (Number(a.id)||0); });
            var latestNewTx = newItems[0];
            var alarms = lsGet(LS_ALARMS, {newTx:true, budget:true, monthly:true, ai:true, income:false});
            if('Notification' in window && Notification.permission === 'granted') {
              var arrSnap = arr;
              // ★ 수정: 3000ms 지연 제거 → 즉시 실행
(function() {
  var tx = latestNewTx;
  var memObj = MEMBERS.find(function(m){return m.id===tx.member}) || {name:'가족'};
  var catObj = EX_CATS.find(function(c){return c.id===tx.catId}) || {name:'기타'};
  var alarms = lsGet(LS_ALARMS, {newTx:true, budget:true, monthly:true, ai:true, income:false});
  if(tx.type === 'income' && alarms.income) {
    sendNotif('💵 수입 입력', memObj.name + '님이 수입을 입력했어요\n' + (tx.store || '상호명 없음') + ' | ' + (tx.amount||0).toLocaleString() + '원', 'income-' + tx.id);
  }
  if(tx.type === 'expense' && alarms.newTx) {
    sendNotif('💰 가계부 업데이트', memObj.name + '님이 ' + catObj.name + ' 입력\n' + (tx.store || '상호명 없음') + ' | ' + (tx.amount||0).toLocaleString() + '원', 'expense-' + tx.id);
  }
})();
            }
          }
        }
        prevTxIdsRef.current = new Set(arr.map(function(t){ return String(t.id); }));
        isFirstLoad.current = false;
        // ★★★ [알림 시스템 끝] ★★★

        setTxs(arr); 
        lsSet(LS_TXS, arr); 
      } 
    });
    var rf = fbRef('fixed'); if(rf) rf.on('value', function(snap){ var data = snap.val(); if(data){ var arr = Object.values(data); setFixedExps(arr); lsSet(LS_FIXED, arr); } });
  }, []);

/* ★★★ [공통 알림 발송 함수] 모바일/PC 모두 대응 — PWA 수정 완료 ★★★ */
function sendNotif(title, body, tag) {
  if(!('Notification' in window)) return Promise.reject('미지원 브라우저');
  if(Notification.permission !== 'granted') return Promise.reject('권한없음');
  var opts = {
    body: body || '',
    icon: 'https://kimyungkook.github.io/family-ledger/icon-192.png',
    badge: 'https://kimyungkook.github.io/family-ledger/icon-192.png',
    tag: tag || ('notif-' + Date.now()),
    vibrate: [200, 100, 200],
    requireInteraction: false
  };
  /* ★ 핵심수정: getRegistrations() 대신 serviceWorker.ready 사용
     → PWA 앱 모드에서도 항상 활성 서비스워커를 정확히 가져옴 */
  if('serviceWorker' in navigator) {
    return navigator.serviceWorker.ready.then(function(reg) {
      return reg.showNotification(title, opts);
    }).catch(function(swErr) {
      console.warn('[SW알림실패, 직접발송]', swErr);
      try { return new Notification(title, opts); } catch(e2) {}
    });
  }
  return new Promise(function(resolve, reject) {
    try { new Notification(title, opts); resolve(); }
    catch(e) { reject(e); }
  });
}
/* ★★★ [공통 알림 함수 끝] ★★★ */

 function doSaveTx(tx, isFixed, msg) {
  if(fbDb) { fbSaveTx(tx); if(isFixed) fbSaveFixed(tx); }
  else { setTxs(function(p){ var n=[tx].concat(p); lsSet(LS_TXS,n); return n; }); if(isFixed) setFixedExps(function(p){ var n=p.concat([tx]); lsSet(LS_FIXED,n); return n; }); }

  // ★★★ [알림 발송] 저장 즉시 알림 ★★★
  (function(){
    try {
      var alarmSettings = lsGet(LS_ALARMS, {newTx:true, income:false, budget:true});
      if(!('Notification' in window)) return;
      if(Notification.permission !== 'granted') return;
      var memObj = MEMBERS.find(function(m){ return m.id === tx.member; }) || {name:'가족'};
      var catObj = ALL_CATS.find(function(c){ return c.id === tx.catId; }) || {name:'기타', icon:'💸'};
      var isInc = tx.type === 'income';
      if(isInc && !alarmSettings.income) return;
      if(!isInc && !alarmSettings.newTx) return;
      var title = isInc ? '💵 수입 등록' : '💰 지출 등록';
      var body  = memObj.name + '님 · ' + (tx.store || '미입력') + '\n' + (isInc ? '+' : '-') + (tx.amount||0).toLocaleString() + '원 · ' + catObj.name;
      sendNotif(title, body, 'tx-' + tx.id);
      // ★ 예산 초과 경고 알림
      if(!isInc && alarmSettings.budget) {
        var budgetSet = lsGet(LS_BUDGET, 0);
        if(budgetSet > 0) {
          var curMonth = new Date().toISOString().slice(0,7);
          var allTxs2 = lsGet(LS_TXS, []);
          var curTotE = allTxs2.filter(function(t){ return t.type==='expense' && t.date && t.date.startsWith(curMonth); }).reduce(function(s,t){return s+t.amount;},0);
          var ratio = Math.round(curTotE / budgetSet * 100);
          if(ratio >= 80 && ratio < 110) {
            setTimeout(function(){
              sendNotif('🚨 예산 경고!', '이번 달 예산의 ' + ratio + '% 사용 중\n' + curTotE.toLocaleString() + '원 / ' + budgetSet.toLocaleString() + '원', 'budget-warn');
            }, 1500);
          } else if(ratio >= 110) {
            setTimeout(function(){
              sendNotif('🔴 예산 초과!', '예산을 ' + (ratio-100) + '% 초과했습니다!\n' + curTotE.toLocaleString() + '원 사용', 'budget-over');
            }, 1500);
          }
        }
      }
    } catch(notifErr) { console.warn('[알림 오류]', notifErr); }
  })();
  // ★★★ [알림 발송 끝] ★★★

  setToast(msg || '저장되었습니다'); navBack(); setTimeout(function(){setToast(null);},2000);
}

  function addTx(tx, isFixed) {
    if(!tx.amount || parseInt(tx.amount) <= 0) return;
    var newStore = (tx.store || '미입력').replace(/\s/g,'').toLowerCase();
    var dupFound = null;
    for(var di = 0; di < txs.length; di++) {
      var t = txs[di];
      var oldStore = (t.store || '').replace(/\s/g,'').toLowerCase();
      if(t.amount === tx.amount && t.date === tx.date && t.member === tx.member && (newStore === oldStore || newStore.indexOf(oldStore) >= 0 || oldStore.indexOf(newStore) >= 0)) {
        dupFound = t; break;
      }
    }
    if(dupFound) { setPendingTx({tx: tx, isFixed: isFixed}); setDupModal(dupFound); } 
    else { doSaveTx(tx, isFixed); }
  }

  /* ★★★ [updFixed 끝] ★★★ */
  function updTx(u) { if(fbDb){ fbSaveTx(u); } else { setTxs(function(p){ var n=p.map(function(t){return t.id===u.id?u:t;}); lsSet(LS_TXS,n); return n; }); } }
  function delTx(id) { if(fbDb){ fbDelTx(id); } else { setTxs(function(p){ var n=p.filter(function(t){return t.id!==id;}); lsSet(LS_TXS,n); return n; }); } }
  function bulkDel(ids) { ids.forEach(function(id){ delTx(id); }); }

  /* ★★★ [고정지출 수정 전용 함수] ★★★ */
  function updFixed(u) {
    setFixedExps(function(p) {
      var n = p.map(function(f) { return String(f.id) === String(u.id) ? u : f; });
      lsSet(LS_FIXED, n);
      return n;
    });
    var rf = fbRef('fixed/fx_' + u.id);
    if(rf) rf.set(u).catch(function(e) { console.error('[고정지출수정]', e); });
  }  
  if(!loggedIn) return h(AuthScreen, {onLogin: function(u){ lsSet(LS_USER,u); setCurUser(u); setLoggedIn(true); }});

  return h('div', {style:{ background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'Pretendard', sans-serif", maxWidth:430, margin:'0 auto', position:'relative' }},
    tab==='dashboard' && h(Dashboard,  {txs:txs, onNav:navTo, startDay:startDay, onAdd:addTx, onDelete:delTx, onUpdate:updTx, dp:globalDp, setDp:setGlobalDp, baseDate:globalBaseDate, setBaseDate:setGlobalBaseDate}),
    tab==='calendar'  && h(CalendarView, {txs:txs, startDay:startDay}),
    tab==='budget' && h(Budget, {txs:txs, startDay:startDay, dp:globalDp, baseDate:globalBaseDate, onBack:function(){navTo('dashboard');}}),
    tab==='analysis'  && h(Analysis,   {txs:txs, startDay:startDay, dp:globalDp, baseDate:globalBaseDate}),
    tab==='add'       && h(AddMenu,    {onAdd:addTx, onClose:navBack, cards:cards, fixedList:fixedExps, onDeleteFixed:delTx, onUpdateFixed:updFixed}),
    tab==='list'      && h(TxList,     {txs:txs, onUpdate:updTx, onDelete:delTx, onBulkDelete:bulkDel}),
    tab==='settings'  && h(Settings,   {txs:txs, onLogout:function(){lsDel(LS_USER); setLoggedIn(false);}, curUser:curUser, startDay:startDay, setStartDay:setStartDay}),
    h(BNav, {active:tab, onTab:navTo}),
    dupModal && h(DuplicateModal, {
      dupTx: dupModal, 
      newTx: pendingTx.tx, 
      onCancel: function(){ setDupModal(null); setPendingTx(null); },
      onForce: function(){ doSaveTx(pendingTx.tx, pendingTx.isFixed, '중복 항목을 강제 저장했습니다'); setDupModal(null); setPendingTx(null); }
    }),
    toast && h(Toast, {message:toast, onHide:function(){setToast(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
});
