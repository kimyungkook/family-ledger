    ctx.beginPath(); ctx.moveTo(70*r,74*r); ctx.lineTo(100*r,74*r); ctx.stroke();
    ctx.fillStyle = '#FF6B9D'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('-320', 122*r, 78*r);
    drawCheck(ctx, 54*r, 90*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,90*r); ctx.lineTo(108*r,90*r); ctx.stroke();

    ctx.fillStyle = 'rgba(0,229,255,0.6)'; ctx.font = (9*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('+380', 120*r, 123*r);
    ctx.fillStyle = '#00E5FF';
    ctx.beginPath(); ctx.arc(142*r, 136*r, 25*r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0A0E27';
    ctx.beginPath(); ctx.arc(142*r, 136*r, 20*r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00E5FF'; ctx.font = 'bold '+(22*r)+'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('W', 142*r, 137*r); ctx.textBaseline = 'alphabetic';
    var dots = [['#FF6B9D',53*r,18*r],['#00E5FF',66*r,14*r],['#FFD700',79*r,18*r]];
    dots.forEach(function(d){ ctx.fillStyle=d[0]; ctx.beginPath(); ctx.arc(d[1],d[2],5*r,0,Math.PI*2); ctx.fill(); });
  }
  function drawCheck(ctx, x, y, r, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.8*r; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+4*r,y+4*r); ctx.lineTo(x+10*r,y-4*r); ctx.stroke();
  }
  function roundRect(ctx, x, y, w, h, rad) {
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.lineTo(x+w-rad,y);
    ctx.arcTo(x+w,y,x+w,y+rad,rad); ctx.lineTo(x+w,y+h-rad);
    ctx.arcTo(x+w,y+h,x+w-rad,y+h,rad); ctx.lineTo(x+rad,y+h);
    ctx.arcTo(x,y+h,x,y+h-rad,rad); ctx.lineTo(x,y+rad);
    ctx.arcTo(x,y,x+rad,y,rad); ctx.closePath();
  }

// ★★★ [STEP1-완성판] 카드 결제일 시스템 ★★★
var LS_CARD_BILLING_DAY = 'flai_card_billing_day';

/* 결제일 기준 기간 계산 (billingDay=12 → 전월13일~당월12일) */
function getCardBillingPeriod(billingDay, baseDate) {
  var bd = Math.max(1, Math.min(28, parseInt(billingDay) || 12));
  var y  = baseDate.getFullYear();
  var m  = baseDate.getMonth(); // 0-indexed
  var sy = y, sm = m - 1;
  if (sm < 0) { sm = 11; sy--; }
  return {
    start: new Date(sy, sm, bd + 1, 0, 0, 0),
    end:   new Date(y,  m,  bd,     23, 59, 59)
  };
}

/* ★★★ 핵심 수정: 등록카드(bank_name 형식) + 직접입력(신용카드) 모두 잡는 판별 함수 ★★★ */
function isCreditCardMethod(method) {
  if (!method) return false;
  var m = method.toString();
  // 1. 직접 '신용카드' 또는 '신용' 포함
  if (m === '신용카드' || m.indexOf('신용') >= 0) return true;
  // 2. 명백한 비신용 결제 방법 → 즉시 false
  var notCredit = ['체크카드','현금','이체','카카오페이','네이버페이','상품권','지역화폐','기타','카드'];
  for (var i = 0; i < notCredit.length; i++) {
    if (m === notCredit[i]) return false;
  }
  // 3. ★★ 핵심: 등록된 신용카드와 method 문자열 매칭 ★★
  // method 저장 형식: "신한_아이사랑행복카드(****-****-****-1234)"
  var registeredCards = lsGet(LS_CARDS, INIT_CARDS);
  for (var j = 0; j < registeredCards.length; j++) {
    var c = registeredCards[j];
    if (c.type === 'credit') {
      var bankMatch = m.indexOf(c.bank) >= 0;
      var nameMatch = m.indexOf(c.name) >= 0;
      var last4Match = c.last4 && m.indexOf(c.last4) >= 0;
      if (bankMatch && (nameMatch || last4Match)) return true;
    }
  }
  return false;
}

/* 신용카드 전용 + 결제기간 필터 (전체 txs 기준) */
function filterCreditCardTxs(allTxs, billingDay, baseDate) {
  var period = getCardBillingPeriod(billingDay, baseDate);
  var sDate  = period.start;
  var eDate  = period.end;
  return allTxs.filter(function(tx) {
    if (tx.type !== 'expense') return false;
    if (tx.catId === 'invest' || tx.catId === 'travel_fund') return false;
    if (!isCreditCardMethod(tx.method)) return false;
    var d = new Date(tx.date + 'T12:00:00');
    return d >= sDate && d <= eDate;
  });
}

/* 날짜 포맷 MM월 DD일 */
function fmtBillingDate(d) {
  if (!d) return '';
  return (d.getMonth() + 1) + '월 ' + String(d.getDate()).padStart(2, '0') + '일';
}

/* 현재 순저축 계산 */
function calcNetSaving(txs){
  var income = txs
    .filter(function(t){
      return t.type==='income';
    })
    .reduce(function(s,t){
      return s+t.amount;
    },0);

  var expense = txs
    .filter(function(t){
      return t.type==='expense';
    })
    .reduce(function(s,t){
      return s+t.amount;
    },0);

  return income-expense;
}

/* 진행률 계산 */
function goalPercent(now,target){
  if(target<=0) return 0;
  return Math.min(
    Math.round((now/target)*100),
    100
  );
}
// ★추가: 사용자가 설정한 시작일(sDay)을 기준으로 진짜 가계부의 '년/월'을 계산해 주는 요술 함수
function getFinMonth(dateStr, sDay) {
  var d = new Date(dateStr);
  var y = d.getFullYear();
  var m = d.getMonth();
  // 거래 날짜가 시작일보다 작으면, 가계부상으로는 아직 '저번 달'임!
  if (d.getDate() < sDay) {
    m--;
    if (m < 0) { m = 11; y--; }
  }
  return { y: y, m: m };
}

function isCredit(method) {
  if (!method) return false;
  var m = String(method).trim();

  // ── 1. 명백한 비카드 결제수단 즉시 제외 ──
  var notCard = ['현금','이체','카카오페이','네이버페이','상품권',
                 '지역화폐','기타','급여이체','현금영수증','계좌이체'];
  for (var i = 0; i < notCard.length; i++) {
    if (m === notCard[i]) return false;
  }

  // ── 2. 체크카드 제외 ──
  if (m === '체크카드') return false;
  if (m.indexOf('체크') >= 0 && m.indexOf('카드') >= 0) return false;
  if (m.indexOf('직불') >= 0) return false;

  // ── 3. 명시적 신용카드 라벨 ──
  if (m === '신용카드') return true;
  if (m === '카드')     return true; // 불명확한 '카드' → 신용카드로 처리
  if (m.indexOf('신용') >= 0) return true;

  // ── 4. 등록된 카드 목록과 매칭 (핵심) ──
  var cards = [];
  try {
    var raw = lsGet(LS_CARDS, null);
    if (Array.isArray(raw)) cards = raw;
  } catch(e) { cards = []; }

  for (var j = 0; j < cards.length; j++) {
    var c = cards[j];
    if (!c || !c.bank) continue;
    var bankHit  = m.indexOf(c.bank) >= 0;
    var nameHit  = c.name  && m.indexOf(c.name)  >= 0;
    var last4Hit = c.last4 && m.indexOf(c.last4) >= 0;
    if (bankHit && (nameHit || last4Hit)) {
      // 등록카드와 매칭됨 → type으로 신용/체크 구분
      return c.type === 'credit';
    }
  }

  // ── 5. ★★★ 핵심 보완: 카드번호 패턴(****) 감지 ──
  // methodDisplay()가 등록카드 사용 시 반드시 "****" 포함
  // 체크카드가 아닌 **** 패턴 = 신용카드로 판단
  if (m.indexOf('****') >= 0) {
    // 등록된 체크카드 목록과 대조 → 체크카드면 제외
    var isKnownDebit = false;
    for (var k = 0; k < cards.length; k++) {
      var dc = cards[k];
      if (!dc || dc.type !== 'check') continue;
      var dbankHit  = dc.bank  && m.indexOf(dc.bank)  >= 0;
      var dnameHit  = dc.name  && m.indexOf(dc.name)  >= 0;
      var dlast4Hit = dc.last4 && m.indexOf(dc.last4) >= 0;
      if (dbankHit && (dnameHit || dlast4Hit)) { isKnownDebit = true; break; }
    }
    if (!isKnownDebit) return true; // 등록된 체크카드 아니면 → 신용카드
  }

  // ── 6. 카드사 이름 직접 포함 여부 (CSV 업로드 대응) ──
  var creditBanks = ['신한카드','국민카드','KB카드','하나카드','우리카드',
                     'IBK카드','농협카드','NH카드','현대카드','삼성카드',
                     '롯데카드','BC카드','씨티카드','카카오뱅크카드'];
  for (var n = 0; n < creditBanks.length; n++) {
    if (m.indexOf(creditBanks[n]) >= 0 && m.indexOf('체크') < 0) return true;
  }

  // ── 7. 페이류는 신용카드 아님 ──
  if (m.indexOf('페이') >= 0) return false;

  return false;
}

function getCardBillingPeriod(billingDay, baseDate) {
  var bd = Math.max(1, Math.min(28, parseInt(billingDay) || 12));
  var y = baseDate.getFullYear();
  var m = baseDate.getMonth();
  var sy = y; var sm = m - 1;
  if (sm < 0) { sm = 11; sy--; }
  return {
    start: new Date(sy, sm, bd + 1, 0, 0, 0),
    end:   new Date(y,  m,  bd,     23, 59, 59)
  };
}

function fmtBillingDate(d) {
  if (!d) return '';
  return (d.getMonth() + 1) + '월 ' + String(d.getDate()).padStart(2, '0') + '일';
}

function getStoreLogo(storeName) {
  if (!storeName) return null;
  var n = storeName.replace(/\s/g, '');
  if (n.indexOf('CU') >= 0 || n.indexOf('씨유') >= 0)          return STORE_LOGOS['CU'];
  if (n.indexOf('이마트24') >= 0 || n.indexOf('EMART24') >= 0)  return STORE_LOGOS['EMART24'];
  if (n.indexOf('GS25') >= 0 || n.indexOf('지에스') >= 0)       return STORE_LOGOS['GS25'];
  if (n.indexOf('7') >= 0 || n.indexOf('세븐') >= 0)            return STORE_LOGOS['7ELEVEN'];
  if (n.indexOf('파리바게') >= 0)                                return STORE_LOGOS['파리바게뜨'];
  if (n.indexOf('뚜레') >= 0)                                    return STORE_LOGOS['뚜레쥬르'];
  if (n.indexOf('노브랜드') >= 0)                                return STORE_LOGOS['노브랜드'];
  if (n.indexOf('다이소') >= 0)                                  return STORE_LOGOS['다이소'];
  return null;
}

function storeIcon(storeName, catIcon, size) {
  var logo = getStoreLogo(storeName);
  if (logo) {
    return h('img', {
      src: logo,
      style: {
        width: size || 20,
        height: size || 20,
        borderRadius: 4,
        objectFit: 'contain',
        background: '#fff'
      },
      onError: function(e) { e.target.style.display = 'none'; }
    });
  }
  return catIcon;
}

/* ── 카드번호 암호화 / 복호화 ── */
function encryptCard(num) {
  try { return btoa(num.split('').map(function(c,i){ return String.fromCharCode(c.charCodeAt(0)^(i%9+7)); }).join('')); }
  catch(e){ return ''; }
}
function decryptCard(enc) {
  try { return atob(enc).split('').map(function(c,i){ return String.fromCharCode(c.charCodeAt(0)^(i%9+7)); }).join(''); }
  catch(e){ return ''; }
}
/* ── 카드 이미지 압축 (최대 500px, JPEG 72%) ── */
function compressCardImg(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX=500, r=Math.min(MAX/img.width, MAX/img.height, 1);
      var canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*r); canvas.height=Math.round(img.height*r);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ★★★ [CYBER 2030] ⚡ 플라즈마 번개 차트 (선명도 극대화 + 고해상도 지원) ★★★ */
function PlasmaLineChart(props) {
  var data     = props.data     || [];
  var color    = props.color    || '#00FFFF';
  var height   = props.height   || 112;
  var xLabels  = props.xLabels  || ['1월','2월','3월','4월','5월','6월'];
  var cvRef    = useRef(null);
  var rafRef   = useRef(null);
  var bolts    = useRef([]);
  var fnum     = useRef(0);

  useEffect(function() {
    var cv = cvRef.current; if (!cv || data.length < 2) return;
    var ctx = cv.getContext('2d');
    
    // ★ 디바이스 해상도에 맞춘 캔버스 픽셀 스케일링 (텍스트 선명도 해결의 핵심)
    var dpr = window.devicePixelRatio || 1;

    cv.height = height * dpr;
    ctx.scale(dpr, dpr);

    var mn = Math.min.apply(null, data) * 0.82;
    var mx = Math.max.apply(null, data) * 1.18;
    // 차트 여백 확보
    var px = function(i) { return 40 + (i / (data.length - 1)) * (W - 56); };
    var py = function(v) { return height - 18 - ((v - mn) / ((mx - mn) || 1)) * (height - 35); };
    var timer = 0;

    function spawnBolt() {
      var i = Math.floor(Math.random() * (data.length - 1));
      bolts.current.push({ x1:px(i), y1:py(data[i]), x2:px(i+1), y2:py(data[i+1]), a:1.0, decay: 0.038 + Math.random() * 0.022 });
    }

    function drawBolt(x1, y1, x2, y2, d, a) {
      if (d <= 0 || a < 0.03) return;
      var mx2 = (x1+x2)/2 + (Math.random()-0.5)*(24/d);
      var my2 = (y1+y2)/2 + (Math.random()-0.5)*(16/d);

      ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 12; ctx.stroke();
      ctx.restore();

    function draw() {
      fnum.current++; timer++;
      ctx.clearRect(0, 0, W, height);

      // 격자 가이드 및 좌측 단위 텍스트
      for (var g = 0; g <= 4; g++) {
        var gy = 13 + g/4*(height - 26);
        ctx.beginPath(); ctx.moveTo(40, gy); ctx.lineTo(W - 4, gy);
        ctx.strokeStyle = 'rgba(160,0,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
        
        ctx.shadowBlur = 0; // 텍스트 그리기 전 그림자 초기화
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; // 색상 선명도 상승
        ctx.font = 'bold 10px sans-serif'; 
        ctx.fillText(Math.round((mx - g/4*(mx-mn))/10000) + '만', 2, gy + 4);
      }

      // 그라데이션 면적 채우기
      var ag = ctx.createLinearGradient(0, 0, 0, height);
      ag.addColorStop(0, color + '42'); ag.addColorStop(0.7, 'rgba(0,0,0,0)');
      ctx.beginPath();
      data.forEach(function(v, i){ i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v)); });
      ctx.lineTo(px(data.length-1), height - 18); ctx.lineTo(px(0), height - 18); ctx.closePath();
      ctx.fillStyle = ag; ctx.fill();

      // 글로우 광원 및 실선 렌더링
      [7, 2.5].forEach(function(lw, li) {
        ctx.beginPath();
        data.forEach(function(v, i) {
          if (i === 0) { ctx.moveTo(px(0), py(v)); return; }
          var c1 = px(i-1) + (px(i) - px(i-1))/2;
          ctx.bezierCurveTo(c1, py(data[i-1]), c1, py(v), px(i), py(v));
        });
        ctx.strokeStyle = li === 0 ? color + '4a' : color; ctx.lineWidth = lw;
        ctx.shadowColor = color; ctx.shadowBlur = li === 0 ? 22 : 9; ctx.stroke(); ctx.shadowBlur = 0;
      });

      // 데이터 원형 포인터 및 상단 수치 텍스트
      data.forEach(function(v, i) {
        var dx = px(i), dy = py(v);
        ctx.beginPath(); ctx.arc(dx, dy, 5 + Math.sin(fnum.current*0.08+i)*1.2, 0, Math.PI*2);
        ctx.strokeStyle = color + '60'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(dx, dy, 3.5, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(dx, dy, 1.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
        
        var val = Math.round(data[i]/10000);
        ctx.shadowBlur = 0; // 텍스트 그림자 초기화
        ctx.fillStyle = '#FFFFFF'; // 완전 흰색으로 강조
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(val + '만', dx, dy - 12); ctx.textAlign = 'left';
      });

      // X축 하단 월별 라벨 드로잉
      xLabels.forEach(function(lb, i) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';

      }); ctx.textAlign = 'left';

      // 뇌전 스파크 생성 라이프사이클 제어
      if (timer > 88) {
        var ri = Math.floor(Math.random()*(data.length-1));
        bolts.current.push({ x1:px(ri), y1:py(data[ri]), x2:px(ri+1), y2:py(data[ri+1]), a:1, decay: 0.038+Math.random()*0.022 });

      }
      if (timer === 44 && Math.random() > 0.55) {
        var ri = Math.floor(Math.random()*(data.length-1));
        bolts.current.push({ x1:px(ri), y1:py(data[ri]), x2:px(ri+1), y2:py(data[ri+1]), a:0.85, decay:0.05 });
      }

      bolts.current = bolts.current.filter(function(b){ return b.a > 0.03; });
      bolts.current.forEach(function(b) {
        drawBolt(b.x1, b.y1, b.x2, b.y2, 4, b.a);
        b.a -= b.decay;
      });

      rafRef.current = requestAnimationFrame(draw);
    }
    draw();
    return function() { cancelAnimationFrame(rafRef.current); };
  }, [data, color, height, xLabels]);

  return h('canvas', { ref: cvRef, style: { width: '100%', height: height + 'px', display: 'block' } });
}

/* ★★★ [CYBER 2030] 🔮 홀로그램 도넛 차트 (초고해상도 다차원 렌더링) ★★★ */
function HologramDonut(props) {
  var data = props.data || [];
  var size = props.size || 112;
  var totalLabel = props.totalLabel || '';
  var cvRef = useRef(null);
  var rafRef = useRef(null);
  var NEO_COLS = ['#00FFFF', '#FF00FF', '#FF4466', '#00FF88', '#FFD700', '#FF8800', '#AD00FF'];

  useEffect(function() {
    var cv = cvRef.current; if (!cv || !data.length) return;
    var ctx = cv.getContext('2d');
    var cx = size/2, cy = size/2, R = size * 0.38, ri = size * 0.25;
    var total = data.reduce(function(s, d) { return s + d.value; }, 0);
    var rot = 0, doff = 0;

    function draw() {
      ctx.clearRect(0, 0, size, size); rot += 0.007; doff += 0.4;

      // 1. 최외곽 스캐닝 링 (시안)
      ctx.beginPath(); ctx.arc(cx, cy, R + 12, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; ctx.lineWidth = 1;
      ctx.setLineDash([2, 8]); ctx.lineDashOffset = doff; ctx.stroke(); ctx.setLineDash([]);

      // 2. 중간 회전 궤도 (마젠타)
      ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 0, 255, 0.3)'; ctx.lineWidth = 2;
      ctx.setLineDash([15, 10, 4, 10]); ctx.lineDashOffset = -doff * 1.5; ctx.stroke(); ctx.setLineDash([]);

      var s = rot - Math.PI / 2;
      data.forEach(function(d, idx) {
        var arc = (d.value / total) * Math.PI * 2;
        if (arc < 0.01) { s += arc; return; }
        var col = NEO_COLS[idx % NEO_COLS.length];

        // 데이터 세그먼트 배경 글로우
        ctx.beginPath(); ctx.arc(cx, cy, R + 3, s, s + arc); ctx.arc(cx, cy, ri - 3, s + arc, s, true);
        ctx.closePath(); ctx.fillStyle = col + '20'; ctx.shadowColor = col; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;

        // 코어 데이터 세그먼트
        ctx.beginPath(); ctx.arc(cx, cy, R, s, s + arc - 0.04); ctx.arc(cx, cy, ri, s + arc - 0.04, s, true); ctx.closePath();
        var g = ctx.createRadialGradient(cx, cy, ri, cx, cy, R);
        g.addColorStop(0, col); g.addColorStop(1, col + '66');
        ctx.fillStyle = g; ctx.fill();

        // 엣지 하이라이트
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 0.5; ctx.stroke();
        s += arc;
      });

      // 3. 블랙홀 코어
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, ri);
      cg.addColorStop(0, '#100020'); cg.addColorStop(0.7, '#080010'); cg.addColorStop(1, '#000000');
      ctx.beginPath(); ctx.arc(cx, cy, ri, 0, Math.PI * 2); ctx.fillStyle = cg; ctx.fill();
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)'; ctx.lineWidth = 1; ctx.stroke();

      // 4. 중앙 홀로그램 텍스트
      ctx.fillStyle = 'rgba(255, 0, 255, 0.9)'; ctx.font = 'bold '+(size*0.08)+'px monospace'; 
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#FF00FF'; ctx.shadowBlur = 5;
      ctx.fillText('총지출', cx, cy - (size*0.08)); ctx.shadowBlur = 0;
      
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold '+(size*0.11)+'px monospace';
      ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 8;
      ctx.fillText(totalLabel, cx, cy + (size*0.06)); ctx.shadowBlur = 0;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

      rafRef.current = requestAnimationFrame(draw);
    }
    draw();
    return function() { cancelAnimationFrame(rafRef.current); };
  }, [data, size, totalLabel]);

  return h('canvas', { ref: cvRef, width: size, height: size, style: { width: size + 'px', height: size + 'px', flexShrink: 0 } });
}

/* ★★★ [CYBER 2030] 🌳 초고도화 생태계 기후 시각 엔진 (Living Ecosystem) ★★★ */
function CyberEcologyCanvas(props) {
  var ratio = Math.max(0, props.ratio || 0);
  var canvasRef = useRef(null);
  var rafRef = useRef(null);
  var pSys = useRef({ leaves:[], rain:[], meteors:[], ripples:[] });
  var frame = useRef(0);
  var lightning = useRef(0);

  useEffect(function() {
    var canvas = canvasRef.current; if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;

    // 파티클 초기화
    if(pSys.current.leaves.length === 0) {
      for(var i=0; i<40; i++) pSys.current.leaves.push({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-0.5)*2, vy:Math.random()+0.5, sz:Math.random()*3+2, ang:0, spn:(Math.random()-0.5)*0.1});
    }

    function draw() {
      frame.current++; var f = frame.current;
      ctx.clearRect(0, 0, W, H);

      var stage = 1; // 1:봄, 2:가을, 3:비, 4:폭풍/일식, 5:파국
      if(ratio >= 1.0) stage = 5; else if(ratio >= 0.75) stage = 4; else if(ratio >= 0.50) stage = 3; else if(ratio >= 0.25) stage = 2;

      // 1. 다이나믹 스카이 (Skybox)
      var skyG = ctx.createLinearGradient(0, 0, 0, H);
      if(stage===1){ skyG.addColorStop(0,'#4ECDC4'); skyG.addColorStop(1,'#A8E6CF'); }
      else if(stage===2){ skyG.addColorStop(0,'#D35400'); skyG.addColorStop(1,'#F39C12'); }
      else if(stage===3){ skyG.addColorStop(0,'#2C3E50'); skyG.addColorStop(1,'#5D6D7E'); }
      else if(stage===4){ skyG.addColorStop(0,'#1A002A'); skyG.addColorStop(1,'#4A004A'); }
      else { skyG.addColorStop(0,'#110000'); skyG.addColorStop(1,'#4A0000'); }
      ctx.fillStyle = skyG; ctx.fillRect(0, 0, W, H);

      // 2. 천체 (해 / 개기일식)
      var sX = W*0.8, sY = H*0.25;
      if(stage<=2) {
        ctx.fillStyle = stage===1?'#FFFDE7':'#FFEAA7'; ctx.shadowColor = stage===1?'#FFF':'#FF9800'; ctx.shadowBlur = 40;
        ctx.beginPath(); ctx.arc(sX, sY, 35, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      } else if(stage===4) {
        ctx.strokeStyle = '#FF00FF'; ctx.lineWidth = 4; ctx.shadowColor = '#FF00FF'; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(sX, sY, 25, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(sX, sY, 24, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      }

      // 3. 원경: 산맥 (Mountains)
      ctx.fillStyle = stage===5?'#220000':stage>=3?'#1A252F':stage===2?'#A04000':'#27AE60';
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H-90); ctx.quadraticCurveTo(W*0.3, H-150, W*0.6, H-80); ctx.quadraticCurveTo(W*0.8, H-110, W, H-70); ctx.lineTo(W, H); ctx.fill();

      // 4. 지면 (Ground)
      var gy = H - 40;
      ctx.fillStyle = stage===5?'#110000':stage>=3?'#2E4053':stage===2?'#873600':'#2ECC71';
      ctx.fillRect(0, gy, W, 40);

      // 5. 시냇물 (Stream)
      ctx.fillStyle = stage===5?'#FF3300':stage>=3?'#1A5276':'#3498DB';
      ctx.beginPath(); ctx.moveTo(W*0.2, gy); ctx.quadraticCurveTo(W*0.4, H-20, W*0.1, H); ctx.lineTo(W*0.4, H); ctx.quadraticCurveTo(W*0.5, H-20, W*0.35, gy); ctx.fill();
      if(stage===5) { // 용암 글로우
        ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
      }

      // 6. 바위 (Rocks)
      ctx.fillStyle = stage===5?'#000':stage>=3?'#566573':'#95A5A6';
      ctx.beginPath(); ctx.ellipse(W*0.15, gy+5, 15, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(W*0.85, gy+15, 20, 10, 0, 0, Math.PI*2); ctx.fill();

      // 7. 오두막 집 (Cozy House)
      var hx = W*0.75, hy = gy-30;
      if(stage < 5) {
        // 집 본체
        ctx.fillStyle = stage>=3?'#3E2723':'#5D4037'; ctx.fillRect(hx, hy, 45, 30);
        // 지붕
        ctx.fillStyle = stage>=3?'#212F3D':'#C0392B';
        ctx.beginPath(); ctx.moveTo(hx-5, hy); ctx.lineTo(hx+22.5, hy-20); ctx.lineTo(hx+50, hy); ctx.fill();
        // 창문

        ctx.fillStyle = winColor;
        ctx.shadowColor = stage>=3?'#FFB300':'transparent'; ctx.shadowBlur = stage>=3?15:0;
        ctx.fillRect(hx+15, hy+8, 15, 15); ctx.shadowBlur=0;
        // 창문틀
        ctx.strokeStyle = '#3E2723'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(hx+22.5, hy+8); ctx.lineTo(hx+22.5, hy+23); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx+15, hy+15.5); ctx.lineTo(hx+30, hy+15.5); ctx.stroke();
        
        // 날씨가 안좋을 때 창문 안의 실루엣 (토끼와 새가 숨어있음)

          // 토끼 실루엣

          ctx.fillRect(hx+17, hy+14, 1.5, 5); ctx.fillRect(hx+19.5, hy+14, 1.5, 5); // 귀

        // 파국 단계: 불타는 집 잔해

        for(var k=pSys.current.ripples.length-1; k>=0; k--) {

        if(lightning.current > 0) {
          ctx.fillStyle = stage===5?'rgba(255,0,0,0.3)':'rgba(0,255,255,0.4)'; ctx.fillRect(0,0,W,H); lightning.current--;
        }

// 👇👇 [지운 자리에 여기서부터 복사해서 붙여넣으세요] 👇👇
function fDash(txs, p, baseDateObj, sDay) {
  sDay = sDay || 1;
  // ★기준 날짜를 사용자가 설정한 '가계부 시작일' 기준으로 진짜 년/월을 찾습니다.
  var targetFm = getFinMonth(baseDateObj.toISOString(), sDay);
  var targetY = targetFm.y;
  var targetM = targetFm.m;

  return txs.filter(function(t) {
    // ★각각의 거래 결제 날짜도 '가계부 시작일' 기준으로 어느 달에 속하는지 찾습니다.
    var tFm = getFinMonth(t.date, sDay);
    var ty = tFm.y;
    var tm = tFm.m;

    if (p === '이번달') {
      return ty === targetY && tm === targetM;
    }
    if (p === '분기') {
      var targetQ = Math.floor(targetM / 3);
      var tQ = Math.floor(tm / 3);
      return ty === targetY && tQ === targetQ;
    }
    return ty === targetY; // 올해
  });
}

function fPeriod(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  
  if (p === '주간') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6); weekAgo.setHours(0,0,0,0);
    return txs.filter(function(t) { return new Date(t.date) >= weekAgo; });
  }
  if (p === '월간') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y && fm.m === nowFm.m; });
  }
  return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y; });
}

// ★ [리디자인] DonutChart — 2026 Glassmorphism + Neon Glow 3D 도넛 차트
function DonutChart(props) {
  var data = props.data || [];
  var size = props.size || 110;
  var totalLabel = props.totalLabel || null;

  /* ★ 테마 정보 불러오기 */
  var currentTheme = localStorage.getItem('flai_theme') || 'dark';
  var isLight = currentTheme === 'light';
  var isCozy  = currentTheme === 'cozy';

  if (!data.length) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background: isLight ? '#F1F5F9' : 'radial-gradient(circle, #1C2541, #0A0E1A)',
    boxShadow: isLight ? 'inset 0 2px 6px rgba(0,0,0,0.05)' : '0 0 20px rgba(0,229,255,0.1)'
  }});

  var total = data.reduce(function(s,d){return s+d.value;},0);
  if (!total) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background: isLight ? '#F1F5F9' : 'radial-gradient(circle, #1C2541, #0A0E1A)'
  }});

  var cx = size/2, cy = size/2;
  var R = size/2 * 0.82, r = size/2 * 0.50;
  var angle = -Math.PI/2;
  var paths = [], glowFilters = [];

  /* ★ 테마별 완벽 맞춤 팔레트 */
  var neonPalette = isLight ? [
    ['#FF7E67','#FF4757'], ['#00CECE','#0097A7'], ['#FFC312','#F39C12'],
    ['#00E676','#00BFA5'], ['#D980FA','#8E44AD'], ['#FF8A65','#FF5252']
  ] : isCozy ? [
    ['#E67E22','#D35400'], ['#16A085','#1ABC9C'], ['#F1C40F','#F39C12'],
    ['#E74C3C','#C0392B'], ['#8E44AD','#9B59B6'], ['#FF8A65','#FF5252']
  ] : [
    ['#FF6B6B','#FF007C'], ['#00E5FF','#536DFE'], ['#FFD600','#FF9800'],
    ['#69F0AE','#00BFA5'], ['#CE93D8','#7C3AED'], ['#FF8A65','#FF5252']
  ];

  data.forEach(function(d,i){
    var slice = (d.value/total)*2*Math.PI;
    if(slice < 0.01){ angle += slice; return; }

    var x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
    var x2=cx+R*Math.cos(angle+slice), y2=cy+R*Math.sin(angle+slice);
    var xi1=cx+r*Math.cos(angle+slice), yi1=cy+r*Math.sin(angle+slice);
    var xi2=cx+r*Math.cos(angle), yi2=cy+r*Math.sin(angle);
    var lg = slice > Math.PI ? 1 : 0;

    var gradId = 'ng'+i, pal = neonPalette[i % neonPalette.length];

    glowFilters.push(
      h('defs', {key:'def'+i},
        h('linearGradient', {
          key: gradId, id: gradId,
          x1: '0%', y1: '0%', x2: '100%', y2: '100%'
        },
          h('stop', {offset:'0%', stopColor: pal[0]}),
          h('stop', {offset:'100%', stopColor: pal[1]})
        )
      )
    );

    // 글로우 + 메인 슬라이스 (라이트 테마에서는 글로우 약하게)
    paths.push(
      h('path', {
        key:'g'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')', opacity: isLight ? '0.1' : '0.3',
        style:{filter:'blur(3px)'}
      }),
      h('path', {
        key:'p'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')',
        stroke: isLight ? '#FFFFFF' : 'rgba(255,255,255,0.1)',
        strokeWidth: 1
      })
    );
    angle += slice;
  });

  return h('div', {style:{position:'relative', width:size, height:size}},
    h('svg', {
      width:size, height:size, viewBox:'0 0 '+size+' '+size,
      style:{filter: isLight ? 'drop-shadow(0 2px 6px rgba(0,0,0,0.1))' : 'drop-shadow(0 4px 16px rgba(0,0,0,0.5))'}
    },
      glowFilters, paths,
      h('circle', {
        cx:cx, cy:cy, r:r-2,
        fill: isLight ? '#FFFFFF' : 'rgba(10,14,26,0.9)',
        stroke: isLight ? '#E2E8F0' : 'rgba(255,255,255,0.1)',
        strokeWidth:1
      }),
      totalLabel && h('text', {
        x:cx, y:cy-4, textAnchor:'middle',
        fontSize:9, fill: isLight ? '#64748B' : 'rgba(255,255,255,0.6)',
        fontWeight:'600'
      }, '총지출'),
      totalLabel && h('text', {
        x:cx, y:cy+6, textAnchor:'middle',
        fontSize:12, fill: isLight ? '#0F172A' : '#ffffff',
        fontWeight:'800'
      }, totalLabel)
    )
  );
}


function LineChartSVG(props) {
  var data = props.data || [];
  var height = props.height || 140;
  var w=320, pL=38, pR=10, pT=14, pB=24;
  var iw=w-pL-pR, ih=height-pT-pB;
  if(data.length<2) return h('div',{style:{height:height,display:'flex',alignItems:'center',justifyContent:'center'}},
    h('span',{style:{color:C.muted,fontSize:12}},'데이터 없음'));
  var maxE = Math.max.apply(null,data.map(function(d){return d.expense;}));
  var maxI = data[0].income ? Math.max.apply(null,data.map(function(d){return d.income||0;})) : maxE;
  var maxV = Math.max(maxE,maxI,1);
  function px(i){ return pL+i*(iw/(data.length-1)); }
  function pyE(v){ return pT+ih-(v/maxV)*ih; }
  function pyI(v){ return pT+ih-(v/maxV)*ih; }
  var ePts = data.map(function(d,i){return px(i)+','+pyE(d.expense);}).join(' ');
  var iPts = data[0].income ? data.map(function(d,i){return px(i)+','+pyI(d.income);}).join(' ') : null;
  return h('svg',{viewBox:'0 0 '+w+' '+height,width:'100%',height:height},
    [0,0.5,1].map(function(f,i){
      return h('line',{key:'g'+i,x1:pL,y1:pT+ih*f,x2:w-pR,y2:pT+ih*f,stroke:C.border,strokeDasharray:'4 4'});
    }),
    [maxV,maxV*0.5,0].map(function(v,i){
      return h('text',{key:'y'+i,x:pL-4,y:pT+ih*(i*0.5)+4,textAnchor:'end',fontSize:9,fill:C.muted},(v/10000).toFixed(0)+'만');
    }),
    data.map(function(d,i){
      return h('text',{key:'x'+i,x:px(i),y:height-4,textAnchor:'middle',fontSize:10,fill:C.muted},d.month);
    }),
    iPts && h('polyline',{points:iPts,fill:'none',stroke:C.green,strokeWidth:2.5,strokeLinejoin:'round'}),
    h('polyline',{points:ePts,fill:'none',stroke:C.red,strokeWidth:2.5,strokeLinejoin:'round'}),
    data.map(function(d,i){return h('circle',{key:'ec'+i,cx:px(i),cy:pyE(d.expense),r:4,fill:C.red});}),
    iPts && data.map(function(d,i){return h('circle',{key:'ic'+i,cx:px(i),cy:pyI(d.income||0),r:4,fill:C.green});})
  );
}

/* ★ 수정된 AI 재무분석 및 KPI 컨설팅 섹션 ★ */
function SavingsModal(props) {
  var onClose = props.onClose;
  var txs = props.txs || [];
  var exp = txs.filter(function(t){return t.type==='expense';});
  var totE = exp.reduce(function(s,t){return s+t.amount;},0);
  
  // KPI 데이터 중복 계산 방지를 위한 단일 객체화
  var byCat = {};
  exp.forEach(function(t){byCat[t.catId]=(byCat[t.catId]||0)+t.amount;});

  // [중복 제거됨] 기존에 여러 번 정의되었던 KPI 기준값을 최적화된 단일 리스트로 관리
  var tips = [
    {icon:'🍜',cat:'food',  base:0.28,label:'식비 28% 이하 유지'},
    {icon:'🛒',cat:'shop',  base:0.20,label:'쇼핑 20% 이하 유지'},
    {icon:'📱',cat:'comm',  base:0.05,label:'통신비 5% 이하 유지'},
    {icon:'🎬',cat:'culture',base:0.08,label:'문화생활 8% 이하 유지'}
  ];

  var annual = 0;
  var rows = tips.map(function(tip){
    var curr = byCat[tip.cat]||0;
    var tgt = totE * tip.base;
    var save = Math.max(Math.round(curr - tgt), 0);
    annual += save * 12;

// ★§3 수정: Gemini OCR — 구글 최신 세대(gemini-2.5-flash) 완벽 적용 ★
var LS_GEMINI = 'flai_gemini_key';
/* ★★★ [학습 시스템] 시작 ★★★ */
var LS_STORE_MAP = 'flai_store_map';
 
function getLearnedCategory(storeName) {
  if (!storeName) return null;
  var map = lsGet(LS_STORE_MAP, {});
  if (map[storeName]) return map[storeName];
  var keys = Object.keys(map);
  for (var i = 0; i < keys.length; i++) {
    if (storeName.indexOf(keys[i]) >= 0 || keys[i].indexOf(storeName) >= 0) {
      return map[keys[i]];
    }
  }
  return null;
}
 
function saveLearnedCategory(storeName, catId, subCat) {
  if (!storeName || storeName.length < 2) return;
  var map = lsGet(LS_STORE_MAP, {});
  var existing = map[storeName] || { count: 0 };
  map[storeName] = {
    catId: catId,
    subCat: subCat || '',
    count: existing.count + 1,
    lastDate: new Date().toISOString().split('T')[0]
  };
  lsSet(LS_STORE_MAP, map);
}
 
function buildLearningContext(maxEntries) {
  /* 1단계: 수동 학습 데이터 (사용자가 수정 확정한 것) */
  var map = lsGet(LS_STORE_MAP, {});

  /* 2단계: 기존 전체 거래 내역에서 패턴 자동 추출 */
  var allTxs = lsGet(LS_TXS, []);
  allTxs.forEach(function(tx) {
    if (!tx.store || tx.store.length < 2) return;
    var key = tx.store;
    if (!map[key]) {
      map[key] = { catId: tx.catId, subCat: tx.subCat || '', count: 0 };
    }
    map[key].count++;
    /* 가장 최근 분류를 우선 반영 */
    map[key].catId = tx.catId;
    if (tx.subCat) map[key].subCat = tx.subCat;
  });

  /* 3단계: 사용 횟수 많은 순으로 정렬 후 프롬프트 생성 */
  var entries = Object.keys(map).map(function(k) {
    return { store: k, catId: map[k].catId, subCat: map[k].subCat, count: map[k].count };
  });
  entries.sort(function(a, b) { return b.count - a.count; });
  var top = entries.slice(0, maxEntries || 30);
  if (top.length === 0) return '';
  var lines = top.map(function(e) {
    return '"' + e.store + '" → category:"' + e.catId + '", sub_category:"' + (e.subCat || '') + '"';
  });
  return '\n\n★이 사용자의 과거 분류 이력(category와 sub_category 모두 반드시 동일하게 따를 것):\n' + lines.join('\n');
}

/* ★추가: AI 음성 및 텍스트 분석용 함수 (재무분석 & 음성인식에 사용) */
function callGeminiText(promptText, apiKey, callback) {
  // 대표님 지시대로 문자 파싱은 기존 Groq 키(LS_GEMINI)를 고정 사용
  var groqKey = lsGet(LS_GEMINI, apiKey); 
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant', // 문자 파싱 최강 모델
    messages: [{ role: 'user', content: promptText }],
    temperature: 0.1
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + groqKey);
  xhr.timeout = 20000;
  xhr.onload = function() {
    if(xhr.status >= 200 && xhr.status < 300) {
      try {
        var data = JSON.parse(xhr.responseText);
        callback(null, data.choices[0].message.content);
      } catch(e) { callback('해석 실패', null); }
    } else { callback('Groq 서버 오류', null); }
  };
  xhr.onerror = function() { callback('네트워크 오류', null); };
  xhr.send(body);
}
// --- [여기를 복사해서 callGeminiOCR 바로 위에 붙여넣으세요] ---
async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        // [중요] 파일이 없으면 그냥 원래 있던 base64라도 돌려주게 만들었어요
        if (!file) { resolve(null); return; } 

        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                // 너비를 800으로 더 줄여볼게요 (그럼 진짜 번개처럼 빨라져요!)
                let w = 800; 
                let h = Math.round((img.height * w) / img.width);
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                // 화질을 0.5(50%)로 더 낮춰서 용량을 확 줄입니다.
                resolve(canvas.toDataURL('image/jpeg', 0.5).split(',')[1]);
            };
        };
    });
}

function testGeminiKey(apiKey, onResult) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: 'hi' }],
    max_tokens: 10
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 15000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var d=JSON.parse(xhr.responseText);
        if(d.choices && d.choices[0]) onResult('success','');
        else onResult('error','알 수 없는 응답');
      } catch(e){ onResult('error','응답 파싱 오류'); }
    } else {
      var em='HTTP '+xhr.status;
      try{var ed=JSON.parse(xhr.responseText);if(ed.error)em=ed.error.message;}catch(e2){}
      onResult('error', em);
    }
  };
  xhr.onerror = function() { onResult('cors',''); };
  xhr.ontimeout = function() { onResult('error','요청 시간 초과'); };
  xhr.send(body);
}

/* ★수정: 영수증 다중 등록 + 일괄 파싱 시스템 (완전 재설계) */
function ReceiptIn(props) {
  var onAdd  = props.onAdd;
  var onBack = props.onBack;

  /*
   * items 배열 각 아이템 구조:
   * { id, imgSrc, mimeType, b64, status, store, amount, date, catId, subCat, member, err, editing }
   * status: 'registered' → 'analyzing' → 'parsed' → 'saved'  (또는 'error')
   */
  var items     = useState([]);    var setItems     = items[1];     items     = items[0];
  var analyzing = useState(false); var setAnalyzing = analyzing[1]; analyzing = analyzing[0];
  var progress  = useState(0);     var setProgress  = progress[1];  progress  = progress[0];

  var fileRef = useRef(null);
  var camRef  = useRef(null);

  var apiKey = lsGet(LS_GEMINI, '');

  /* ── 사진 등록 (파싱 없이 리스트에 추가만) ── */
  function handleFiles(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var fileArr = Array.from(files).slice(0, 10);

    fileArr.forEach(function(file) {
      var mime = file.type || 'image/jpeg';
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        var b64 = dataUrl.split(',')[1];
        var newItem = {
          id: Date.now() + Math.random(),
          imgSrc: dataUrl,
          mimeType: mime,
          b64: b64,
          status: 'registered',
          store: '',
          amount: '',
          date: new Date().toISOString().split('T')[0],
          catId: 'food',
          subCat: '',
          member: 'mom',
          err: '',
          editing: false
        };
        setItems(function(prev) { return prev.concat([newItem]); });
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  /* ── 개별 아이템 상태 업데이트 ── */
  function updateItem(id, changes) {
    setItems(function(prev) {
      return prev.map(function(item) {
        if (item.id === id) return Object.assign({}, item, changes);
        return item;
      });
    });
  }

  /* ── 아이템 삭제 ── */
  function removeItem(id) {
    setItems(function(prev) {
      return prev.filter(function(item) { return item.id !== id; });
    });
  }

  /* ── [분석 시작] 전체 순차 파싱 (화면 복구 및 속도 업그레이드 버전) ── */
function startAnalyzeAll() {
  if (!apiKey) { alert('설정에서 AI API 키를 먼저 등록해주세요!'); return; }

  var targets = items.filter(function(item) {
    return item.status === 'registered' || item.status === 'error';
  });

  if (targets.length === 0) { alert('분석할 사진이 없습니다.'); return; }

  setAnalyzing(true);
  setProgress(0);

  var idx = 0;

  // 마법의 async 단어가 여기 들어있어요!
  async function processNext() {
    if (idx >= targets.length) {
      setAnalyzing(false);
      return;
    }

    var target = targets[idx];
    
    // [1단계] 진짜 사진 파일을 찾아내는 줄 (속도의 핵심)
    if (!target.file && target.el && target.el.files) {
      target.file = target.el.files[0];
    }

    updateItem(target.id, { status: 'analyzing' });
    setProgress(idx + 1);

    // [2단계] 사진 압축하기 (실패해도 멈추지 않게 보험을 들었어요)
    let finalImage = target.b64; 
    try {
      if (target.file) {
        // 압축기(Canvas)를 돌려서 아주 가볍게 만들어요
        finalImage = await compressImage(target.file);
      }
    } catch (e) {
      console.log("압축 실패: 원래 사진으로 보낼게요.");
      finalImage = target.b64;
    }

    // [3단계] 로봇(AI)에게 전달하기
    callGeminiOCR(finalImage, target.mimeType, apiKey, function(err, result) {
      if (err) {
        updateItem(target.id, { status: 'error', err: err });
      } else {
        updateItem(target.id, {
          status: 'parsed',
          store: result.store_name || '',
          amount: result.amount ? String(result.amount) : '',
          catId: result.category || 'food',
          subCat: result.sub_category || '',
          date: (function() {
            // ★ 영수증 파싱 날짜 보정: 연도 없거나 과거 연도면 올해로 보정
            var parsedDate = result.date || '';
            if (parsedDate) {
              var pd = String(parsedDate).replace(/\//g, '-').replace(/\./g, '-');
              // 1) 월/일만 있을 때 (5-8, 05-08 등)
              if (pd.length <= 5) {
                var parts = pd.split('-');
                pd = new Date().getFullYear() + '-' + String(parts[0]).padStart(2, '0') + '-' + String(parts[1] || '01').padStart(2, '0');
              }
              // 2) 연도가 있지만 과거 연도일 때 (2023-05-08, 2024-05-08 등)
              if (pd.length === 10) {
                var pyear = parseInt(pd.split('-')[0]);
                var cyear = new Date().getFullYear();
                if (pyear < cyear) {
                  // 과거 연도 → 현재 연도로 교체
                  pd = cyear + pd.substring(4);
                }
              }
              return pd;
            }
            // 날짜 정보 없으면 오늘 날짜
            var today = new Date();
            return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
          })(),
          err: ''
        });
      }
      idx++;
      setTimeout(processNext, 500); // 다음 영수증 분석하러 가기!
    });
  }

  // 진짜로 시작하는 버튼!
  processNext();
}

  /* ── 개별 [등록] → 지출내역 저장 ── */

    if (!item.amount || parseInt(item.amount) <= 0) {

  /* ── 상태별 카운트 ── */
  var countReg   = items.filter(function(i){ return i.status==='registered'; }).length;
  var countDone  = items.filter(function(i){ return i.status==='parsed'; }).length;
  var countSaved = items.filter(function(i){ return i.status==='saved'; }).length;
  var countErr   = items.filter(function(i){ return i.status==='error'; }).length;
  var countAll   = items.length;

  /* ══════════════════════════════════════════ */
  /* ★★★ 화면 렌더링 ★★★                      */
  /* ══════════════════════════════════════════ */
  return h('div', {style:{padding:'0 16px 100px', overflowY:'auto', height:'100vh'}},
    h(Hdr, {title:'📷 영수증 AI 인식 (다중)', onBack:onBack}),

        {k:['카페','스타벅스','투썸','이디야','메가커피','빽다방','할리스','베이커리','파리바게뜨','뚜레쥬르','던킨','아이스크림','베스킨라빈스','설빙','디저트'], c:'food', s:'간식/후식/디저트'},
        {k:['홈플러스','롯데마트','하나로','농협','슈퍼','식자재','반찬'], c:'food', s:'식자재'},
        {k:['쿠팡','네이버쇼핑','11번가','옥션','지마켓','위메프','알리','테무'], c:'shop', s:'온라인'},
        {k:['백화점','아울렛','현대백화점','롯데백화점','신세계'], c:'shop', s:'오프라인'},
        {k:['넷플릭스','유튜브','웨이브','왓챠','디즈니','티빙'], c:'culture', s:'OTT'},
        {k:['cgv','메가박스','롯데시네마','영화','극장'], c:'culture', s:'예술공연'},
        {k:['주유','sk에너지','gs칼텍스','s-oil','충전소'], c:'trans', s:'주유'},
        {k:['택시','카카오t'], c:'trans', s:'택시'},
        {k:['병원','의원','클리닉','치과','피부과','한의원','정형외과','내과','안과'], c:'health', s:'병원'},
        {k:['약국'], c:'health', s:'약'},
        {k:['올리브영','다이소','화장품'], c:'daily', s:'위생&케어용품'},
        {k:['학원','과외'], c:'edu', s:'학원'},
        {k:['서점','교보문고','알라딘'], c:'edu', s:'서적'},
        {k:['정비','카센터','타이어','세차'], c:'other', s:'정비&수리'}
      ];
      for(var ri = 0; ri < rules.length; ri++) {
        for(var ki = 0; ki < rules[ri].k.length; ki++) {
          if(st.indexOf(rules[ri].k[ki]) >= 0) {
            data.category = rules[ri].c;
            data.sub_category = rules[ri].s;
            matched = true; break;
          }
        }
        if(matched) break;
      }
      if(!matched && isMart) { data.category = 'food'; data.sub_category = '식자재'; }
      if(!matched && isCVS)  { data.category = 'other'; data.sub_category = '편의점'; }
    }
    return data;
  }
 
  /* ★수정됨: 캡처 원본의 거대한 용량으로 인한 404/402 에러를 막기 위해 압축 로직(async/await) 적용 */
  async function handleFile(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var mime = file.type || 'image/jpeg';
    var reader = new FileReader();
    reader.onload = async function(ev) {
      var dataUrl = ev.target.result;
      setImgSrc(dataUrl);
      setStep(2);
      setErrMsg('');
 
      /* ★ AI 전송 전 스크린샷 용량을 압축하여 서버 과부하 원천 차단 */
      var finalImage = dataUrl.split(',')[1];
      try {
        if (typeof compressImage === 'function') {
          finalImage = await compressImage(file);
        }
      } catch(err) {
        console.log("압축 우회 진행", err);
      }

      callGeminiOCR(finalImage, mime, apiKey, function(err, result) {
        if(err) {
          setErrMsg('AI 분석 실패: ' + err);
          setStep(3);
          return;
        }
        /* 강제 보정 적용 */
        result = forceCorrect(result);
        setEditSt(result.store_name || result.store || '');
        setEditAmt(result.amount ? String(result.amount) : '');
        setEditCat(result.category || 'food');
        setEditSubCat(result.sub_category || '');
       // ★ 날짜 보정: 연도 없거나 과거 연도면 올해로 보정
        if(result.date) {
          var rd = String(result.date).replace(/\//g,'-').replace(/\./g,'-');
          // 1) 월/일만 있을 때 (5-8, 05-08 등)
          if(rd.length <= 5) {
            var dp = rd.split('-');
            rd = new Date().getFullYear() + '-' + String(dp[0]).padStart(2,'0') + '-' + String(dp[1]||'01').padStart(2,'0');
          }
          // 2) 연도가 있지만 과거 연도일 때 (2023-05-08, 2024-05-08 등)
          if(rd.length === 10) {
            var ry = parseInt(rd.split('-')[0]);
            var cy = new Date().getFullYear();
            if(ry < cy) {
              // 과거 연도 → 현재 연도로 교체
              rd = cy + rd.substring(4);
            }
          }
          setEditDate(rd);
        }
        setStep(3);
      });
    };
    reader.readAsDataURL(file);
  }
 
  function selectApp(app) {
    setAppType(app.id); setEditCat(app.catId); setEditSubCat('');
    if(fileRef.current) fileRef.current.click();
  }

    h(Hdr,{title:'앱 화면 캡처 분석',onBack:onBack}),

        h('p',{style:{color:'#FF6B9D',fontSize:12,fontWeight:700,margin:'0 0 5px'}},'📸 사용 방법'),
        h('p',{style:{color:C.muted,fontSize:12,margin:0,lineHeight:1.7}}, '1. 결제 완료 화면 스크린샷 저장\n2. 아래에서 앱 종류 선택\n3. 갤러리에서 캡처 이미지 선택\n4. AI가 자동 분석 → 확인 후 저장')
      ),
      h('p',{style:{color:C.muted,fontSize:12,marginBottom:10,paddingLeft:4}},'어느 앱의 캡처인가요?'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}},
        APPS.map(function(a){ return h(GCard,{key:a.id,onClick:function(){selectApp(a);},style:{textAlign:'center',cursor:'pointer',padding:14}}, h('span',{style:{fontSize:32}},a.icon), h('p',{style:{color:C.text,fontSize:13,fontWeight:700,margin:'8px 0 0'}},a.label) ); })
      )
    ),
 
    step===2 && h(GCard,{style:{textAlign:'center',padding:36}},
      imgSrc && h('img',{src:imgSrc,style:{width:'100%',maxHeight:180,objectFit:'contain',borderRadius:10,marginBottom:14}}),
      h('span',{style:{fontSize:36}},'🧬'),
      h('p',{style:{color:C.text,fontSize:15,fontWeight:700,margin:'12px 0 0'}},'AI가 화면을 분석하고 있습니다...'),
      h('div',{style:{background:C.faint,borderRadius:6,height:8,margin:'12px 0'}},
        h('div',{style:{width:'70%',height:'100%',background:'#FF6B9D',borderRadius:6,animation:'pulse 1.5s infinite'}})

      ),

          h('span',{style:{color:C.green,fontSize:18}},editSt?'✅':'⚠️'),

          h(Bdg,{text:APPS.find(function(a){return a.id===appType;})?APPS.find(function(a){return a.id===appType;}).label:'앱',color:'#FF6B9D'})
        ),
        h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 6px'}},'상호명 / 주문처'),
        h('input',{value:editSt,onChange:function(e){setEditSt(e.target.value);}, placeholder:'예: 맘스터치, 마켓컬리', style:{width:'100%',padding:'8px 12px',borderRadius:8,background:C.faint,border:'1px solid '+C.border,color:C.text,fontSize:13,marginBottom:10,outline:'none'}}),

          })
        ),
        (editCat && SUB_CATS[editCat]) && h('div', {style:{padding:'8px', background:C.card2, borderRadius:8, border:'1px dashed '+getCat(editCat).color+'66'}},

function FamilyGoalManager(props) {
  var txs = props.txs;
  var goals = useState(function(){ return lsGet(LS_GOALS, { title: '여름휴가비 모으기', target: 3000000, isCompleted: false }); });
  var setGoals = goals[1]; goals = goals[0];
  var showFirework = useState(false); var setShowFirework = showFirework[1]; showFirework = showFirework[0];
  var aiMsg = useState(''); var setAiMsg = aiMsg[1]; aiMsg = aiMsg[0];
  var isEditing = useState(false); var setIsEditing = isEditing[1]; isEditing = isEditing[0];
  var editTitle = useState(goals.title); var setEditTitle = editTitle[1]; editTitle = editTitle[0];
  var editTarget = useState(String(goals.target)); var setEditTarget = editTarget[1]; editTarget = editTarget[0];

 // ★수정: [여가비] 카테고리 입력액만 합산 (생활비와 완전 분리), 출금 시 차감 완벽 반영
  var currentSavings = txs.filter(function(t){ return t.catId === 'travel_fund'; }).reduce(function(s,t){ return s + (t.assetType === 'out' ? -t.amount : t.amount); }, 0);
  
  var pct = goals.target > 0 ? Math.min((currentSavings / goals.target) * 100, 100) : 0;

var currentTheme = localStorage.getItem('flai_theme') || 'dark';
  var isLight = currentTheme === 'light';
  var isCozy  = currentTheme === 'cozy';

/* ★ 테마별 트랙(배경) 색상 (3D 파이프 느낌) */
  var trackBg = isLight ? '#E9ECEF' : (isCozy ? '#3E2A1E' : '#1A1A2E');
  var trackShadow = isLight ? 'inset 0 3px 6px rgba(0,0,0,0.1), 0 1px 0 rgba(255,255,255,1)' : 'inset 0 4px 8px rgba(0,0,0,0.6)';
  
  /* ★ 리퀴드 에너지 색상 조합 */
  var baseGrad = pct >= 80 ? (isLight ? '#FF4757, #FF6B81' : '#FF007C, #FF6B6B') 
               : pct >= 50 ? (isLight ? '#00BFA5, #1DD1A1' : '#00E5FF, #00BFA5') 
               : (isLight ? '#536DFE, #70A1FF' : '#7C3AED, #536DFE');

  /* 사선 투명 스트라이프 패턴을 겹쳐서 애니메이션 텍스처 생성 */
  var barBg = 'linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent), linear-gradient(90deg, ' + baseGrad + ')';
  var headColor = pct >= 80 ? (isLight?'#FF4757':'#FF007C') : pct >= 50 ? (isLight?'#00BFA5':'#00E5FF') : (isLight?'#536DFE':'#7C3AED');

  /* ★ CSS 애니메이션 동적 주입 */
  useEffect(function() {
    if(!document.getElementById('flai-liquid-bar-style')) {
      var s = document.createElement('style');
      s.id = 'flai-liquid-bar-style';
      s.innerHTML = 
        "@keyframes flaiFlowStripe { 0% { background-position: 0 0, 0 0; } 100% { background-position: 40px 0, 0 0; } }\n" +
        ".flai-liquid-fill {\n" +
        "  background-size: 40px 40px, 100% 100% !important;\n" +
        "  animation: flaiFlowStripe 1s linear infinite !important;\n" +
        "}\n" +
        ".flai-liquid-head {\n" +
        "  position: absolute; right: -2px; top: -2px; bottom: -2px; width: 14px;\n" +
        "  border-radius: 50%; background: #FFF;\n" +
        "  box-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 16px currentColor;\n" +
        "  z-index: 2;\n" +
        "}";
      document.head.appendChild(s);
    }

    if (pct >= 100 && !goals.isCompleted) {
      setShowFirework(true);
      setGoals(Object.assign({}, goals, { isCompleted: true }));
      lsSet(LS_GOALS, Object.assign({}, goals, { isCompleted: true }));
      
      var apiKey = lsGet(LS_GEMINI, '');
      if (apiKey) {
        var prompt = "가족 목표 '" + goals.title + "'(" + goals.target + "원) 달성 축하! 다음으로 도전할 만한 여행지나 목표 제안해줘.";
        callGeminiText(prompt, apiKey, function(err, res) { if(!err) setAiMsg("🧬 AI: " + res); });
      }
      setTimeout(function(){ setShowFirework(false); }, 4000);
    }
  }, [pct, goals]);

  function saveGoal() {
    var newGoal = { title: editTitle, target: parseInt(editTarget)||0, isCompleted: false };
    setGoals(newGoal); lsSet(LS_GOALS, newGoal); setIsEditing(false); setAiMsg('');
  }

  return h(GCard, {style:{marginBottom:14, background: isLight ? '#FFFFFF' : 'linear-gradient(145deg, '+C.card+', '+C.faint+')', border: isLight ? '1px solid #E2E8F0' : '1px solid '+C.border, position:'relative', overflow:'hidden', boxShadow: isLight ? '0 4px 12px rgba(0,0,0,0.03)' : 'none'}},
    showFirework && h(FireworkHologram, null),
    h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}},
      h('div', {style:{display:'flex', alignItems:'center', gap:8}}, h('span', {style:{fontSize:20}}, '🎯'), h('p', {style:{color:C.text, fontSize:15, fontWeight:800, margin:0}}, '가족 공동 목표')),
      h('button', {onClick:function(){setIsEditing(!isEditing);}, style:{background:'none', border:'none', color:C.accent, fontSize:12, fontWeight:700, cursor:'pointer'}}, isEditing?'취소':'목표 변경')
    ),
    isEditing ? h('div', {style:{display:'flex', flexDirection:'column', gap:8}},
      h('input', {value:editTitle, onChange:function(e){setEditTitle(e.target.value);}, placeholder:'목표 이름', style:{padding:10, borderRadius:8, background:C.card2, border:'1px solid '+C.border, color:C.text, outline:'none'}}),
      h('input', {value:editTarget, onChange:function(e){setEditTarget(e.target.value.replace(/[^0-9]/g,''));}, placeholder:'목표 금액', type:'tel', style:{padding:10, borderRadius:8, background:C.card2, border:'1px solid '+C.border, color:C.text, outline:'none'}}),
      h('button', {onClick:saveGoal, style:{padding:12, borderRadius:8, border:'none', background:C.green, color:'#fff', fontWeight:800, cursor:'pointer'}}, '목표 저장')
    ) : h('div', null,
      h('div', {style:{display:'flex', justifyContent:'space-between', marginBottom:8}}, h('span', {style:{color:C.text, fontSize:14, fontWeight:700}}, goals.title), h('span', {style:{color: pct >= 80 ? (isLight?'#FF4757':'#FFA500') : headColor, fontSize:14, fontWeight:800}}, pct.toFixed(1) + '%')),
      
      /* ★ 3D 리퀴드 에너지 튜브 */
      h('div', {style:{width:'100%', height:22, borderRadius:12, background:trackBg, boxShadow:trackShadow, position:'relative', border: isLight ? '1px solid #CBD5E0' : '1px solid #000'}},
        h('div', {
          className: 'flai-liquid-fill',
          style:{
            width: pct+'%', height:'100%', background: barBg, borderRadius:10, 
            boxShadow: isLight ? 'inset 0 -2px 4px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.6)' : 'inset 0 -2px 4px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4)', 
            transition:'width 1s cubic-bezier(0.4, 0, 0.2, 1)', position:'relative',
            color: headColor // 발광 구슬 색상 상속
          }
        }, 
          /* 채워진 끝부분 반짝이는 글로우 구슬 */
          pct > 3 && h('div', {className: 'flai-liquid-head'})
        )
      ),
      h('div', {style:{display:'flex', justifyContent:'space-between', marginTop:6}},
        h('span', {style:{color:C.green, fontSize:11, fontWeight:700}}, '모은돈 ' + fmtS(currentSavings)),
        h('span', {style:{color:C.muted, fontSize:11}}, '목표 ' + fmtS(goals.target))
      )
    )
  );
}

/* ★★★ [전역 공통 알림 발송 함수] AlarmModal에서 접근 가능하도록 전역 선언 ★★★ */
function sendNotif(title, body, tag) {
  if(!('Notification' in window)) return Promise.reject('미지원 브라우저');
  if(Notification.permission !== 'granted') return Promise.reject('권한없음');
  var opts = {
    body: body || '',
    icon: 'https://kimyungkook.github.io/family-ledger/icon-192.png',
    badge: 'https://kimyungkook.github.io/family-ledger/icon-192.png',
    tag: tag || ('notif-' + Date.now()),
    vibrate: [200, 100, 200],
    requireInteraction: false
  };
  if('serviceWorker' in navigator) {
    return navigator.serviceWorker.getRegistration('./').then(function(reg) {
      if(reg && reg.active) {
        return reg.showNotification(title, opts);
      }
      return new Notification(title, opts);
    }).catch(function() {
      return new Notification(title, opts);
    });
  }
  try { new Notification(title, opts); return Promise.resolve(); }
  catch(e) { return Promise.reject(e); }
}
/* ★★★ [전역 sendNotif 끝] ★★★ */

  );

  var alarms = [
    {key:'newTx',   label:'새 지출 입력 알림',   desc:'가족이 지출을 입력하면 즉시 알림'},

    if(!('Notification' in window)) {

}

            permStatus === 'granted' ? '✅ 알림 권한 허용됨' :

            permStatus === 'unsupported' ? '❌ 이 브라우저는 알림 미지원' :

          ),

          )
        ),
        permStatus !== 'granted' && permStatus !== 'denied' && h('button', {
          onClick: function(){ requestPermission(); },

        }, '권한 요청')

  var eDate    = new Date(effEnd.getFullYear(),   effEnd.getMonth(),   effEnd.getDate(),   23, 59, 59);

    if (tx.type !== 'expense') return false;

    if (!isCredit(tx.method)) return false;
    var dp = (tx.date || '').split('-');
    if (dp.length < 3) return false;

  var periodIncTxs = allTxs.filter(function(tx) {
    if (tx.type !== 'income') return false;
    var dp = (tx.date || '').split('-');

function Analysis(props) {
  var txs = props.txs;
  var startDay = props.startDay || lsGet(LS_START_DAY, 1);
  var period   = useState('월간'); var setPeriod  = period[1];   period   = period[0];
  var dp = props.dp;
  var baseDate = props.baseDate;
  var selCat   = useState(null);   var setSelCat  = selCat[1];   selCat   = selCat[0];
  var selMem   = useState(0);      var setSelMem  = selMem[1];   selMem   = selMem[0];
  
  /* ★ 이전 에러(detailType) 해결용 변수 추가 */
  var detailTypeArr = useState(null); var setDetailType = detailTypeArr[1]; var detailType = detailTypeArr[0];

  /* ★ 아래부터는 지워지면 안 되는 필수 원본 변수들입니다 */
  var budget   = useState(function(){ return lsGet(LS_BUDGET, 0); });
  var setBudget = budget[1]; budget = budget[0];
  var editBudget = useState(false); var setEditBudget = editBudget[1]; editBudget = editBudget[0];
  var budgetInput = useState(String(budget||'')); var setBudgetInput = budgetInput[1]; budgetInput = budgetInput[0];
  var memViewMode = useState('sub'); var setMemViewMode = memViewMode[1]; memViewMode = memViewMode[0];  
  var csArr = useState(false); var setShowCS = csArr[1]; var showCS = csArr[0];
  var anlModalArr = useState(null); var setAnlModal = anlModalArr[1]; var anlModal = anlModalArr[0];
  var aefArr = useState(lsGet('flai_anl_ef','')); var setAnlExpFrom = aefArr[1]; var anlExpFrom = aefArr[0];
  var aetArr = useState(lsGet('flai_anl_et','')); var setAnlExpTo   = aetArr[1]; var anlExpTo   = aetArr[0];
  var aifArr = useState(lsGet('flai_anl_if','')); var setAnlIncFrom = aifArr[1]; var anlIncFrom = aifArr[0];
  var aitArr = useState(lsGet('flai_anl_it','')); var setAnlIncTo   = aitArr[1]; var anlIncTo   = aitArr[0];
  
  var ftx = useMemo(function(){ return fDash(txs, dp, baseDate, startDay); }, [txs, dp, baseDate, startDay]);
  var exp = ftx.filter(function(t){ return t.type==='expense' && t.catId!=='invest' && t.catId!=='travel_fund'; });
  
  /* ★ 문제 발생 지점(inc) 정상 복구 완료 */
  var inc = ftx.filter(function(t){ return t.type==='income'; });
  var totE = exp.reduce(function(s,t){ return s+t.amount; }, 0);
  
  var totI = useMemo(function(){
    var now = new Date();
    var sd = startDay || 1;
    // 가계부 기준 현재 달의 시작일/종료일 계산 (fDash 로직과의 동기화)
    var curFin = getFinMonth(now.toISOString(), sd);
    
    var monthlyIncTxs = txs.filter(function(t){
      if(t.type !== 'income') return false;
      var f = getFinMonth(t.date, sd);
      return f.y === curFin.y && f.m === curFin.m;
    });
    var monthlyTotI = monthlyIncTxs.reduce(function(s,t){ return s+t.amount; }, 0);

    if(period === '주간') {
      var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
      return txs.filter(function(t){ return t.type==='income' && new Date(t.date) >= weekAgo; })
                .reduce(function(s,t){ return s+t.amount; }, 0);
    } else if(period === '연간') {
      return inc.reduce(function(s,t){ return s+t.amount; }, 0);
    } else {
      return monthlyTotI;
    }
  }, [txs, period, inc, startDay]);
 
  var ALL_ANALYSIS_CATS = [{id:'all', name:'전체', icon:'📊', color:'#3D5AFE'}].concat(EX_CATS);
  function getCatTotal(catId) {
    if(catId === 'all') return totE;
    return exp.filter(function(t){ return t.catId===catId; }).reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemCatTotal(catId, memberId) {
    var filtered = exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);
    });
    return filtered.reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemTxs(catId, memberId) {
    return exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);
    }).sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  }
  function buildDonut() {
    var cx=50, cy=50, R=36, sw=15;
    var total = totE || 1;
    var circumference = 2 * Math.PI * R;
    var offset = 0;
    var slices = EX_CATS.map(function(c){
      var val = exp.filter(function(t){ return t.catId===c.id; }).reduce(function(s,t){ return s+t.amount; },0);
      return {color:c.color, val:val};
    }).filter(function(s){ return s.val>0; });
    if(slices.length===0) {
      return h('svg',{width:90,height:90,viewBox:'0 0 100 100'},
        h('circle',{cx:50,cy:50,r:36,fill:'none',stroke:'#2E2E52',strokeWidth:15}),
        h('text',{x:50,y:47,textAnchor:'middle',fontSize:10,fill:'#8888AA'},'데이터'),
        h('text',{x:50,y:59,textAnchor:'middle',fontSize:10,fill:'#8888AA'},'없음')
      );
    }
    var paths = [];
    slices.forEach(function(s){
      var dash = (s.val/total)*circumference;
      var gap  = circumference - dash;
      paths.push(h('circle',{key:s.color+offset,cx:cx,cy:cy,r:R,fill:'none',stroke:s.color,strokeWidth:sw,
        strokeDasharray:String(dash.toFixed(1))+' '+String(gap.toFixed(1)),
        strokeDashoffset:String(-offset.toFixed(1)),
        transform:'rotate(-90 50 50)'}));
      offset += dash;
    });
    return h('svg',{width:90,height:90,viewBox:'0 0 100 100'},
      h('circle',{cx:cx,cy:cy,r:R,fill:'none',stroke:'#2E2E52',strokeWidth:sw}),
      paths,
      h('text',{x:50,y:46,textAnchor:'middle',fontSize:10,fill:'#F0F0FF',fontWeight:'700'},'총지출'),
      h('text',{x:50,y:58,textAnchor:'middle',fontSize:10,fill:'#8888AA'},fmtS(totE))
    );
  }
  // ★ 추가: 홈(Dashboard)과 달력을 연동하기 위해 상위 App에서 받은 dp, baseDate 사용
  var dp = props.dp || '이번달';
  var baseDate = props.baseDate || new Date();
  
  var pLabel = dp==='이번달'?'당월':dp==='분기'?'분기':'연간';
  var budgetPct = budget>0 ? Math.min(Math.round(totE/budget*100),100) : 0;
  var incPct = totI>0 ? Math.round(totE/totI*100) : 0;
  var selCatObj = selCat ? ALL_ANALYSIS_CATS.find(function(c){ return c.id===selCat; }) : null;
  var selCatTotal = selCat ? getCatTotal(selCat) : 0;

  // 홈의 월 선택창 정보를 제목에 표시하기 위한 함수
  function getAnalysisDateLabel() { 
    if (dp === '이번달') return baseDate.getFullYear() + '년 ' + (baseDate.getMonth() + 1) + '월';
    if (dp === '분기') return baseDate.getFullYear() + '년 ' + (Math.floor(baseDate.getMonth() / 3) + 1) + '분기';
    return baseDate.getFullYear() + '년';
  }

  return h('div',{style:{padding:'0 16px 95px',overflowY:'auto',height:'100vh'}},
    // 제목에 (2026년 5월) 형태의 날짜가 연동되어 표시됩니다.
    h(Hdr,{title:'소비 분석 (' + getAnalysisDateLabel() + ')'}), 
    h(GCard,{style:{marginBottom:12, border:'1px solid '+C.accent+'66', background:C.card, boxShadow:'0 4px 12px '+C.accent+'15'}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:budget>0?8:0}},

// ★★★ [추가] 월별로 그룹화 ★★★
 var groupedByMonth = useMemo(function(){

function AuthScreen(props) {
  var onLogin = props.onLogin;
  var mode    = useState('login'); var setMode    = mode[1];    mode    = mode[0];
  var loginId = useState('');     var setLoginId = loginId[1]; loginId = loginId[0];
  var loginPw = useState('');     var setLoginPw = loginPw[1]; loginPw = loginPw[0];
  var sName   = useState('');     var setSName   = sName[1];   sName   = sName[0];
  var sId     = useState('');     var setSId     = sId[1];     sId     = sId[0];
  var sPw     = useState('');     var setsPw     = sPw[1];     sPw     = sPw[0];
  var sCode   = useState('');     var setSCode   = sCode[1];   sCode   = sCode[0];
  var loading = useState(false);  var setLoading = loading[1]; loading = loading[0];
  var errMsg  = useState('');     var setErrMsg  = errMsg[1];  errMsg  = errMsg[0];

  /* ── 로그인 ── */
  function doLogin() {
    if(!loginId.trim() || !loginPw.trim()) {
      setErrMsg('아이디와 비밀번호를 입력해주세요.'); return;
    }
    setLoading(true); setErrMsg('');

    /* ★ Firebase에서 먼저 찾기 */
    fbGetUser(loginId.trim(), function(fbUser) {
      if(fbUser && fbUser.pw === loginPw) {
        /* Firebase 로그인 성공 */
        var u = {userId: fbUser.userId, name: fbUser.name, isAdmin: fbUser.isAdmin||false};
        lsSet(LS_USER, u);
        /* 로컬에도 동기화 */
        var localUsers = lsGet(LS_USERS, []);
        var exists = localUsers.find(function(x){ return x.userId === u.userId; });
        if(!exists) { localUsers.push(fbUser); lsSet(LS_USERS, localUsers); }
        setLoading(false);
        onLogin(u);
        return;
      }
      /* Firebase에 없으면 로컬 확인 */
      var users = lsGet(LS_USERS, []);
      var found = users.find(function(u){ return u.userId === loginId.trim(); });
      if(found && found.pw === loginPw) {
        /* 로컬 유저 → Firebase에 동기화 */
        fbSaveUser(found);
        var u2 = {userId: found.userId, name: found.name, isAdmin: found.isAdmin||false};
        lsSet(LS_USER, u2);
        setLoading(false);
        onLogin(u2);
        return;
      }
      setLoading(false);
      setErrMsg('아이디 또는 비밀번호가 올바르지 않습니다.');
    });
  }

  /* ── 회원가입 ── */
  function doSignup() {
    if(!sName.trim() || !sId.trim() || !sPw.trim() || !sCode.trim()) {
      setErrMsg('모든 항목을 입력해주세요.'); return;
    }
    /* ★ 가족 공유 코드 검증 */
    if(sCode.trim() !== JOIN_CODE) {
      setErrMsg('❌ 가족 공유 코드가 올바르지 않습니다.\n가족에게 코드를 문의하세요.');
      return;
    }
    setLoading(true); setErrMsg('');

    /* ★ Firebase에서 중복 아이디 확인 */
    fbGetUser(sId.trim(), function(existing) {
      if(existing) {
        setLoading(false);
        setErrMsg('이미 사용 중인 아이디입니다.');
        return;
      }
      /* 로컬에서도 중복 확인 */
      var users = lsGet(LS_USERS, []);
      if(users.some(function(u){ return u.userId === sId.trim(); })) {
        setLoading(false);
        setErrMsg('이미 사용 중인 아이디입니다.');
        return;
      }
      /* 블랙리스트 확인 */
      var blacks = lsGet(LS_BLACKLIST, []);
      if(blacks.some(function(b){ return b.userId === sId.trim(); })) {
        setLoading(false);
        setErrMsg('가입이 제한된 아이디입니다.');
        return;
      }
      var newUser = {
        userId: sId.trim(),
        name: sName.trim(),
        pw: sPw,
        isAdmin: false,
        joinedAt: new Date().toISOString().split('T')[0]
      };
      /* ★ Firebase에 저장 (크로스 디바이스 핵심!) */
      fbSaveUser(newUser);
      /* 로컬에도 저장 */
      users.push(newUser);
      lsSet(LS_USERS, users);
      var u = {userId: newUser.userId, name: newUser.name, isAdmin: false};
      lsSet(LS_USER, u);
      setLoading(false);
      onLogin(u);
    });
  }

  var inp = {
    width:'100%', padding:'14px 16px', borderRadius:12,
    background:C.card2, border:'1px solid '+C.border,
    color:C.text, fontSize:14, marginBottom:12,
    outline:'none', boxSizing:'border-box'
  };

  return h('div', {style:{
    minHeight:'100vh', display:'flex', flexDirection:'column',
    justifyContent:'center', padding:'20px 24px', background:C.bg
  }},
    h('div', {style:{textAlign:'center', marginBottom:32}},
      h('p', {style:{fontSize:56, margin:'0 0 8px'}}, '👨‍👩‍👧'),
      h('p', {style:{color:C.text, fontSize:24, fontWeight:800, margin:'0 0 6px'}},
        'FamilyLedger AI'),
      h('p', {style:{color:C.muted, fontSize:13, margin:0}},
        mode === 'login' ? '가족 가계부에 로그인하세요' : '새 계정을 만드세요')
    ),

    /* ── 에러 메시지 ── */
    errMsg && h('div', {style:{
      background:C.red+'15', border:'1px solid '+C.red+'33',
      borderRadius:10, padding:'10px 14px', marginBottom:14,
      whiteSpace:'pre-line'
    }},
      h('p', {style:{color:C.red, fontSize:12, margin:0, lineHeight:1.6}}, errMsg)
    ),

    /* ── 로그인 폼 ── */
    mode === 'login' && h('div', null,
      h('input', {value:loginId, onChange:function(e){setLoginId(e.target.value); setErrMsg('');},
        placeholder:'아이디', style:inp}),
      h('input', {value:loginPw, onChange:function(e){setLoginPw(e.target.value); setErrMsg('');},
        type:'password', placeholder:'비밀번호', style:Object.assign({},inp,{marginBottom:20})}),
      h('button', {

        style:{width:'100%', padding:16, borderRadius:14, border:'none',
          background:loading?C.faint:'linear-gradient(135deg,'+C.accent+',#536DFE)',
          color:loading?C.muted:'#fff', fontSize:16, fontWeight:800, cursor:'pointer'}
      }, loading ? '로그인 중...' : '🔐 로그인'),
      h('p', {

        style:{textAlign:'center', marginTop:20, color:C.muted,
          fontSize:13, cursor:'pointer', lineHeight:1.8}
      }, '처음이신가요? ',
        h('span', {style:{color:C.accent, fontWeight:700}}, '회원가입')
      )
    ),

    /* ── 회원가입 폼 ── */
    mode === 'signup' && h('div', null,
      h('input', {value:sName, onChange:function(e){setSName(e.target.value); setErrMsg('');},
        placeholder:'이름', style:inp}),

        placeholder:'아이디', style:inp}),

        type:'password', placeholder:'비밀번호', style:inp}),

       h('input', {value:sCode,

    var cat = 'other', sub = '';
