(function(){
  function drawAppIcon(ctx, s) {
    var r = s/192;
    ctx.fillStyle = '#0A0E27';
    roundRect(ctx, 0, 0, s, s, 42*r); ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,0.25)'; ctx.lineWidth = 1.2*r;
    roundRect(ctx, 0, 0, s, s, 42*r); ctx.stroke();
    ctx.fillStyle = '#101C3A'; ctx.strokeStyle = 'rgba(0,229,255,0.4)'; ctx.lineWidth = 0.8*r;
    roundRect(ctx, 45*r, 32*r, 96*r, 120*r, 7*r); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0C1530'; ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 1.2*r;
    roundRect(ctx, 39*r, 26*r, 96*r, 120*r, 7*r); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,229,255,0.08)';
    roundRect(ctx, 49*r, 34*r, 76*r, 14*r, 3*r); ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,0.5)'; ctx.lineWidth = 1*r;
    ctx.beginPath(); ctx.moveTo(54*r,41*r); ctx.lineTo(96*r,41*r); ctx.stroke();
    drawCheck(ctx, 54*r, 58*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,58*r); ctx.lineTo(104*r,58*r); ctx.stroke();
    ctx.fillStyle = '#7BF5A5'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('+850', 122*r, 62*r);
    drawCheck(ctx, 54*r, 74*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,74*r); ctx.lineTo(100*r,74*r); ctx.stroke();
    ctx.fillStyle = '#FF6B9D'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('-320', 122*r, 78*r);
    drawCheck(ctx, 54*r, 90*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,90*r); ctx.lineTo(108*r,90*r); ctx.stroke();
    ctx.fillStyle = '#FF6B9D'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('-150', 122*r, 94*r);
    ctx.fillStyle = 'rgba(0,229,255,0.06)';
    roundRect(ctx, 49*r, 112*r, 76*r, 14*r, 3*r); ctx.fill();
    ctx.fillStyle = 'rgba(0,229,255,0.6)'; ctx.font = (9*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('+380', 120*r, 123*r);
    ctx.fillStyle = '#00E5FF';
    ctx.beginPath(); ctx.arc(142*r, 136*r, 25*r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0A0E27';
    ctx.beginPath(); ctx.arc(142*r, 136*r, 20*r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00E5FF'; ctx.font = 'bold '+(22*r)+'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('W', 142*r, 137*r); ctx.textBaseline = 'alphabetic';
    var dots = [['#FF6B9D',53*r,18*r],['#00E5FF',66*r,14*r],['#FFD700',79*r,18*r]];
    dots.forEach(function(d){ ctx.fillStyle=d[0]; ctx.beginPath(); ctx.arc(d[1],d[2],5*r,0,Math.PI*2); ctx.fill(); });
  }
  function drawCheck(ctx, x, y, r, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.8*r; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+4*r,y+4*r); ctx.lineTo(x+10*r,y-4*r); ctx.stroke();
  }
  function roundRect(ctx, x, y, w, h, rad) {
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.lineTo(x+w-rad,y);
    ctx.arcTo(x+w,y,x+w,y+rad,rad); ctx.lineTo(x+w,y+h-rad);
    ctx.arcTo(x+w,y+h,x+w-rad,y+h,rad); ctx.lineTo(x+rad,y+h);
    ctx.arcTo(x,y+h,x,y+h-rad,rad); ctx.lineTo(x,y+rad);
    ctx.arcTo(x,y,x+rad,y,rad); ctx.closePath();
  }
  function generateIcon(size) {
    var c = document.createElement('canvas'); c.width = size; c.height = size;
    var ctx = c.getContext('2d'); drawAppIcon(ctx, size); return c.toDataURL('image/png');

        ],

          {
            src: 'https://kimyungkook.github.io/family-ledger/screenshot-wide.png',
            sizes: '1280x720',
            type: 'image/png',
            form_factor: 'wide',
            label: 'FamilyLedger 데스크톱'

            sizes: '750x1334',
            type: 'image/png',
            form_factor: 'narrow',
            label: 'FamilyLedger 모바일'
          }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
      var mLink = document.createElement('link'); mLink.rel = 'manifest'; mLink.href = URL.createObjectURL(blob);
      document.head.appendChild(mLink);
    } catch(e) { console.warn('[PWA아이콘]', e); }
  });
})();

// ── 이하 v8 코드 100% 그대로 유지 ──────────────────────

// ★★★ [STEP1-완성판] 카드 결제일 시스템 ★★★
var LS_CARD_BILLING_DAY = 'flai_card_billing_day';

/* 결제일 기준 기간 계산 (billingDay=12 → 전월13일~당월12일) */
function getCardBillingPeriod(billingDay, baseDate) {
  var bd = Math.max(1, Math.min(28, parseInt(billingDay) || 12));
  var y  = baseDate.getFullYear();
  var m  = baseDate.getMonth(); // 0-indexed
  var sy = y, sm = m - 1;
  if (sm < 0) { sm = 11; sy--; }
  return {
    start: new Date(sy, sm, bd + 1, 0, 0, 0),
    end:   new Date(y,  m,  bd,     23, 59, 59)
  };
}

/* ★★★ 핵심 수정: 등록카드(bank_name 형식) + 직접입력(신용카드) 모두 잡는 판별 함수 ★★★ */
function isCreditCardMethod(method) {
  if (!method) return false;
  var m = method.toString();
  // 1. 직접 '신용카드' 또는 '신용' 포함
  if (m === '신용카드' || m.indexOf('신용') >= 0) return true;
  // 2. 명백한 비신용 결제 방법 → 즉시 false
  var notCredit = ['체크카드','현금','이체','카카오페이','네이버페이','상품권','지역화폐','기타','카드'];
  for (var i = 0; i < notCredit.length; i++) {
    if (m === notCredit[i]) return false;
  }
  // 3. ★★ 핵심: 등록된 신용카드와 method 문자열 매칭 ★★
  // method 저장 형식: "신한_아이사랑행복카드(****-****-****-1234)"
  var registeredCards = lsGet(LS_CARDS, INIT_CARDS);
  for (var j = 0; j < registeredCards.length; j++) {
    var c = registeredCards[j];
    if (c.type === 'credit') {
      var bankMatch = m.indexOf(c.bank) >= 0;
      var nameMatch = m.indexOf(c.name) >= 0;
      var last4Match = c.last4 && m.indexOf(c.last4) >= 0;
      if (bankMatch && (nameMatch || last4Match)) return true;
    }
  }
  return false;
}

/* 신용카드 전용 + 결제기간 필터 (전체 txs 기준) */
function filterCreditCardTxs(allTxs, billingDay, baseDate) {
  var period = getCardBillingPeriod(billingDay, baseDate);
  var sDate  = period.start;
  var eDate  = period.end;
  return allTxs.filter(function(tx) {
    if (tx.type !== 'expense') return false;
    if (tx.catId === 'invest' || tx.catId === 'travel_fund') return false;
    if (!isCreditCardMethod(tx.method)) return false;
    var d = new Date(tx.date + 'T12:00:00');
    return d >= sDate && d <= eDate;
  });
}

/* 날짜 포맷 MM월 DD일 */
function fmtBillingDate(d) {
  if (!d) return '';
  return (d.getMonth() + 1) + '월 ' + String(d.getDate()).padStart(2, '0') + '일';
}

/* 현재 순저축 계산 */
function calcNetSaving(txs){
  var income = txs
    .filter(function(t){
      return t.type==='income';
    })
    .reduce(function(s,t){
      return s+t.amount;
    },0);

  var expense = txs
    .filter(function(t){
      return t.type==='expense';
    })
    .reduce(function(s,t){
      return s+t.amount;
    },0);

  return income-expense;
}

/* 진행률 계산 */
function goalPercent(now,target){
  if(target<=0) return 0;
  return Math.min(
    Math.round((now/target)*100),
    100
  );
}
// ★추가: 사용자가 설정한 시작일(sDay)을 기준으로 진짜 가계부의 '년/월'을 계산해 주는 요술 함수
function getFinMonth(dateStr, sDay) {
  var d = new Date(dateStr);
  var y = d.getFullYear();
  var m = d.getMonth();
  // 거래 날짜가 시작일보다 작으면, 가계부상으로는 아직 '저번 달'임!
  if (d.getDate() < sDay) {
    m--;
    if (m < 0) { m = 11; y--; }
  }
  return { y: y, m: m };
}

function isCredit(method) {
  if (!method) return false;
  var m = String(method).trim();

  // ── 1. 명백한 비카드 결제수단 즉시 제외 ──
  var notCard = ['현금','이체','카카오페이','네이버페이','상품권',
                 '지역화폐','기타','급여이체','현금영수증','계좌이체'];
  for (var i = 0; i < notCard.length; i++) {
    if (m === notCard[i]) return false;
  }

  // ── 2. 체크카드 제외 ──
  if (m === '체크카드') return false;
  if (m.indexOf('체크') >= 0 && m.indexOf('카드') >= 0) return false;
  if (m.indexOf('직불') >= 0) return false;

  // ── 3. 명시적 신용카드 라벨 ──
  if (m === '신용카드') return true;
  if (m === '카드')     return true; // 불명확한 '카드' → 신용카드로 처리
  if (m.indexOf('신용') >= 0) return true;

  // ── 4. 등록된 카드 목록과 매칭 (핵심) ──
  var cards = [];
  try {
    var raw = lsGet(LS_CARDS, null);
    if (Array.isArray(raw)) cards = raw;
  } catch(e) { cards = []; }

  for (var j = 0; j < cards.length; j++) {
    var c = cards[j];
    if (!c || !c.bank) continue;
    var bankHit  = m.indexOf(c.bank) >= 0;
    var nameHit  = c.name  && m.indexOf(c.name)  >= 0;
    var last4Hit = c.last4 && m.indexOf(c.last4) >= 0;
    if (bankHit && (nameHit || last4Hit)) {
      // 등록카드와 매칭됨 → type으로 신용/체크 구분
      return c.type === 'credit';
    }
  }

  // ── 5. ★★★ 핵심 보완: 카드번호 패턴(****) 감지 ──
  // methodDisplay()가 등록카드 사용 시 반드시 "****" 포함
  // 체크카드가 아닌 **** 패턴 = 신용카드로 판단
  if (m.indexOf('****') >= 0) {
    // 등록된 체크카드 목록과 대조 → 체크카드면 제외
    var isKnownDebit = false;
    for (var k = 0; k < cards.length; k++) {
      var dc = cards[k];
      if (!dc || dc.type !== 'check') continue;
      var dbankHit  = dc.bank  && m.indexOf(dc.bank)  >= 0;
      var dnameHit  = dc.name  && m.indexOf(dc.name)  >= 0;
      var dlast4Hit = dc.last4 && m.indexOf(dc.last4) >= 0;
      if (dbankHit && (dnameHit || dlast4Hit)) { isKnownDebit = true; break; }
    }
    if (!isKnownDebit) return true; // 등록된 체크카드 아니면 → 신용카드
  }

  // ── 6. 카드사 이름 직접 포함 여부 (CSV 업로드 대응) ──
  var creditBanks = ['신한카드','국민카드','KB카드','하나카드','우리카드',
                     'IBK카드','농협카드','NH카드','현대카드','삼성카드',
                     '롯데카드','BC카드','씨티카드','카카오뱅크카드'];
  for (var n = 0; n < creditBanks.length; n++) {
    if (m.indexOf(creditBanks[n]) >= 0 && m.indexOf('체크') < 0) return true;
  }

  // ── 7. 페이류는 신용카드 아님 ──
  if (m.indexOf('페이') >= 0) return false;

  return false;
}

function getCardBillingPeriod(billingDay, baseDate) {
  var bd = Math.max(1, Math.min(28, parseInt(billingDay) || 12));
  var y = baseDate.getFullYear();
  var m = baseDate.getMonth();
  var sy = y; var sm = m - 1;
  if (sm < 0) { sm = 11; sy--; }
  return {
    start: new Date(sy, sm, bd + 1, 0, 0, 0),
    end:   new Date(y,  m,  bd,     23, 59, 59)
  };
}

function fmtBillingDate(d) {
  if (!d) return '';
  return (d.getMonth() + 1) + '월 ' + String(d.getDate()).padStart(2, '0') + '일';
}

function getStoreLogo(storeName) {
  if (!storeName) return null;
  var n = storeName.replace(/\s/g, '');
  if (n.indexOf('CU') >= 0 || n.indexOf('씨유') >= 0)          return STORE_LOGOS['CU'];
  if (n.indexOf('이마트24') >= 0 || n.indexOf('EMART24') >= 0)  return STORE_LOGOS['EMART24'];
  if (n.indexOf('GS25') >= 0 || n.indexOf('지에스') >= 0)       return STORE_LOGOS['GS25'];
  if (n.indexOf('7') >= 0 || n.indexOf('세븐') >= 0)            return STORE_LOGOS['7ELEVEN'];
  if (n.indexOf('파리바게') >= 0)                                return STORE_LOGOS['파리바게뜨'];
  if (n.indexOf('뚜레') >= 0)                                    return STORE_LOGOS['뚜레쥬르'];
  if (n.indexOf('노브랜드') >= 0)                                return STORE_LOGOS['노브랜드'];
  if (n.indexOf('다이소') >= 0)                                  return STORE_LOGOS['다이소'];
  return null;
}

function storeIcon(storeName, catIcon, size) {
  var logo = getStoreLogo(storeName);
  if (logo) {
    return h('img', {
      src: logo,
      style: {
        width: size || 20,
        height: size || 20,
        borderRadius: 4,
        objectFit: 'contain',
        background: '#fff'
      },
      onError: function(e) { e.target.style.display = 'none'; }
    });
  }
  return catIcon;
}

/* ── 카드번호 암호화 / 복호화 ── */
function encryptCard(num) {
  try { return btoa(num.split('').map(function(c,i){ return String.fromCharCode(c.charCodeAt(0)^(i%9+7)); }).join('')); }
  catch(e){ return ''; }
}
function decryptCard(enc) {
  try { return atob(enc).split('').map(function(c,i){ return String.fromCharCode(c.charCodeAt(0)^(i%9+7)); }).join(''); }
  catch(e){ return ''; }
}
/* ── 카드 이미지 압축 (최대 500px, JPEG 72%) ── */
function compressCardImg(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX=500, r=Math.min(MAX/img.width, MAX/img.height, 1);
      var canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*r); canvas.height=Math.round(img.height*r);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 👇👇 [지운 자리에 여기서부터 복사해서 붙여넣으세요] 👇👇
function fDash(txs, p, baseDateObj, sDay) {
  sDay = sDay || 1;
  // ★기준 날짜를 사용자가 설정한 '가계부 시작일' 기준으로 진짜 년/월을 찾습니다.
  var targetFm = getFinMonth(baseDateObj.toISOString(), sDay);
  var targetY = targetFm.y;
  var targetM = targetFm.m;

  return txs.filter(function(t) {
    // ★각각의 거래 결제 날짜도 '가계부 시작일' 기준으로 어느 달에 속하는지 찾습니다.
    var tFm = getFinMonth(t.date, sDay);
    var ty = tFm.y;
    var tm = tFm.m;

    if (p === '이번달') {
      return ty === targetY && tm === targetM;
    }
    if (p === '분기') {
      var targetQ = Math.floor(targetM / 3);
      var tQ = Math.floor(tm / 3);
      return ty === targetY && tQ === targetQ;
    }
    return ty === targetY; // 올해
  });
}

function fPeriod(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  
  if (p === '주간') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6); weekAgo.setHours(0,0,0,0);
    return txs.filter(function(t) { return new Date(t.date) >= weekAgo; });
  }
  if (p === '월간') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y && fm.m === nowFm.m; });
  }
  return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y; });
}

// ★ [리디자인] DonutChart — 2026 Glassmorphism + Neon Glow 3D 도넛 차트
function DonutChart(props) {
  var data = props.data || [];
  var size = props.size || 110;
  var totalLabel = props.totalLabel || null;

  if (!data.length) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background:'radial-gradient(circle, #1C2541, #0A0E1A)',
    boxShadow:'0 0 20px rgba(0,229,255,0.1)'
  }});

  var total = data.reduce(function(s,d){return s+d.value;},0);
  if (!total) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background:'radial-gradient(circle, #1C2541, #0A0E1A)'
  }});

  var cx = size/2, cy = size/2;
  var R = size/2 * 0.82, r = size/2 * 0.50;
  var angle = -Math.PI/2;
  var paths = [], glowFilters = [];

  // 네온 그라데이션 팔레트
  var neonPalette = [
    ['#FF6B6B','#FF007C'], ['#00E5FF','#536DFE'], ['#FFD600','#FF9800'],
    ['#69F0AE','#00BFA5'], ['#CE93D8','#7C3AED'], ['#FF8A65','#FF5252']
  ];

  data.forEach(function(d,i){
    var slice = (d.value/total)*2*Math.PI;
    if(slice < 0.01){ angle += slice; return; }

    var x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
    var x2=cx+R*Math.cos(angle+slice), y2=cy+R*Math.sin(angle+slice);
    var xi1=cx+r*Math.cos(angle+slice), yi1=cy+r*Math.sin(angle+slice);
    var xi2=cx+r*Math.cos(angle), yi2=cy+r*Math.sin(angle);
    var lg = slice > Math.PI ? 1 : 0;

    var gradId = 'ng'+i, pal = neonPalette[i % neonPalette.length];

    glowFilters.push(
      h('defs', {key:'def'+i},
        h('linearGradient', {
          key: gradId, id: gradId,
          x1: '0%', y1: '0%', x2: '100%', y2: '100%'
        },
          h('stop', {offset:'0%', stopColor: pal[0]}),
          h('stop', {offset:'100%', stopColor: pal[1]})
        )
      )
    );

    // 글로우 + 메인 슬라이스
    paths.push(
      h('path', {
        key:'g'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')', opacity:'0.3',
        style:{filter:'blur(3px)'}
      }),
      h('path', {
        key:'p'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')',
        stroke: 'rgba(255,255,255,0.1)',
        strokeWidth: 1
      })
    );
    angle += slice;
  });

  return h('div', {style:{position:'relative', width:size, height:size}},
    h('svg', {
      width:size, height:size, viewBox:'0 0 '+size+' '+size,
      style:{filter:'drop-shadow(0 4px 16px rgba(0,0,0,0.5))'}
    },
      glowFilters, paths,
      h('circle', {
        cx:cx, cy:cy, r:r-2,
        fill:'rgba(10,14,26,0.9)',
        stroke:'rgba(255,255,255,0.1)',
        strokeWidth:1
      }),
      totalLabel && h('text', {
        x:cx, y:cy-4, textAnchor:'middle',
        fontSize:9, fill:'rgba(255,255,255,0.6)',
        fontWeight:'600'
      }, '총지출'),
      totalLabel && h('text', {
        x:cx, y:cy+6, textAnchor:'middle',
        fontSize:12, fill:'#ffffff',
        fontWeight:'800'
      }, totalLabel)
    )
  );
}


function LineChartSVG(props) {
  var data = props.data || [];
  var height = props.height || 140;
  var w=320, pL=38, pR=10, pT=14, pB=24;
  var iw=w-pL-pR, ih=height-pT-pB;
  if(data.length<2) return h('div',{style:{height:height,display:'flex',alignItems:'center',justifyContent:'center'}},
    h('span',{style:{color:C.muted,fontSize:12}},'데이터 없음'));
  var maxE = Math.max.apply(null,data.map(function(d){return d.expense;}));
  var maxI = data[0].income ? Math.max.apply(null,data.map(function(d){return d.income||0;})) : maxE;
  var maxV = Math.max(maxE,maxI,1);
  function px(i){ return pL+i*(iw/(data.length-1)); }
  function pyE(v){ return pT+ih-(v/maxV)*ih; }
  function pyI(v){ return pT+ih-(v/maxV)*ih; }
  var ePts = data.map(function(d,i){return px(i)+','+pyE(d.expense);}).join(' ');
  var iPts = data[0].income ? data.map(function(d,i){return px(i)+','+pyI(d.income);}).join(' ') : null;
  return h('svg',{viewBox:'0 0 '+w+' '+height,width:'100%',height:height},
    [0,0.5,1].map(function(f,i){
      return h('line',{key:'g'+i,x1:pL,y1:pT+ih*f,x2:w-pR,y2:pT+ih*f,stroke:C.border,strokeDasharray:'4 4'});
    }),
    [maxV,maxV*0.5,0].map(function(v,i){
      return h('text',{key:'y'+i,x:pL-4,y:pT+ih*(i*0.5)+4,textAnchor:'end',fontSize:9,fill:C.muted},(v/10000).toFixed(0)+'만');
    }),
    data.map(function(d,i){
      return h('text',{key:'x'+i,x:px(i),y:height-4,textAnchor:'middle',fontSize:10,fill:C.muted},d.month);
    }),
    iPts && h('polyline',{points:iPts,fill:'none',stroke:C.green,strokeWidth:2.5,strokeLinejoin:'round'}),
    h('polyline',{points:ePts,fill:'none',stroke:C.red,strokeWidth:2.5,strokeLinejoin:'round'}),
    data.map(function(d,i){return h('circle',{key:'ec'+i,cx:px(i),cy:pyE(d.expense),r:4,fill:C.red});}),
    iPts && data.map(function(d,i){return h('circle',{key:'ic'+i,cx:px(i),cy:pyI(d.income||0),r:4,fill:C.green});})
  );
}

/* ★ 수정된 AI 재무분석 및 KPI 컨설팅 섹션 ★ */
function SavingsModal(props) {
  var onClose = props.onClose;
  var txs = props.txs || [];
  var exp = txs.filter(function(t){return t.type==='expense';});
  var totE = exp.reduce(function(s,t){return s+t.amount;},0);
  
  // KPI 데이터 중복 계산 방지를 위한 단일 객체화
  var byCat = {};
  exp.forEach(function(t){byCat[t.catId]=(byCat[t.catId]||0)+t.amount;});

  // [중복 제거됨] 기존에 여러 번 정의되었던 KPI 기준값을 최적화된 단일 리스트로 관리
  var tips = [
    {icon:'🍜',cat:'food',  base:0.28,label:'식비 28% 이하 유지'},
    {icon:'🛒',cat:'shop',  base:0.20,label:'쇼핑 20% 이하 유지'},
    {icon:'📱',cat:'comm',  base:0.05,label:'통신비 5% 이하 유지'},
    {icon:'🎬',cat:'culture',base:0.08,label:'문화생활 8% 이하 유지'}
  ];

  var annual = 0;
  var rows = tips.map(function(tip){
    var curr = byCat[tip.cat]||0;
    var tgt = totE * tip.base;
    var save = Math.max(Math.round(curr - tgt), 0);
    annual += save * 12;
    return {icon:tip.icon, label:tip.label, curr:curr, tgt:tgt, save:save};
  }).filter(function(r){return r.save > 0;});

  return h(Sheet, {title:'🧬 AI 재무분석 및 컨설팅', onClose:onClose},
    h('div',{style:{padding:'12px',background:C.green+'15',borderRadius:12,textAlign:'center',marginBottom:14}},
      h('p',{style:{color:C.muted,fontSize:12,margin:'0 0 4px'}},'AI 분석 기반 연간 절약 가능액'),
      h('p',{style:{color:C.green,fontSize:24,fontWeight:900,margin:0}},fmt(annual))
    ),
    // 중복 출력 루프 제거 및 정제된 데이터 바인딩
    rows.length === 0
      ? h('p',{style:{color:C.muted,textAlign:'center',padding:'20px 0'}},'현재 KPI 지표가 매우 우수합니다 👍')
      : rows.map(function(r, i){
          return h('div',{key:i, style:{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:'1px solid '+C.faint}},
            h('span',{style:{fontSize:24,flexShrink:0}}, r.icon),

// ★§3 수정: Gemini OCR — 구글 최신 세대(gemini-2.5-flash) 완벽 적용 ★
var LS_GEMINI = 'flai_gemini_key';
/* ★★★ [학습 시스템] 시작 ★★★ */
var LS_STORE_MAP = 'flai_store_map';
 
function getLearnedCategory(storeName) {
  if (!storeName) return null;
  var map = lsGet(LS_STORE_MAP, {});
  if (map[storeName]) return map[storeName];
  var keys = Object.keys(map);
  for (var i = 0; i < keys.length; i++) {
    if (storeName.indexOf(keys[i]) >= 0 || keys[i].indexOf(storeName) >= 0) {
      return map[keys[i]];
    }
  }
  return null;
}
 
function saveLearnedCategory(storeName, catId, subCat) {
  if (!storeName || storeName.length < 2) return;
  var map = lsGet(LS_STORE_MAP, {});
  var existing = map[storeName] || { count: 0 };
  map[storeName] = {
    catId: catId,
    subCat: subCat || '',
    count: existing.count + 1,
    lastDate: new Date().toISOString().split('T')[0]
  };
  lsSet(LS_STORE_MAP, map);
}
 
function buildLearningContext(maxEntries) {
  /* 1단계: 수동 학습 데이터 (사용자가 수정 확정한 것) */
  var map = lsGet(LS_STORE_MAP, {});

  /* 2단계: 기존 전체 거래 내역에서 패턴 자동 추출 */
  var allTxs = lsGet(LS_TXS, []);
  allTxs.forEach(function(tx) {
    if (!tx.store || tx.store.length < 2) return;
    var key = tx.store;
    if (!map[key]) {
      map[key] = { catId: tx.catId, subCat: tx.subCat || '', count: 0 };
    }
    map[key].count++;
    /* 가장 최근 분류를 우선 반영 */
    map[key].catId = tx.catId;
    if (tx.subCat) map[key].subCat = tx.subCat;
  });

  /* 3단계: 사용 횟수 많은 순으로 정렬 후 프롬프트 생성 */
  var entries = Object.keys(map).map(function(k) {
    return { store: k, catId: map[k].catId, subCat: map[k].subCat, count: map[k].count };
  });
  entries.sort(function(a, b) { return b.count - a.count; });
  var top = entries.slice(0, maxEntries || 30);
  if (top.length === 0) return '';
  var lines = top.map(function(e) {
    return '"' + e.store + '" → category:"' + e.catId + '", sub_category:"' + (e.subCat || '') + '"';
  });
  return '\n\n★이 사용자의 과거 분류 이력(category와 sub_category 모두 반드시 동일하게 따를 것):\n' + lines.join('\n');
}

/* ★추가: AI 음성 및 텍스트 분석용 함수 (재무분석 & 음성인식에 사용) */
function callGeminiText(promptText, apiKey, callback) {
  // 대표님 지시대로 문자 파싱은 기존 Groq 키(LS_GEMINI)를 고정 사용
  var groqKey = lsGet(LS_GEMINI, apiKey); 
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant', // 문자 파싱 최강 모델
    messages: [{ role: 'user', content: promptText }],
    temperature: 0.1
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + groqKey);
  xhr.timeout = 20000;
  xhr.onload = function() {
    if(xhr.status >= 200 && xhr.status < 300) {
      try {
        var data = JSON.parse(xhr.responseText);
        callback(null, data.choices[0].message.content);
      } catch(e) { callback('해석 실패', null); }
    } else { callback('Groq 서버 오류', null); }
  };
  xhr.onerror = function() { callback('네트워크 오류', null); };
  xhr.send(body);
}
// --- [여기를 복사해서 callGeminiOCR 바로 위에 붙여넣으세요] ---
async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        // [중요] 파일이 없으면 그냥 원래 있던 base64라도 돌려주게 만들었어요
        if (!file) { resolve(null); return; } 

        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                // 너비를 800으로 더 줄여볼게요 (그럼 진짜 번개처럼 빨라져요!)
                let w = 800; 
                let h = Math.round((img.height * w) / img.width);
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                // 화질을 0.5(50%)로 더 낮춰서 용량을 확 줄입니다.
                resolve(canvas.toDataURL('image/jpeg', 0.5).split(',')[1]);
            };
        };
    });
}

          callback(null, JSON.parse(out.substring(out.indexOf('{'), out.lastIndexOf('}') + 1)));
        } catch (e) { startOCR(index + 1); }
      } else {
        startOCR(index + 1); // 에러 발생 시 다음 순위로 자동 전환
      }
    };
    xhr.onerror = function() { startOCR(index + 1); };
    xhr.send(body);
  }

  startOCR(0); // 분석 시작
}

function testGeminiKey(apiKey, onResult) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: 'hi' }],
    max_tokens: 10
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 15000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var d=JSON.parse(xhr.responseText);
        if(d.choices && d.choices[0]) onResult('success','');
        else onResult('error','알 수 없는 응답');
      } catch(e){ onResult('error','응답 파싱 오류'); }
    } else {
      var em='HTTP '+xhr.status;
      try{var ed=JSON.parse(xhr.responseText);if(ed.error)em=ed.error.message;}catch(e2){}
      onResult('error', em);
    }
  };
  xhr.onerror = function() { onResult('cors',''); };
  xhr.ontimeout = function() { onResult('error','요청 시간 초과'); };
  xhr.send(body);
}

/* ★수정: 영수증 다중 등록 + 일괄 파싱 시스템 (완전 재설계) */
function ReceiptIn(props) {
  var onAdd  = props.onAdd;
  var onBack = props.onBack;

  /*
   * items 배열 각 아이템 구조:
   * { id, imgSrc, mimeType, b64, status, store, amount, date, catId, subCat, member, err, editing }
   * status: 'registered' → 'analyzing' → 'parsed' → 'saved'  (또는 'error')
   */
  var items     = useState([]);    var setItems     = items[1];     items     = items[0];
  var analyzing = useState(false); var setAnalyzing = analyzing[1]; analyzing = analyzing[0];
  var progress  = useState(0);     var setProgress  = progress[1];  progress  = progress[0];

  var fileRef = useRef(null);
  var camRef  = useRef(null);

  var apiKey = lsGet(LS_GEMINI, '');

  /* ── 사진 등록 (파싱 없이 리스트에 추가만) ── */
  function handleFiles(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var fileArr = Array.from(files).slice(0, 10);

    fileArr.forEach(function(file) {
      var mime = file.type || 'image/jpeg';
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        var b64 = dataUrl.split(',')[1];
        var newItem = {
          id: Date.now() + Math.random(),
          imgSrc: dataUrl,
          mimeType: mime,
          b64: b64,
          status: 'registered',
          store: '',
          amount: '',
          date: new Date().toISOString().split('T')[0],
          catId: 'food',
          subCat: '',
          member: 'mom',
          err: '',
          editing: false
        };
        setItems(function(prev) { return prev.concat([newItem]); });
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  /* ── 개별 아이템 상태 업데이트 ── */
  function updateItem(id, changes) {
    setItems(function(prev) {
      return prev.map(function(item) {
        if (item.id === id) return Object.assign({}, item, changes);
        return item;
      });
    });
  }

  /* ── 아이템 삭제 ── */
  function removeItem(id) {
    setItems(function(prev) {
      return prev.filter(function(item) { return item.id !== id; });
    });
  }

  /* ── [분석 시작] 전체 순차 파싱 (화면 복구 및 속도 업그레이드 버전) ── */
function startAnalyzeAll() {
  if (!apiKey) { alert('설정에서 AI API 키를 먼저 등록해주세요!'); return; }

  var targets = items.filter(function(item) {
    return item.status === 'registered' || item.status === 'error';
  });

  if (targets.length === 0) { alert('분석할 사진이 없습니다.'); return; }

  setAnalyzing(true);
  setProgress(0);

  var idx = 0;

  // 마법의 async 단어가 여기 들어있어요!
  async function processNext() {
    if (idx >= targets.length) {
      setAnalyzing(false);
      return;
    }

    var target = targets[idx];
    
    // [1단계] 진짜 사진 파일을 찾아내는 줄 (속도의 핵심)
    if (!target.file && target.el && target.el.files) {
      target.file = target.el.files[0];
    }

    updateItem(target.id, { status: 'analyzing' });
    setProgress(idx + 1);

    // [2단계] 사진 압축하기 (실패해도 멈추지 않게 보험을 들었어요)
    let finalImage = target.b64; 
    try {
      if (target.file) {
        // 압축기(Canvas)를 돌려서 아주 가볍게 만들어요
        finalImage = await compressImage(target.file);
      }
    } catch (e) {
      console.log("압축 실패: 원래 사진으로 보낼게요.");
      finalImage = target.b64;
    }

    // [3단계] 로봇(AI)에게 전달하기
    callGeminiOCR(finalImage, target.mimeType, apiKey, function(err, result) {
      if (err) {
        updateItem(target.id, { status: 'error', err: err });
      } else {
        updateItem(target.id, {
          status: 'parsed',
          store: result.store_name || '',
          amount: result.amount ? String(result.amount) : '',
          catId: result.category || 'food',
          subCat: result.sub_category || '',
          date: (function() {
            // ★ 영수증 파싱 날짜 보정: 연도 없거나 과거 연도면 올해로 보정
            var parsedDate = result.date || '';
            if (parsedDate) {
              var pd = String(parsedDate).replace(/\//g, '-').replace(/\./g, '-');
              // 1) 월/일만 있을 때 (5-8, 05-08 등)
              if (pd.length <= 5) {
                var parts = pd.split('-');
                pd = new Date().getFullYear() + '-' + String(parts[0]).padStart(2, '0') + '-' + String(parts[1] || '01').padStart(2, '0');
              }
              // 2) 연도가 있지만 과거 연도일 때 (2023-05-08, 2024-05-08 등)
              if (pd.length === 10) {
                var pyear = parseInt(pd.split('-')[0]);
                var cyear = new Date().getFullYear();
                if (pyear < cyear) {
                  // 과거 연도 → 현재 연도로 교체
                  pd = cyear + pd.substring(4);
                }
              }
              return pd;
            }
            // 날짜 정보 없으면 오늘 날짜
            var today = new Date();
            return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
          })(),
          err: ''
        });
      }
      idx++;
      setTimeout(processNext, 500); // 다음 영수증 분석하러 가기!
    });
  }

  // 진짜로 시작하는 버튼!
  processNext();
}

  /* ── 개별 [등록] → 지출내역 저장 ── */
  function saveItem(item) {
    if (!item.amount || parseInt(item.amount) <= 0) {
      alert('금액을 입력해주세요.'); return;
    }
    saveLearnedCategory(item.store, item.catId, item.subCat);
    onAdd({
      id: Date.now(),
      type: 'expense',
      amount: parseInt(item.amount),
      catId: item.catId,
      subCat: item.subCat,
      store: item.store || '영수증',
      member: item.member,
      date: item.date,
      method: '카드',
      source: 'receipt'
    }, false);
    updateItem(item.id, { status: 'saved' });
  }

  /* ── 상태별 카운트 ── */
  var countReg   = items.filter(function(i){ return i.status==='registered'; }).length;
  var countDone  = items.filter(function(i){ return i.status==='parsed'; }).length;
  var countSaved = items.filter(function(i){ return i.status==='saved'; }).length;
  var countErr   = items.filter(function(i){ return i.status==='error'; }).length;
  var countAll   = items.length;

  /* ══════════════════════════════════════════ */
  /* ★★★ 화면 렌더링 ★★★                      */
  /* ══════════════════════════════════════════ */
  return h('div', {style:{padding:'0 16px 100px', overflowY:'auto', height:'100vh'}},
    h(Hdr, {title:'📷 영수증 AI 인식 (다중)', onBack:onBack}),

    /* ── API 키 미등록 경고 ── */
    !apiKey && h('div',{style:{background:C.gold+'15',border:'1px solid '+C.gold+'44',borderRadius:12,padding:'12px 14px',marginBottom:14}},
      h('p',{style:{color:C.gold,fontSize:12,fontWeight:700,margin:'0 0 6px'}},'💡 AI 자동 인식 활성화 방법'),
      h('p',{style:{color:C.muted,fontSize:12,margin:0,lineHeight:1.7}},'설정 탭 → [AI API 키 설정]에서 무료 API 키를 입력하면 영수증을 자동으로 인식합니다.')
    ),

    /* ── 숨겨진 파일 입력 ── */
    h('input', {ref:camRef, type:'file', accept:'image/*', capture:'environment', multiple:true, onChange:handleFiles, className:'hidden-file'}),
    h('input', {ref:fileRef, type:'file', accept:'image/*', multiple:true, onChange:handleFiles, className:'hidden-file'}),

    /* ══════════════════════════════════════════ */
    /* ── 사진이 없을 때: 초기 안내 화면 ──       */

      ];
      for(var ri = 0; ri < rules.length; ri++) {
        for(var ki = 0; ki < rules[ri].k.length; ki++) {
          if(st.indexOf(rules[ri].k[ki]) >= 0) {
            data.category = rules[ri].c;

        }

      }
      if(!matched && isMart) { data.category = 'food'; data.sub_category = '식자재'; }

  }
 
  /* ★수정됨: 캡처 원본의 거대한 용량으로 인한 404/402 에러를 막기 위해 압축 로직(async/await) 적용 */
  async function handleFile(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var mime = file.type || 'image/jpeg';
    var reader = new FileReader();
    reader.onload = async function(ev) {
      var dataUrl = ev.target.result;
      setImgSrc(dataUrl);
      setStep(2);
      setErrMsg('');

      var finalImage = dataUrl.split(',')[1];
      try {
        if (typeof compressImage === 'function') {
          finalImage = await compressImage(file);
        }
      } catch(err) {
        console.log("압축 우회 진행", err);

       // ★ 날짜 보정: 연도 없거나 과거 연도면 올해로 보정
        if(result.date) {
          var rd = String(result.date).replace(/\//g,'-').replace(/\./g,'-');
          // 1) 월/일만 있을 때 (5-8, 05-08 등)
          if(rd.length <= 5) {
            var dp = rd.split('-');
            rd = new Date().getFullYear() + '-' + String(dp[0]).padStart(2,'0') + '-' + String(dp[1]||'01').padStart(2,'0');
          }
          // 2) 연도가 있지만 과거 연도일 때 (2023-05-08, 2024-05-08 등)
          if(rd.length === 10) {
            var ry = parseInt(rd.split('-')[0]);
            var cy = new Date().getFullYear();
            if(ry < cy) {

              rd = cy + rd.substring(4);
            }
          }
          setEditDate(rd);

        setStep(3);

function FamilyGoalManager(props) {

  var setGoals = goals[1]; goals = goals[0];

 // ★수정: [여가비] 카테고리 입력액만 합산 (생활비와 완전 분리), 출금 시 차감 완벽 반영

  var pct = goals.target > 0 ? Math.min((currentSavings / goals.target) * 100, 100) : 0;

  var barBg;
  if (pct >= 80) barBg = 'linear-gradient(90deg, #FF8C00, #FFD700)';
  else if (pct >= 50) barBg = 'linear-gradient(90deg, #F5F5DC, #E1C699)';
  else barBg = 'linear-gradient(90deg, #5C4033, #3E2723)';

  var barAnim = pct >= 80 ? 'sparkleOrange 1s infinite alternate' : 'none';
  var barShadow = 'inset 0 2px 5px rgba(255,255,255,0.4), inset 0 -2px 5px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3)';

  useEffect(function() {
    if (pct >= 100 && !goals.isCompleted) {
      setShowFirework(true);
      setGoals(Object.assign({}, goals, { isCompleted: true }));
      lsSet(LS_GOALS, Object.assign({}, goals, { isCompleted: true }));

      }
      setTimeout(function(){ setShowFirework(false); }, 4000);
    }
  }, [pct, goals]);

  function saveGoal() {
    var newGoal = { title: editTitle, target: parseInt(editTarget)||0, isCompleted: false };

        h('div', {style:{width: pct+'%', height:'100%', background: barBg, borderRadius:10, boxShadow: barShadow, transition:'width 1s ease-in-out', animation: barAnim}})

  );

  var alarms = [
    {key:'newTx',   label:'새 지출 입력 알림',   desc:'가족이 지출을 입력하면 즉시 알림'},

  // ★ 알림 권한 요청 함수
  function requestPermission(callback) {
    if(!('Notification' in window)) {
      alert('이 브라우저는 알림을 지원하지 않습니다.');
      return;
    }
    if(Notification.permission === 'granted') {
      if(callback) callback();

    Notification.requestPermission().then(function(perm) {
      setPermStatus(perm);
      if(perm === 'granted') {
        if(callback) callback();

        alert('⚠️ 알림 권한이 거부되었습니다.\n\n스마트폰: 설정 → 앱 → 브라우저 → 알림 허용\nPC: 브라우저 주소창 옆 🔒 아이콘 → 알림 허용');
      }
    });
  }

  // ★ 테스트 알림 발송
  function sendTestNotification() {
    requestPermission(function() {
      try {
        sendNotif('🔔 알림 테스트 성공!', 'FamilyLedger 알림이 정상 작동합니다 ✅\n지출 입력 시 이런 알림이 울려요!', 'test-' + Date.now());

// ★★★ [신규] 신용카드 결제 내역 전용 시트 ★★★
function CreditCardDetailSheet(props) {
  var allTxs     = props.txs || [];
  var billingDay = props.billingDay || 12;
  var baseDate   = props.baseDate || new Date();
  var totI       = props.totI || 0;
  var onClose    = props.onClose;
  var onUpdate   = props.onUpdate || function(){};
  var onDelete   = props.onDelete || function(){};

  // ── 모든 상태 먼저 선언 ──
  var smArr   = useState('all'); var setSelMem = smArr[1];      var selMem = smArr[0];
  var ocArr   = useState({});    var setOpenCats = ocArr[1];    var openCats = ocArr[0];
  var etArr   = useState(null);  var setEditTx = etArr[1];      var editTx = etArr[0];
  var cmfArr  = useState({});    var setCatMemFilter = cmfArr[1]; var catMemFilter = cmfArr[0];
  var smArr2  = useState(false); var setSheetModal = smArr2[1]; var sheetModal = smArr2[0];
  /* ★ 수정: 모달 열 때 로컬 스토리지에 저장된 날짜를 불러옴 */
  var cfArr   = useState(lsGet('flai_card_custom_start', ''));    var setCustomFrom = cfArr[1];  var customFrom = cfArr[0];
  var ctArr   = useState(lsGet('flai_card_custom_end', ''));    var setCustomTo   = ctArr[1];  var customTo   = ctArr[0];
  var clArr   = useState(lsGet(LS_CREDIT_LIMIT, 0)); var setCreditLimit = clArr[1]; var creditLimit = clArr[0];
  var liArr   = useState('');    var setLimitInput = liArr[1];  var limitInput = liArr[0];

  // ── 유효 날짜 계산 ──
  var period   = getCardBillingPeriod(billingDay, baseDate);
  var effStart = customFrom ? new Date(customFrom+'T00:00:00') : period.start;
  var effEnd   = customTo   ? new Date(customTo+'T23:59:59')   : period.end;
  var sDate    = new Date(effStart.getFullYear(), effStart.getMonth(), effStart.getDate(), 0, 0, 0);
  var eDate    = new Date(effEnd.getFullYear(),   effEnd.getMonth(),   effEnd.getDate(),   23, 59, 59);
  var startStr = fmtBillingDate(effStart);
  var endStr   = fmtBillingDate(effEnd);

  // ── 신용카드 필터링 ──
  var creditTxs = allTxs.filter(function(tx) {
    if (tx.type !== 'expense') return false;
    if (tx.catId === 'invest' || tx.catId === 'travel_fund') return false;
    if (!isCredit(tx.method)) return false;
    var dp = (tx.date || '').split('-');
    if (dp.length < 3) return false;
    var d = new Date(parseInt(dp[0]), parseInt(dp[1])-1, parseInt(dp[2]), 12, 0, 0);
    return d >= sDate && d <= eDate;
  });

  /* ★ 수정: 설정된 날짜 기간에 맞는 총 수입(totI)을 별도로 산출하여 수입대비 %를 구함 */
  var periodIncTxs = allTxs.filter(function(tx) {
    if (tx.type !== 'income') return false;
    var dp = (tx.date || '').split('-');
    if (dp.length < 3) return false;
    var d = new Date(parseInt(dp[0]), parseInt(dp[1])-1, parseInt(dp[2]), 12, 0, 0);
    return d >= sDate && d <= eDate;
  });
  var periodTotI = periodIncTxs.reduce(function(s,t){ return s+t.amount; }, 0);

  var totalCredit = creditTxs.reduce(function(s,t){ return s+t.amount; }, 0);
  var incRatio    = periodTotI > 0 ? Math.round(totalCredit/periodTotI*100) : 0;
  var incColor    = incRatio>80?'#FF2266':incRatio>50?'#FF9E45':'#00CFFF';
  var limitRatio  = creditLimit>0 ? Math.min(totalCredit/creditLimit*100, 100) : 0;

  var filteredTxs = selMem==='all' ? creditTxs : creditTxs.filter(function(t){return t.member===selMem;});

  var grouped = EX_CATS.map(function(cat){
    var items = filteredTxs.filter(function(t){return t.catId===cat.id;});
    var total = items.reduce(function(s,t){return s+t.amount;},0);
    return {cat:cat, items:items.sort(function(a,b){return new Date(b.date)-new Date(a.date);}), total:total};
  }).filter(function(g){return g.items.length>0;}).sort(function(a,b){return b.total-a.total;});

function CardDetailSheet(props) {
  var txs           = props.txs || [];

  var billingPeriod = props.billingPeriod || {};

  var selMember = useState('all'); var setSelMember = selMember[1]; selMember = selMember[0];
  var openCats  = useState({});   var setOpenCats  = openCats[1];  openCats  = openCats[0];

  // 구성원 필터 적용
  var filteredTxs = selMember === 'all'
    ? txs
    : txs.filter(function(tx){ return tx.member === selMember; });

  // 카테고리별 그룹화
  var grouped = EX_CATS.map(function(cat){
    var items = filteredTxs.filter(function(t){ return t.catId === cat.id; });
    var total = items.reduce(function(s,t){ return s+t.amount; }, 0);
    return { cat:cat, items:items.sort(function(a,b){ return new Date(b.date)-new Date(a.date); }), total:total };
  }).filter(function(g){ return g.items.length > 0; }).sort(function(a,b){ return b.total-a.total; });

  var grandTotal = filteredTxs.reduce(function(s,t){ return s+t.amount; }, 0);
  var allOpen    = grouped.length > 0 && grouped.every(function(g){ return openCats[g.cat.id]; });

    setOpenCats(function(prev){

      n[catId] = !n[catId];
      return n;
    });

  var aefArr = useState(lsGet('flai_anl_ef','')); var setAnlExpFrom = aefArr[1]; var anlExpFrom = aefArr[0];
  var aetArr = useState(lsGet('flai_anl_et','')); var setAnlExpTo   = aetArr[1]; var anlExpTo   = aetArr[0];
  var aifArr = useState(lsGet('flai_anl_if','')); var setAnlIncFrom = aifArr[1]; var anlIncFrom = aifArr[0];
  var aitArr = useState(lsGet('flai_anl_it','')); var setAnlIncTo   = aitArr[1]; var anlIncTo   = aitArr[0];
  
  var ftx = useMemo(function(){ return fDash(txs, dp, baseDate, startDay); }, [txs, dp, baseDate, startDay]);
  var exp = ftx.filter(function(t){ return t.type==='expense' && t.catId!=='invest' && t.catId!=='travel_fund'; });
  
  /* ★ 문제 발생 지점(inc) 정상 복구 완료 */
  var inc = ftx.filter(function(t){ return t.type==='income'; });
  var totE = exp.reduce(function(s,t){ return s+t.amount; }, 0);
  
  var totI = useMemo(function(){
    var now = new Date();
    var sd = startDay || 1;
    // 가계부 기준 현재 달의 시작일/종료일 계산 (fDash 로직과의 동기화)
    var curFin = getFinMonth(now.toISOString(), sd);
    
    var monthlyIncTxs = txs.filter(function(t){
      if(t.type !== 'income') return false;
      var f = getFinMonth(t.date, sd);
      return f.y === curFin.y && f.m === curFin.m;

    var monthlyTotI = monthlyIncTxs.reduce(function(s,t){ return s+t.amount; }, 0);

    if(period === '주간') {
      var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
      return txs.filter(function(t){ return t.type==='income' && new Date(t.date) >= weekAgo; })
                .reduce(function(s,t){ return s+t.amount; }, 0);
    } else if(period === '연간') {
      return inc.reduce(function(s,t){ return s+t.amount; }, 0);
    } else {
      return monthlyTotI;
    }
  }, [txs, period, inc, startDay]);
 
  var ALL_ANALYSIS_CATS = [{id:'all', name:'전체', icon:'📊', color:'#3D5AFE'}].concat(EX_CATS);
  function getCatTotal(catId) {
    if(catId === 'all') return totE;
    return exp.filter(function(t){ return t.catId===catId; }).reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemCatTotal(catId, memberId) {
    var filtered = exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);

    return filtered.reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemTxs(catId, memberId) {

      return t.member===memberId && (catId==='all' || t.catId===catId);

      paths.push(h('circle',{key:s.color+offset,cx:cx,cy:cy,r:R,fill:'none',stroke:s.color,strokeWidth:sw,
        strokeDasharray:String(dash.toFixed(1))+' '+String(gap.toFixed(1)),

  var selCatObj = selCat ? ALL_ANALYSIS_CATS.find(function(c){ return c.id===selCat; }) : null;
  var selCatTotal = selCat ? getCatTotal(selCat) : 0;

  // 홈의 월 선택창 정보를 제목에 표시하기 위한 함수
  function getAnalysisDateLabel() { 
    if (dp === '이번달') return baseDate.getFullYear() + '년 ' + (baseDate.getMonth() + 1) + '월';

function AuthScreen(props) {
  var onLogin = props.onLogin;
  var mode   = useState('login'); var setMode   = mode[1];   mode   = mode[0];
  var loginId = useState('');     var setLoginId = loginId[1]; loginId = loginId[0];
  var loginPw = useState('');     var setLoginPw = loginPw[1]; loginPw = loginPw[0];
  var sName   = useState('');     var setSName   = sName[1];   sName   = sName[0];
  var sId     = useState('');     var setSId     = sId[1];     sId     = sId[0];
  var sPw     = useState('');     var setsPw     = sPw[1];     sPw     = sPw[0];
  var errs    = useState({});     var setErrs    = errs[1];    errs    = errs[0];

  function doLogin() {
    var users = lsGet(LS_USERS, []);
    var found = users.find(function(u){ return u.userId === loginId.trim(); });
    if (!found || found.pw !== loginPw) return alert('정보가 올바르지 않습니다.');
    onLogin({userId: found.userId, name: found.name});
  }

  function doSignup() {
    var users = lsGet(LS_USERS, []);
    if (users.some(function(u){return u.userId===sId.trim();})) return alert('중복 아이디');
    var newUser = {userId: sId.trim(), name: sName.trim(), pw: sPw};
    users.push(newUser); lsSet(LS_USERS, users);
    onLogin({userId: newUser.userId, name: newUser.name});
  }

  return h('div', {style:{minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', padding:'20px 24px', background:C.bg}},
    h('div', {style:{textAlign:'center', marginBottom:28}}, h('p', {style:{fontSize:52}}, '👨‍👩‍👧'), h('p', {style:{color:C.text, fontSize:22, fontWeight:900}}, 'FamilyLedger AI')),
    mode==='login' ? h('div', null,
      h('input', {value:loginId, onChange:function(e){setLoginId(e.target.value);}, placeholder:'아이디', style:{width:'100%',padding:14,borderRadius:10,background:C.card2,border:'1px solid '+C.border,color:C.text,marginBottom:10}}),
      h('input', {value:loginPw, onChange:function(e){setLoginPw(e.target.value);}, type:'password', placeholder:'비밀번호', style:{width:'100%',padding:14,borderRadius:10,background:C.card2,border:'1px solid '+C.border,color:C.text,marginBottom:20}}),
      h('button', {onClick:doLogin, style:{width:'100%', padding:15, borderRadius:12, border:'none', background:C.accent, color:'#fff', fontWeight:800}}, '로그인'),
      h('p', {onClick:function(){setMode('signup');}, style:{textAlign:'center',marginTop:20,color:C.muted,fontSize:13}}, '처음이신가요? 회원가입')

/* ★ 엑셀/CSV 카드명세 대량 업로드 + AI 자동분류 */

  var apiKey  = lsGet(LS_GEMINI, '');
 
  /* ── 강제 보정 (문자파싱과 동일) ── */
  function forceCorrect(storeName, amount) {

    var rules = [

      {k:['병원','의원','클리닉','치과','피부과','한의원','내과','안과'], c:'health', s:'병원'},
      {k:['약국'], c:'health', s:'약'},
      {k:['학원','과외'], c:'edu', s:'학원'},
      {k:['서점','교보문고','알라딘'], c:'edu', s:'서적'},
      {k:['올리브영','다이소','화장품'], c:'daily', s:'위생&케어용품'},
      {k:['세제','청소'], c:'daily', s:'세제&청소용품'},
      {k:['가전','하이마트'], c:'daily', s:'가전&가구'},
      {k:['관리비','전기','수도','가스','한전'], c:'util', s:''},
      {k:['축의금','결혼식'], c:'event', s:'결혼'},
      {k:['장례','부의금','상조'], c:'event', s:'장례'},
      {k:['대출','이자','상환'], c:'finance', s:'대출이자'},
      {k:['호텔','펜션','리조트','숙소'], c:'leisure', s:'여행'},
      {k:['정비','카센터','타이어','세차'], c:'other', s:'정비&수리'}
    ];
    for(var ri=0; ri<rules.length; ri++) {
      for(var ki=0; ki<rules[ri].k.length; ki++) {
        if(st.indexOf(rules[ri].k[ki]) >= 0) return {c:rules[ri].c, s:rules[ri].s};
      }
    }
    if(isMart) return {c:'food',s:'식자재'};
    if(isCVS)  return {c:'other',s:'편의점'};
 
    /* 학습 데이터 참조 */
    var learned = getLearnedCategory(storeName);
    if(learned) return {c:learned.catId, s:learned.subCat};
 
    return {c:'other',s:''};
  }
 
 /* ── CSV/엑셀 파일 읽기 ── */
  function handleFile(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    setErrMsg('');
    var ext = file.name.split('.').pop().toLowerCase();
    setUploadFileName(file.name);
    if(ext === 'csv' || ext === 'txt') {
      /* CSV 파싱 */
      if(typeof Papa === 'undefined') {
        setErrMsg('CSV 파서가 로딩되지 않았습니다.');
        return;
      }
      Papa.parse(file, {
        header: true,
        encoding: 'UTF-8',
        skipEmptyLines: true,
        complete: function(result) {
          processData(result.data);
        },
        error: function(err) {
          setErrMsg('CSV 읽기 실패: ' + err.message);
        }
      });
    } else if(ext === 'xlsx' || ext === 'xlsm' || ext === 'xls') {
      /* ★ 엑셀 파싱 (SheetJS) */
      if(typeof XLSX === 'undefined') {
        setErrMsg('엑셀 파서가 로딩되지 않았습니다. 페이지를 새로고침 해주세요.');
        return;
      }
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = new Uint8Array(ev.target.result);
          var workbook = XLSX.read(data, {type:'array'});
          var sheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[sheetName];
          var rawRows = XLSX.utils.sheet_to_json(worksheet, {header:1, defval:''});

          /* ★ 신한카드 명세서 자동 감지 및 파싱 */
          var parsed = [];
          var isShinhan = rawRows.some(function(r){ return String(r[0]||'').indexOf('총합계') >= 0 || String(r[1]||'') === '본인'; });

          if(isShinhan) {
            /* 신한카드 포맷: A=일자, B=본인, C=가맹점, D=이용금액, F=내실금액 */
            for(var ri = 0; ri < rawRows.length; ri++) {
              var row = rawRows[ri];
              var cellA = String(row[0] || '').trim();
              var cellB = String(row[1] || '').trim();
              var cellC = String(row[2] || '').trim();
              var cellD = row[3]; /* 이용금액 */
              var cellF = row[5]; /* 내실금액 */

              /* 유효 데이터 행: B열이 '본인'이고 C열(가맹점)이 있는 행 */
              if(cellB !== '본인' || !cellC) continue;
              /* 합계/소계 행 스킵 */
              if(cellC.indexOf('합계') >= 0 || cellC.indexOf('소계') >= 0) continue;

              /* 날짜 변환: 26.03.13 → 2026-03-13 / 25.05.11 → 2025-05-11 */
              var dateStr = '';
              var dm = cellA.match(/^(\d{2})\.(\d{2})\.(\d{2})$/);
              if(dm) {
                var yr = parseInt(dm[1]);
                dateStr = (yr < 50 ? '20' : '19') + dm[1] + '-' + dm[2] + '-' + dm[3];
              } else {
                dateStr = new Date().toISOString().split('T')[0];
              }

              /* 금액: D열(이용금액) 우선, 없으면 F열(내실금액) */
              var rawAmt = cellD ? String(cellD) : String(cellF || '0');
              var amount = Math.abs(parseInt(String(rawAmt).replace(/[^0-9-]/g,'')) || 0);
              if(amount <= 0) {
                /* D열도 F열도 없으면 스킵 */
                var fallback = Math.abs(parseInt(String(cellF || '0').replace(/[^0-9-]/g,'')) || 0);
                if(fallback > 0) amount = fallback; else continue;
              }

              parsed.push({
                store: cellC,
                amount: amount,
                date: dateStr,
                method: '신한카드'
              });
            }
          } else {
            /* 일반 엑셀: 첫 번째 행을 헤더로 사용 */
            if(rawRows.length < 2) { setErrMsg('데이터가 비어있습니다.'); return; }
            var headers = rawRows[0].map(function(h){ return String(h||'').trim(); });
            var storeIdx = headers.findIndex(function(h){ return h.indexOf('가맹점')>=0||h.indexOf('상호')>=0||h.indexOf('이용처')>=0||h.indexOf('매장')>=0; });
            var amtIdx = headers.findIndex(function(h){ return h.indexOf('금액')>=0||h.indexOf('결제')>=0||h.indexOf('이용금액')>=0; });
            var dateIdx = headers.findIndex(function(h){ return h.indexOf('날짜')>=0||h.indexOf('일자')>=0||h.indexOf('일시')>=0; });
            if(storeIdx < 0) storeIdx = 0;
            if(amtIdx < 0) amtIdx = 1;
            if(dateIdx < 0) dateIdx = 2;

            for(var gi = 1; gi < rawRows.length; gi++) {
              var grow = rawRows[gi];
              var gStore = String(grow[storeIdx] || '').trim();
              var gAmt = Math.abs(parseInt(String(grow[amtIdx] || '0').replace(/[^0-9-]/g,'')) || 0);
              var gDate = String(grow[dateIdx] || '').trim().replace(/\./g,'-').replace(/\//g,'-');
              if(gDate.length === 8) gDate = gDate.slice(0,4)+'-'+gDate.slice(4,6)+'-'+gDate.slice(6,8);
              if(!gDate || gDate.length < 10) gDate = new Date().toISOString().split('T')[0];
              if(gAmt > 0 && gStore) {
                parsed.push({ store: gStore, amount: gAmt, date: gDate, method: '카드' });
              }
            }
          }

          if(parsed.length === 0) {
            setErrMsg('유효한 거래 데이터를 찾지 못했습니다.\n엑셀 파일 형식을 확인해주세요.');
            return;
          }

          /* forceCorrect 적용 후 rows 상태에 세팅 */
          var finalRows = parsed.map(function(p, idx) {
            var result = forceCorrect(p.store, p.amount);
            return {
              id: Date.now() + idx,
              store: p.store,
              amount: p.amount,
              date: p.date,
              method: p.method,
              catId: result.c,
              subCat: result.s,
              selected: true,
              saved: false
            };
          });
          setRows(finalRows);
          setStatus('preview');
        } catch(ex) {
          setErrMsg('엑셀 파일 읽기 실패: ' + ex.message);
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      setErrMsg('지원 형식: .csv, .xlsx, .xlsm\n카드사 앱에서 다운로드한 파일을 업로드하세요.');
    }
    e.target.value = '';
  }
 
  /* ── 데이터 처리 + 자동 분류 ── */
  function processData(data) {
    if(!data || data.length === 0) { setErrMsg('데이터가 비어있습니다.'); return; }
    var cols = Object.keys(data[0]);
    var storeCol = cols.find(function(c){return c.indexOf('가맹점')>=0||c.indexOf('상호')>=0||c.indexOf('이용처')>=0||c.indexOf('매장')>=0;}) || cols[0];
    var amtCol = cols.find(function(c){return c.indexOf('금액')>=0||c.indexOf('결제')>=0||c.indexOf('이용금액')>=0;}) || cols[1];
    var dateCol = cols.find(function(c){return c.indexOf('날짜')>=0||c.indexOf('일자')>=0||c.indexOf('일시')>=0||c.indexOf('거래')>=0;}) || cols[2];
    var methodCol = cols.find(function(c){return c.indexOf('카드')>=0||c.indexOf('결제수단')>=0;});
 
    var parsed = data.map(function(row, idx) {
      var store = (row[storeCol] || '').trim();
      var rawAmt = (row[amtCol] || '0').replace(/[^0-9-]/g, '');
      var amount = Math.abs(parseInt(rawAmt) || 0);
      var date = (row[dateCol] || '').trim();
      if(date.length >= 8) {
        date = date.replace(/\./g, '-').replace(/\//g, '-');
        if(date.length === 8) date = date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8);
      }
      if(!date || date.length < 10) date = new Date().toISOString().split('T')[0];
      var method = methodCol ? (row[methodCol] || '카드').trim() : '카드';
      var result = forceCorrect(store, amount);
 
      return {
        id: Date.now() + idx,
        store: store,
        amount: amount,
        date: date,
        method: method,
        catId: result.c,
        subCat: result.s,
        selected: amount > 0,
        saved: false
      };
    }).filter(function(r) { return r.amount > 0 && r.store; });
 
    setRows(parsed);
    setStatus('preview');
  }
 
  /* ── 선택된 항목 일괄 저장 ── */
  function saveAll() {
    var targets = rows.filter(function(r){ return r.selected && !r.saved; });
    if(targets.length === 0) return alert('저장할 항목이 없습니다.');
    setStatus('saving');
    var saved = 0;
    targets.forEach(function(r, idx) {
      setTimeout(function() {
        saveLearnedCategory(r.store, r.catId, r.subCat);
        onAdd({
          id: Date.now() + idx,
          type: 'expense',
          amount: r.amount,
          catId: r.catId,
          subCat: r.subCat,
          store: r.store,
          member: 'dad',
          date: r.date,
          method: r.method,
          source: 'bulk'
        }, false);
        saved++;
        setProgress(Math.round(saved / targets.length * 100));
        if(saved === targets.length) {
          var updatedRows = rows.map(function(row){ return row.selected ? Object.assign({},row,{saved:true}) : row; });
          setRows(updatedRows);
          setStatus('done');
          /* ★ 보관함에 자동 기록 */
          var archive = lsGet(LS_CARD_ARCHIVE, []);
          var cardName = '카드';
          if(uploadFileName.indexOf('신한') >= 0) cardName = '신한카드';
          else if(uploadFileName.indexOf('국민') >= 0 || uploadFileName.indexOf('KB') >= 0) cardName = 'KB국민카드';
          else if(uploadFileName.indexOf('하나') >= 0) cardName = '하나카드';
          else if(uploadFileName.indexOf('우리') >= 0) cardName = '우리카드';
          else if(uploadFileName.indexOf('현대') >= 0) cardName = '현대카드';
          else if(uploadFileName.indexOf('삼성') >= 0) cardName = '삼성카드';
          else if(uploadFileName.indexOf('롯데') >= 0) cardName = '롯데카드';
          else if(uploadFileName.indexOf('NH') >= 0 || uploadFileName.indexOf('농협') >= 0) cardName = 'NH농협카드';
          archive.unshift({
            id: Date.now(),
            uploadDate: new Date().toISOString().split('T')[0],
            cardName: cardName,
            fileName: uploadFileName,
            totalCount: rows.length,
            savedCount: targets.length,
            skippedCount: rows.length - targets.length,
            items: updatedRows.map(function(r){ return {store:r.store, amount:r.amount, date:r.date, catId:r.catId, subCat:r.subCat, method:r.method, saved:r.saved}; })
          });
          lsSet(LS_CARD_ARCHIVE, archive);
        }
      }, idx * 100);
    });
  }
 
  /* ── 개별 행 수정 ── */
  function updateRow(id, changes) {
    setRows(rows.map(function(r){ return r.id===id ? Object.assign({},r,changes) : r; }));
  }
 
  var selCount = rows.filter(function(r){return r.selected && !r.saved;}).length;
  var savedCount = rows.filter(function(r){return r.saved;}).length;
 
  return h('div',{style:{padding:'0 16px 100px',overflowY:'auto',height:'100vh'}},
    h(Hdr,{title:'📊 엑셀/CSV 대량 업로드',onBack:onBack}),
    h('input',{ref:fileRef,type:'file',accept:'.csv,.txt,.xlsx,.xlsm,.xls',onChange:handleFile,className:'hidden-file'}),
 
    /* 초기 화면 */
    status === 'idle' && h('div',null,
      h(GCard,{style:{marginBottom:14,border:'1px solid #A29BFE44',background:'#A29BFE08'}},
        h('p',{style:{color:'#A29BFE',fontSize:13,fontWeight:700,margin:'0 0 8px'}},'📋 사용 방법'),
        h('p',{style:{color:C.muted,fontSize:12,margin:0,lineHeight:1.8}},
          '① 카드사 앱/홈페이지에서 이용내역 다운로드 (CSV)\n② 아래 버튼으로 CSV 파일 업로드\n③ AI가 자동으로 카테고리 분류\n④ 확인 후 일괄 저장')

function VoiceIn(props) {
  var apiKey = lsGet(LS_GEMINI, '');
  var isRecording = useState(false); var setIsRecording = isRecording[1]; isRecording = isRecording[0];
  var transcript = useState('');     var setTranscript = transcript[1]; transcript = transcript[0];
  function startVoice() {
    if(!apiKey) return alert('API 키 필요');
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert('지원불가 브라우저');
    var rec = new SpeechRecognition(); rec.lang = 'ko-KR'; rec.start(); setIsRecording(true);
    rec.onresult = function(e) {
      var speech = e.results[0][0].transcript; setTranscript(speech); setIsRecording(false);
      var prompt = "JSON출력: '" + speech + "' 형식: {\"store_name\":\"상호\",\"amount\":금액,\"type\":\"expense\",\"category\":\"food\"}";
      callGeminiText(prompt, apiKey, function(err, res) {
        if(err) return;
        try {
          var data = JSON.parse(res.replace(/```json\n?|```/g,'').trim());
          props.onAdd({ id: Date.now(), type: data.type||'expense', amount: data.amount, catId: data.category||'other', store: data.store_name, member: 'dad', date: new Date().toISOString().split('T')[0], method: '현금', source: 'voice' }, false);
          alert('저장완료'); props.onBack();
        } catch(ex){}
      });
    };
  }
  return h('div', {style:{padding:'0 16px 90px'}}, h(Hdr, {title:'🎙️ AI 음성 인식', onBack:props.onBack}), h('div', {style:{textAlign:'center', marginTop:40}}, h('div', {onClick: startVoice, style:{ width:120, height:120, borderRadius:'50%', background: isRecording ? C.red : C.accent, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto', boxShadow: isRecording ? '0 0 20px '+C.red : '0 10px 20px '+C.accent+'44', cursor:'pointer' }}, h('span', {style:{fontSize:50}}, isRecording ? '🛑' : '🎤')), h('p', {style:{marginTop:30, color:C.text}}, transcript || '말씀해 주세요') ));
}

/* ★ 카드명세 보관함 모달 */
function CardArchiveModal(props) {
  var onClose = props.onClose;
  var onReAdd = props.onReAdd;
  var archives = useState(function(){ return lsGet(LS_CARD_ARCHIVE, []); });
  var setArchives = archives[1]; archives = archives[0];
  var detailId = useState(null); var setDetailId = detailId[1]; detailId = detailId[0];
  var selItems = useState({}); var setSelItems = selItems[1]; selItems = selItems[0];

  function deleteArchive(id) {
    if(!confirm('이 업로드 기록을 삭제할까요?')) return;
    var updated = archives.filter(function(a){ return a.id !== id; });
    setArchives(updated);
    lsSet(LS_CARD_ARCHIVE, updated);
    if(detailId === id) setDetailId(null);
  }

  function reAddSelected(arc) {
    var keys = Object.keys(selItems).filter(function(k){ return selItems[k]; });
    if(keys.length === 0) return alert('등록할 항목을 선택하세요.');
    var unsaved = arc.items.filter(function(item, idx){ return !item.saved && selItems[idx]; });
    unsaved.forEach(function(item, i) {
      setTimeout(function() {
        onReAdd({
          id: Date.now() + i,
          type: 'expense',
          amount: item.amount,
          catId: item.catId,
          subCat: item.subCat || '',
          store: item.store,
          member: 'dad',
          date: item.date,
          method: item.method || '카드',
          source: 'bulk'
        }, false);
      }, i * 100);
    });
    /* 보관함에서 해당 항목 saved 처리 */
    var updatedArchives = archives.map(function(a) {
      if(a.id !== arc.id) return a;
      var newItems = a.items.map(function(item, idx) {
        if(selItems[idx]) return Object.assign({}, item, {saved: true});
        return item;
      });
      return Object.assign({}, a, {
        items: newItems,
        savedCount: newItems.filter(function(it){ return it.saved; }).length,
        skippedCount: newItems.filter(function(it){ return !it.saved; }).length
      });
    });
    setArchives(updatedArchives);
    lsSet(LS_CARD_ARCHIVE, updatedArchives);
    setSelItems({});
    alert(unsaved.length + '건이 내역에 추가되었습니다.');
  }

  var detail = detailId ? archives.find(function(a){ return a.id === detailId; }) : null;

  return h(Sheet, {title:'📂 카드명세 보관함', onClose:onClose},
    !detail ? h('div', null,
      archives.length === 0
        ? h('div', {style:{textAlign:'center', padding:'30px 0'}},
            h('span', {style:{fontSize:48}}, '📂'),
            h('p', {style:{color:C.muted, fontSize:13, margin:'12px 0'}}, '업로드된 카드 명세가 없습니다.'),
            h('p', {style:{color:C.faint, fontSize:11}}, '엑셀/CSV 업로드 후 자동으로 기록됩니다.')
          )
        : archives.map(function(arc) {
            var unsavedCount = arc.items ? arc.items.filter(function(it){ return !it.saved; }).length : 0;
            return h(GCard, {key:arc.id, style:{marginBottom:10, border:'1px solid '+C.border, cursor:'pointer'}},
              h('div', {onClick:function(){ setDetailId(arc.id); setSelItems({}); }, style:{display:'flex', alignItems:'center', gap:10}},
                h('div', {style:{width:40, height:40, borderRadius:10, background:C.accent+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0}}, '💳'),
                h('div', {style:{flex:1, minWidth:0}},
                  h('p', {style:{color:C.text, fontSize:13, fontWeight:700, margin:'0 0 2px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}, arc.cardName + ' — ' + arc.fileName),
                  h('p', {style:{color:C.muted, fontSize:10, margin:0}}, arc.uploadDate + ' 업로드')
                ),
                h('div', {style:{textAlign:'right', flexShrink:0}},
                  h('p', {style:{color:C.green, fontSize:12, fontWeight:700, margin:'0 0 2px'}}, '등록 ' + arc.savedCount + '건'),
                  unsavedCount > 0 && h('p', {style:{color:C.red, fontSize:10, margin:0}}, '미등록 ' + unsavedCount + '건')
                )
              ),
              h('div', {style:{display:'flex', justifyContent:'flex-end', marginTop:8, gap:6}},
                h('button', {onClick:function(e){ e.stopPropagation(); deleteArchive(arc.id); }, style:{padding:'4px 10px', borderRadius:6, border:'none', background:C.red+'22', color:C.red, fontSize:10, fontWeight:700, cursor:'pointer'}}, '🗑️ 삭제')
              )
            );
          })
    )
    : h('div', null,
        h('div', {style:{display:'flex', alignItems:'center', gap:8, marginBottom:14}},
          h('button', {onClick:function(){ setDetailId(null); setSelItems({}); }, style:{background:'none', border:'none', fontSize:18, color:C.muted, cursor:'pointer'}}, '←'),
          h('div', {style:{flex:1}},
            h('p', {style:{color:C.text, fontSize:14, fontWeight:700, margin:0}}, detail.cardName),
            h('p', {style:{color:C.muted, fontSize:11, margin:'2px 0 0'}}, detail.fileName + ' · ' + detail.uploadDate)
          )
        ),
        h('div', {style:{display:'flex', gap:6, marginBottom:10}},
          h(Bdg, {text:'전체 '+detail.totalCount+'건', color:C.accent}),
          h(Bdg, {text:'등록 '+detail.savedCount+'건', color:C.green}),
          detail.skippedCount > 0 && h(Bdg, {text:'미등록 '+detail.skippedCount+'건', color:C.red})
        ),
        h('div', {style:{maxHeight:400, overflowY:'auto'}},
          (detail.items || []).map(function(item, idx) {
            var cat = getCat(item.catId);
            var isUnsaved = !item.saved;
            var isSel = !!selItems[idx];
            return h('div', {key:idx, style:{display:'flex', alignItems:'center', gap:8, padding:'8px 0', borderBottom:'1px solid '+C.faint, opacity:item.saved?0.5:1}},
              isUnsaved && h('div', {
                onClick:function(){ var s = Object.assign({}, selItems); if(s[idx]) delete s[idx]; else s[idx]=true; setSelItems(s); },
                style:{width:20, height:20, borderRadius:4, flexShrink:0, cursor:'pointer',
                  background:isSel?C.accent:C.faint, border:'2px solid '+(isSel?C.accent:C.border),
                  display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontSize:10, fontWeight:700}
              }, isSel?'✓':''),
              item.saved && h('span', {style:{fontSize:12, flexShrink:0}}, '💾'),
              h('div', {style:{flex:1, minWidth:0}},
                h('p', {style:{color:C.text, fontSize:12, fontWeight:600, margin:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}, item.store),
                h('p', {style:{color:C.muted, fontSize:10, margin:'2px 0 0'}}, item.date)
              ),
              h('p', {style:{color:C.red, fontSize:12, fontWeight:800, margin:0, flexShrink:0}}, fmt(item.amount)),
              h('span', {style:{background:cat.color+'22', color:cat.color, fontSize:9, padding:'2px 6px', borderRadius:10, flexShrink:0}}, cat.icon+cat.name)
            );
          })
        ),
        detail.skippedCount > 0 && h('button', {
          onClick:function(){ reAddSelected(detail); },
          disabled:Object.keys(selItems).filter(function(k){return selItems[k];}).length === 0,
          style:{width:'100%', marginTop:12, padding:14, borderRadius:12, border:'none', cursor:'pointer',
            background:Object.keys(selItems).filter(function(k){return selItems[k];}).length > 0 ? 'linear-gradient(135deg,'+C.accent+',#536DFE)' : C.faint,
            color:Object.keys(selItems).filter(function(k){return selItems[k];}).length > 0 ? '#fff' : C.muted,
            fontSize:14, fontWeight:700}
        }, '💾 선택한 미등록 항목 내역에 추가 ('+Object.keys(selItems).filter(function(k){return selItems[k];}).length+'건)')
      )
  );
}
// 엑셀/CSV 업로드를 처리하는 전문 컴포넌트입니다.
function BulkIn(props) {
  var fileRef = useRef(null);

  var handleFile = function(e) {
    var file = e.target.files[0];
    if (!file) return;

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        var newTxs = results.data.map(function(row) {
          return {
            id: Date.now() + Math.random(),
            date: row['날짜'] || new Date().toISOString().split('T')[0],
            type: row['유형'] === '수입' ? 'income' : 'expense',
            amount: parseInt(row['금액']) || 0,
            catId: row['카테고리ID'] || 'other',
            store: row['상호명'] || 'CSV업로드',
            member: row['구성원ID'] || 'user',
            method: row['결제수단'] || '기타',
            source: 'bulk'
          };
        });

        // 데이터 저장 (기본 가계부 로직 준수)
        newTxs.forEach(function(tx) {
          props.onAdd(tx); // 상위 컴포넌트의 저장 함수 호출
        });

        alert(newTxs.length + '건의 데이터가 성공적으로 등록되었습니다.');
        props.onBack();
      }
    });
  };

  return h('div', {style:{padding:'0 16px'}},
    h(Hdr, {title:'대량 업로드', left:h('button',{onClick:props.onBack, style:{background:'none',border:'none',color:C.accent}},'←')}),
    h('div', {style:{textAlign:'center', padding:'40px 20px', background:C.card, borderRadius:16, border:'2px dashed '+C.faint}},
      h('input', {type:'file', ref:fileRef, style:{display:'none'}, accept:'.csv', onChange:handleFile}),
      h('div', {style:{fontSize:48, marginBottom:16}}, '📊'),
      h('p', {style:{color:C.text, fontWeight:700}}, 'CSV 파일을 선택해주세요'),
      h('p', {style:{color:C.muted, fontSize:12, marginBottom:24}}, '날짜, 유형, 금액, 카테고리ID... 항목이 필요합니다.'),
      h('button', {
        onClick: function(){ fileRef.current.click(); },
        style: {background:C.accent, color:'#fff', border:'none', padding:'12px 24px', borderRadius:8, fontWeight:700}
      }, '파일 찾기')
    )
  );
}

      h('div', {style:{textAlign:'center',marginBottom:16}},

function App() {
  var savedUser = lsGet(LS_USER, null);
  var loggedIn  = useState(!!savedUser);   var setLoggedIn = loggedIn[1];  loggedIn = loggedIn[0];
  var curUser   = useState(savedUser);     var setCurUser  = curUser[1];   curUser  = curUser[0];
  var tab       = useState('dashboard');   var setTab      = tab[1];       tab      = tab[0];

  // ★★★ [뒤로가기 연동] 휴대폰 ◁ 버튼으로 이전 화면 복귀 ★★★
  var isPopNav = useRef(false);

  function navTo(newTab) {
    if (newTab === tab) return;
    history.pushState({ tab: newTab }, '');
    setTab(newTab);
  }

  function navBack() {
    if (history.state && history.state.tab) {
      history.back();
    } else {
      setTab('dashboard');
    }
  }

  useEffect(function() {
    history.replaceState({ tab: 'dashboard' }, '');
    function handlePop(e) {
      if (e.state && e.state.tab) {
        isPopNav.current = true;
        setTab(e.state.tab);
      }
    }
    window.addEventListener('popstate', handlePop);
    return function() { window.removeEventListener('popstate', handlePop); };
  }, []);
  var dpArr = useState('이번달'); var globalDp = dpArr[0]; var setGlobalDp = dpArr[1];
  var baseDateArr = useState(new Date()); var globalBaseDate = baseDateArr[0]; var setGlobalBaseDate = baseDateArr[1];
  var toast     = useState(null);          var setToast    = toast[1];     toast    = toast[0];
  var txs       = useState(function(){ return lsGet(LS_TXS, []); });       var setTxs = txs[1]; txs = txs[0];
  var cards     = useState(function(){ return lsGet(LS_CARDS, INIT_CARDS); }); var setCards = cards[1]; cards = cards[0];
  var fixedExps = useState(function(){ return lsGet(LS_FIXED, []); });     var setFixedExps = fixedExps[1]; fixedExps = fixedExps[0];
  var startDay  = useState(function(){ return lsGet(LS_START_DAY, 1); });  var setStartDay = startDay[1]; startDay = startDay[0];
  var dupModal  = useState(null);          var setDupModal  = dupModal[1];  dupModal  = dupModal[0];
  var pendingTx = useState(null);          var setPendingTx = pendingTx[1]; pendingTx = pendingTx[0];

  // ★ 추가: 알림 무한반복을 막기 위한 방어벽
   // ★ 알림: 첫 Firebase 스냅샷은 무시, 이후에는 "이전에 없던 id"만 새 내역으로 판정 (arr[0]은 날짜 정렬이라 틀릴 수 있음)
  var isFirstLoad = useRef(true);
  var prevTxIdsRef = useRef(new Set());

  useEffect(function(){
    var r = fbRef('txs'); if(!r) return;
    r.on('value', function(snap){ 
      var data = snap.val(); 
      if(data){ 
          var arr = Object.values(data).sort(function(a,b){
          var td = new Date(b.date||0) - new Date(a.date||0);
          if (td !== 0) return td;
          return (Number(b.id)||0) - (Number(a.id)||0);
        });  
        
       // ★★★ [실제 휴대폰 네이티브 알림 시스템] ★★★
        if(!isFirstLoad.current) {
          var prevSet = prevTxIdsRef.current;
          var newItems = arr.filter(function(t){ return t && !prevSet.has(String(t.id)); });
          if(newItems.length > 0) {
            newItems.sort(function(a,b){ return (Number(b.id)||0) - (Number(a.id)||0); });
            var latestNewTx = newItems[0];
            var alarms = lsGet(LS_ALARMS, {newTx:true, budget:true, monthly:true, ai:true, income:false});
            if('Notification' in window && Notification.permission === 'granted') {
              var arrSnap = arr;
              // ★ 수정: 3000ms 지연 제거 → 즉시 실행
(function() {
  var tx = latestNewTx;
  var memObj = MEMBERS.find(function(m){return m.id===tx.member}) || {name:'가족'};
  var catObj = EX_CATS.find(function(c){return c.id===tx.catId}) || {name:'기타'};
  var alarms = lsGet(LS_ALARMS, {newTx:true, budget:true, monthly:true, ai:true, income:false});
  if(tx.type === 'income' && alarms.income) {
    sendNotif('💵 수입 입력', memObj.name + '님이 수입을 입력했어요\n' + (tx.store || '상호명 없음') + ' | ' + (tx.amount||0).toLocaleString() + '원', 'income-' + tx.id);
  }
  if(tx.type === 'expense' && alarms.newTx) {
    sendNotif('💰 가계부 업데이트', memObj.name + '님이 ' + catObj.name + ' 입력\n' + (tx.store || '상호명 없음') + ' | ' + (tx.amount||0).toLocaleString() + '원', 'expense-' + tx.id);
  }
})();
            }
          }
        }
        prevTxIdsRef.current = new Set(arr.map(function(t){ return String(t.id); }));
        isFirstLoad.current = false;
        // ★★★ [알림 시스템 끝] ★★★

        setTxs(arr); 
        lsSet(LS_TXS, arr); 
      } 
    });
    var rf = fbRef('fixed'); if(rf) rf.on('value', function(snap){ var data = snap.val(); if(data){ var arr = Object.values(data); setFixedExps(arr); lsSet(LS_FIXED, arr); } });
  }, []);

/* ★★★ [공통 알림 발송 함수] 모바일/PC 모두 대응 ★★★ */
function sendNotif(title, body, tag) {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  var opts = {
    body: body,
    icon: 'https://kimyungkook.github.io/family-ledger/icon-192.png',
    badge: 'https://kimyungkook.github.io/family-ledger/icon-192.png',
    tag: tag || ('notif-' + Date.now()),
    vibrate: [200, 100, 200],
    requireInteraction: false
  };
  /* 모바일: Service Worker 방식 */
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(function(reg) {
      reg.showNotification(title, opts);
    }).catch(function() {
      /* PC 폴백 */
      try { new Notification(title, opts); } catch(e) {}
    });
  } else {
    /* PC 직접 방식 */
    try { new Notification(title, opts); } catch(e) {}
  }
}
/* ★★★ [공통 알림 함수 끝] ★★★ */

 function doSaveTx(tx, isFixed, msg) {
  if(fbDb) { fbSaveTx(tx); if(isFixed) fbSaveFixed(tx); }
  else { setTxs(function(p){ var n=[tx].concat(p); lsSet(LS_TXS,n); return n; }); if(isFixed) setFixedExps(function(p){ var n=p.concat([tx]); lsSet(LS_FIXED,n); return n; }); }

  // ★★★ [알림 발송] 저장 즉시 알림 ★★★
  (function(){
    try {
      var alarmSettings = lsGet(LS_ALARMS, {newTx:true, income:false, budget:true});
      if(!('Notification' in window)) return;
      if(Notification.permission !== 'granted') return;
      var memObj = MEMBERS.find(function(m){ return m.id === tx.member; }) || {name:'가족'};
      var catObj = ALL_CATS.find(function(c){ return c.id === tx.catId; }) || {name:'기타', icon:'💸'};
      var isInc = tx.type === 'income';
      if(isInc && !alarmSettings.income) return;
      if(!isInc && !alarmSettings.newTx) return;
      var title = isInc ? '💵 수입 등록' : '💰 지출 등록';
      var body  = memObj.name + '님 · ' + (tx.store || '미입력') + '\n' + (isInc ? '+' : '-') + (tx.amount||0).toLocaleString() + '원 · ' + catObj.name;
      sendNotif(title, body, 'tx-' + tx.id);
      // ★ 예산 초과 경고 알림
      if(!isInc && alarmSettings.budget) {
        var budgetSet = lsGet(LS_BUDGET, 0);
        if(budgetSet > 0) {
          var curMonth = new Date().toISOString().slice(0,7);
          var allTxs2 = lsGet(LS_TXS, []);
          var curTotE = allTxs2.filter(function(t){ return t.type==='expense' && t.date && t.date.startsWith(curMonth); }).reduce(function(s,t){return s+t.amount;},0);
          var ratio = Math.round(curTotE / budgetSet * 100);
          if(ratio >= 80 && ratio < 110) {
            setTimeout(function(){
              sendNotif('🚨 예산 경고!', '이번 달 예산의 ' + ratio + '% 사용 중\n' + curTotE.toLocaleString() + '원 / ' + budgetSet.toLocaleString() + '원', 'budget-warn');
            }, 1500);
          } else if(ratio >= 110) {
            setTimeout(function(){
              sendNotif('🔴 예산 초과!', '예산을 ' + (ratio-100) + '% 초과했습니다!\n' + curTotE.toLocaleString() + '원 사용', 'budget-over');
            }, 1500);
          }
        }
      }
    } catch(notifErr) { console.warn('[알림 오류]', notifErr); }
  })();
  // ★★★ [알림 발송 끝] ★★★

  setToast(msg || '저장되었습니다'); navBack(); setTimeout(function(){setToast(null);},2000);
}

  function addTx(tx, isFixed) {
    if(!tx.amount || parseInt(tx.amount) <= 0) return;
    var newStore = (tx.store || '미입력').replace(/\s/g,'').toLowerCase();
    var dupFound = null;
    for(var di = 0; di < txs.length; di++) {
      var t = txs[di];
      var oldStore = (t.store || '').replace(/\s/g,'').toLowerCase();
      if(t.amount === tx.amount && t.date === tx.date && t.member === tx.member && (newStore === oldStore || newStore.indexOf(oldStore) >= 0 || oldStore.indexOf(newStore) >= 0)) {
        dupFound = t; break;
      }
    }
    if(dupFound) { setPendingTx({tx: tx, isFixed: isFixed}); setDupModal(dupFound); } 
    else { doSaveTx(tx, isFixed); }
  }

  function updTx(u) { if(fbDb){ fbSaveTx(u); } else { setTxs(function(p){ var n=p.map(function(t){return t.id===u.id?u:t;}); lsSet(LS_TXS,n); return n; }); } }
  function delTx(id) { if(fbDb){ fbDelTx(id); } else { setTxs(function(p){ var n=p.filter(function(t){return t.id!==id;}); lsSet(LS_TXS,n); return n; }); } }
  function bulkDel(ids) { ids.forEach(function(id){ delTx(id); }); }

  if(!loggedIn) return h(AuthScreen, {onLogin: function(u){ lsSet(LS_USER,u); setCurUser(u); setLoggedIn(true); }});

  return h('div', {style:{ background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'Pretendard', sans-serif", maxWidth:430, margin:'0 auto', position:'relative' }},
    tab==='dashboard' && h(Dashboard,  {txs:txs, onNav:navTo, startDay:startDay, onAdd:addTx, onDelete:delTx, onUpdate:updTx, dp:globalDp, setDp:setGlobalDp, baseDate:globalBaseDate, setBaseDate:setGlobalBaseDate}),
    tab==='calendar'  && h(CalendarView, {txs:txs, startDay:startDay}),
    tab==='analysis'  && h(Analysis,   {txs:txs, startDay:startDay, dp:globalDp, baseDate:globalBaseDate}),
    tab==='add'       && h(AddMenu,    {onAdd:addTx, onClose:navBack, cards:cards, fixedList:fixedExps, onDeleteFixed:delTx}),
    tab==='list'      && h(TxList,     {txs:txs, onUpdate:updTx, onDelete:delTx, onBulkDelete:bulkDel}),
    tab==='settings'  && h(Settings,   {txs:txs, onLogout:function(){lsDel(LS_USER); setLoggedIn(false);}, curUser:curUser, startDay:startDay, setStartDay:setStartDay}),
    h(BNav, {active:tab, onTab:navTo}),
    dupModal && h(DuplicateModal, {
      dupTx: dupModal, 
      newTx: pendingTx.tx, 
      onCancel: function(){ setDupModal(null); setPendingTx(null); },
      onForce: function(){ doSaveTx(pendingTx.tx, pendingTx.isFixed, '중복 항목을 강제 저장했습니다'); setDupModal(null); setPendingTx(null); }
    }),
    toast && h(Toast, {message:toast, onHide:function(){setToast(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
});
