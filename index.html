// ★★★ [앱 아이콘 설정] — 아이콘 변경시 drawAppIcon 함수만 수정 ★★★
(function(){
  function drawAppIcon(ctx, s) {
    var r = s/192;
    ctx.fillStyle = '#0A0E27';
    roundRect(ctx, 0, 0, s, s, 42*r); ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,0.25)'; ctx.lineWidth = 1.2*r;
    roundRect(ctx, 0, 0, s, s, 42*r); ctx.stroke();
    ctx.fillStyle = '#101C3A'; ctx.strokeStyle = 'rgba(0,229,255,0.4)'; ctx.lineWidth = 0.8*r;
    roundRect(ctx, 45*r, 32*r, 96*r, 120*r, 7*r); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0C1530'; ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 1.2*r;
    roundRect(ctx, 39*r, 26*r, 96*r, 120*r, 7*r); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,229,255,0.08)';
    roundRect(ctx, 49*r, 34*r, 76*r, 14*r, 3*r); ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,0.5)'; ctx.lineWidth = 1*r;
    ctx.beginPath(); ctx.moveTo(54*r,41*r); ctx.lineTo(96*r,41*r); ctx.stroke();
    drawCheck(ctx, 54*r, 58*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,58*r); ctx.lineTo(104*r,58*r); ctx.stroke();
    ctx.fillStyle = '#7BF5A5'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('+850', 122*r, 62*r);
    drawCheck(ctx, 54*r, 74*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,74*r); ctx.lineTo(100*r,74*r); ctx.stroke();
    ctx.fillStyle = '#FF6B9D'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('-320', 122*r, 78*r);
    drawCheck(ctx, 54*r, 90*r, r, '#7BF5A5');
    ctx.strokeStyle = 'rgba(0,229,255,0.35)'; ctx.lineWidth = 0.8*r;
    ctx.beginPath(); ctx.moveTo(70*r,90*r); ctx.lineTo(108*r,90*r); ctx.stroke();
    ctx.fillStyle = '#FF6B9D'; ctx.font = (10*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('-150', 122*r, 94*r);
    ctx.fillStyle = 'rgba(0,229,255,0.06)';
    roundRect(ctx, 49*r, 112*r, 76*r, 14*r, 3*r); ctx.fill();
    ctx.fillStyle = 'rgba(0,229,255,0.6)'; ctx.font = (9*r)+'px monospace';
    ctx.textAlign = 'right'; ctx.fillText('+380', 120*r, 123*r);
    ctx.fillStyle = '#00E5FF';
    ctx.beginPath(); ctx.arc(142*r, 136*r, 25*r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0A0E27';
    ctx.beginPath(); ctx.arc(142*r, 136*r, 20*r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00E5FF'; ctx.font = 'bold '+(22*r)+'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('W', 142*r, 137*r); ctx.textBaseline = 'alphabetic';
    var dots = [['#FF6B9D',53*r,18*r],['#00E5FF',66*r,14*r],['#FFD700',79*r,18*r]];
    dots.forEach(function(d){ ctx.fillStyle=d[0]; ctx.beginPath(); ctx.arc(d[1],d[2],5*r,0,Math.PI*2); ctx.fill(); });
  }
  function drawCheck(ctx, x, y, r, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.8*r; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+4*r,y+4*r); ctx.lineTo(x+10*r,y-4*r); ctx.stroke();
  }
  function roundRect(ctx, x, y, w, h, rad) {
    ctx.beginPath(); ctx.moveTo(x+rad,y); ctx.lineTo(x+w-rad,y);
    ctx.arcTo(x+w,y,x+w,y+rad,rad); ctx.lineTo(x+w,y+h-rad);
    ctx.arcTo(x+w,y+h,x+w-rad,y+h,rad); ctx.lineTo(x+rad,y+h);
    ctx.arcTo(x,y+h,x,y+h-rad,rad); ctx.lineTo(x,y+rad);
    ctx.arcTo(x,y,x+rad,y,rad); ctx.closePath();
  }
  function generateIcon(size) {
    var c = document.createElement('canvas'); c.width = size; c.height = size;
    var ctx = c.getContext('2d'); drawAppIcon(ctx, size); return c.toDataURL('image/png');
  }
  window.addEventListener('DOMContentLoaded', function(){
    try {
      var icon192 = generateIcon(192);
      var icon512 = generateIcon(512);
      var fav = document.createElement('link'); fav.rel = 'icon'; fav.type = 'image/png'; fav.href = icon192;

      var apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = icon192;
      document.head.appendChild(apple);

        name: 'FamilyLedger AI 가계부',
        short_name: '가계부',
        start_url: '.',
        display: 'standalone',
        background_color: '#0A0E27',

          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
      var mLink = document.createElement('link'); mLink.rel = 'manifest'; mLink.href = URL.createObjectURL(blob);
      document.head.appendChild(mLink);
    } catch(e) { console.warn('[PWA아이콘]', e); }
  });
})();

/* 현재 순저축 계산 */
function calcNetSaving(txs){
  var income = txs
    .filter(function(t){
      return t.type==='income';
    })
    .reduce(function(s,t){
      return s+t.amount;
    },0);

  var expense = txs
    .filter(function(t){
      return t.type==='expense';
    })
    .reduce(function(s,t){
      return s+t.amount;
    },0);

  return income-expense;
}

/* 진행률 계산 */
function goalPercent(now,target){
  if(target<=0) return 0;
  return Math.min(
    Math.round((now/target)*100),
    100
  );
}

function getFinMonth(dateStr, sDay) {
  var d = new Date(dateStr);
  var y = d.getFullYear();
  var m = d.getMonth();
  // 거래 날짜가 시작일보다 작으면, 가계부상으로는 아직 '저번 달'임!
  if (d.getDate() < sDay) {
    m--;
    if (m < 0) { m = 11; y--; }
  }
  return { y: y, m: m };
}

// 👇👇 [지운 자리에 여기서부터 복사해서 붙여넣으세요] 👇👇
function fDash(txs, p, baseDateObj, sDay) {
  sDay = sDay || 1;
  // ★기준 날짜를 사용자가 설정한 '가계부 시작일' 기준으로 진짜 년/월을 찾습니다.
  var targetFm = getFinMonth(baseDateObj.toISOString(), sDay);
  var targetY = targetFm.y;
  var targetM = targetFm.m;

  return txs.filter(function(t) {
    // ★각각의 거래 결제 날짜도 '가계부 시작일' 기준으로 어느 달에 속하는지 찾습니다.
    var tFm = getFinMonth(t.date, sDay);
    var ty = tFm.y;
    var tm = tFm.m;

    if (p === '이번달') {
      return ty === targetY && tm === targetM;
    }
    if (p === '분기') {
      var targetQ = Math.floor(targetM / 3);
      var tQ = Math.floor(tm / 3);
      return ty === targetY && tQ === targetQ;
    }
    return ty === targetY; // 올해
  });
}

function fPeriod(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  
  if (p === '주간') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6); weekAgo.setHours(0,0,0,0);
    return txs.filter(function(t) { return new Date(t.date) >= weekAgo; });
  }
  if (p === '월간') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y && fm.m === nowFm.m; });
  }
  return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y; });
}

// ★ [리디자인] DonutChart — 2026 Glassmorphism + Neon Glow 3D 도넛 차트
function DonutChart(props) {
  var data = props.data || [];
  var size = props.size || 110;
  var totalLabel = props.totalLabel || null;

  if (!data.length) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background:'radial-gradient(circle, #1C2541, #0A0E1A)',
    boxShadow:'0 0 20px rgba(0,229,255,0.1)'
  }});

  var total = data.reduce(function(s,d){return s+d.value;},0);
  if (!total) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background:'radial-gradient(circle, #1C2541, #0A0E1A)'
  }});

  var cx = size/2, cy = size/2;
  var R = size/2 * 0.82, r = size/2 * 0.50;
  var angle = -Math.PI/2;
  var paths = [], glowFilters = [];

  // 네온 그라데이션 팔레트
  var neonPalette = [
    ['#FF6B6B','#FF007C'], ['#00E5FF','#536DFE'], ['#FFD600','#FF9800'],
    ['#69F0AE','#00BFA5'], ['#CE93D8','#7C3AED'], ['#FF8A65','#FF5252']
  ];

  data.forEach(function(d,i){
    var slice = (d.value/total)*2*Math.PI;
    if(slice < 0.01){ angle += slice; return; }

    var x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
    var x2=cx+R*Math.cos(angle+slice), y2=cy+R*Math.sin(angle+slice);
    var xi1=cx+r*Math.cos(angle+slice), yi1=cy+r*Math.sin(angle+slice);
    var xi2=cx+r*Math.cos(angle), yi2=cy+r*Math.sin(angle);
    var lg = slice > Math.PI ? 1 : 0;

    var gradId = 'ng'+i, pal = neonPalette[i % neonPalette.length];

    glowFilters.push(
      h('defs', {key:'def'+i},
        h('linearGradient', {
          key: gradId, id: gradId,
          x1: '0%', y1: '0%', x2: '100%', y2: '100%'
        },
          h('stop', {offset:'0%', stopColor: pal[0]}),
          h('stop', {offset:'100%', stopColor: pal[1]})
        )
      )
    );

    // 글로우 + 메인 슬라이스
    paths.push(
      h('path', {
        key:'g'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')', opacity:'0.3',
        style:{filter:'blur(3px)'}
      }),
      h('path', {
        key:'p'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')',
        stroke: 'rgba(255,255,255,0.1)',
        strokeWidth: 1
      })
    );
    angle += slice;
  });

  return h('div', {style:{position:'relative', width:size, height:size}},
    h('svg', {
      width:size, height:size, viewBox:'0 0 '+size+' '+size,
      style:{filter:'drop-shadow(0 4px 16px rgba(0,0,0,0.5))'}
    },
      glowFilters, paths,
      h('circle', {
        cx:cx, cy:cy, r:r-2,
        fill:'rgba(10,14,26,0.9)',
        stroke:'rgba(255,255,255,0.1)',
        strokeWidth:1
      }),
      totalLabel && h('text', {
        x:cx, y:cy-4, textAnchor:'middle',
        fontSize:9, fill:'rgba(255,255,255,0.6)',

function LineChartSVG(props) {
  var data = props.data || [];
  var height = props.height || 140;
  var w=320, pL=38, pR=10, pT=14, pB=24;
  var iw=w-pL-pR, ih=height-pT-pB;
  if(data.length<2) return h('div',{style:{height:height,display:'flex',alignItems:'center',justifyContent:'center'}},
    h('span',{style:{color:C.muted,fontSize:12}},'데이터 없음'));
  var maxE = Math.max.apply(null,data.map(function(d){return d.expense;}));
  var maxI = data[0].income ? Math.max.apply(null,data.map(function(d){return d.income||0;})) : maxE;
  var maxV = Math.max(maxE,maxI,1);
  function px(i){ return pL+i*(iw/(data.length-1)); }
  function pyE(v){ return pT+ih-(v/maxV)*ih; }
  function pyI(v){ return pT+ih-(v/maxV)*ih; }
  var ePts = data.map(function(d,i){return px(i)+','+pyE(d.expense);}).join(' ');
  var iPts = data[0].income ? data.map(function(d,i){return px(i)+','+pyI(d.income);}).join(' ') : null;
  return h('svg',{viewBox:'0 0 '+w+' '+height,width:'100%',height:height},
    [0,0.5,1].map(function(f,i){
      return h('line',{key:'g'+i,x1:pL,y1:pT+ih*f,x2:w-pR,y2:pT+ih*f,stroke:C.border,strokeDasharray:'4 4'});
    }),
    [maxV,maxV*0.5,0].map(function(v,i){
      return h('text',{key:'y'+i,x:pL-4,y:pT+ih*(i*0.5)+4,textAnchor:'end',fontSize:9,fill:C.muted},(v/10000).toFixed(0)+'만');
    }),
    data.map(function(d,i){
      return h('text',{key:'x'+i,x:px(i),y:height-4,textAnchor:'middle',fontSize:10,fill:C.muted},d.month);
    }),
    iPts && h('polyline',{points:iPts,fill:'none',stroke:C.green,strokeWidth:2.5,strokeLinejoin:'round'}),
    h('polyline',{points:ePts,fill:'none',stroke:C.red,strokeWidth:2.5,strokeLinejoin:'round'}),
    data.map(function(d,i){return h('circle',{key:'ec'+i,cx:px(i),cy:pyE(d.expense),r:4,fill:C.red});}),
    iPts && data.map(function(d,i){return h('circle',{key:'ic'+i,cx:px(i),cy:pyI(d.income||0),r:4,fill:C.green});})
  );
}

/* ★ 수정된 AI 재무분석 및 KPI 컨설팅 섹션 ★ */
function SavingsModal(props) {
  var onClose = props.onClose;
  var txs = props.txs || [];
  var exp = txs.filter(function(t){return t.type==='expense';});
  var totE = exp.reduce(function(s,t){return s+t.amount;},0);
  
  // KPI 데이터 중복 계산 방지를 위한 단일 객체화
  var byCat = {};
  exp.forEach(function(t){byCat[t.catId]=(byCat[t.catId]||0)+t.amount;});

  // [중복 제거됨] 기존에 여러 번 정의되었던 KPI 기준값을 최적화된 단일 리스트로 관리
  var tips = [
    {icon:'🍜',cat:'food',  base:0.28,label:'식비 28% 이하 유지'},
    {icon:'🛒',cat:'shop',  base:0.20,label:'쇼핑 20% 이하 유지'},
    {icon:'📱',cat:'comm',  base:0.05,label:'통신비 5% 이하 유지'},
    {icon:'🎬',cat:'culture',base:0.08,label:'문화생활 8% 이하 유지'}
  ];

  var annual = 0;
  var rows = tips.map(function(tip){
    var curr = byCat[tip.cat]||0;
    var tgt = totE * tip.base;
    var save = Math.max(Math.round(curr - tgt), 0);
    annual += save * 12;
    return {icon:tip.icon, label:tip.label, curr:curr, tgt:tgt, save:save};
  }).filter(function(r){return r.save > 0;});

  return h(Sheet, {title:'🧬 AI 재무분석 및 컨설팅', onClose:onClose},
    h('div',{style:{padding:'12px',background:C.green+'15',borderRadius:12,textAlign:'center',marginBottom:14}},
      h('p',{style:{color:C.muted,fontSize:12,margin:'0 0 4px'}},'AI 분석 기반 연간 절약 가능액'),
      h('p',{style:{color:C.green,fontSize:24,fontWeight:900,margin:0}},fmt(annual))
    ),
    // 중복 출력 루프 제거 및 정제된 데이터 바인딩
    rows.length === 0
      ? h('p',{style:{color:C.muted,textAlign:'center',padding:'20px 0'}},'현재 KPI 지표가 매우 우수합니다 👍')
      : rows.map(function(r, i){
          return h('div',{key:i, style:{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:'1px solid '+C.faint}},
            h('span',{style:{fontSize:24,flexShrink:0}}, r.icon),
            h('div',{style:{flex:1}},
              h('p',{style:{color:C.text,fontSize:13,fontWeight:600,margin:'0 0 3px'}}, r.label),
              h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
                h('span',{style:{color:C.red,fontSize:11}},'현재 '+fmt(r.curr)),
                h('span',{style:{color:C.muted,fontSize:11}},'→'),
                h('span',{style:{color:C.green,fontSize:11}},'목표 '+fmt(r.tgt))
              )
            ),
            h('span',{style:{color:C.green,fontSize:13,fontWeight:800,flexShrink:0}},'+'+fmtS(r.save)+'/월')
          );
        })
  );
}

var LS_GEMINI = 'flai_gemini_key';
/* ★★★ [학습 시스템] 시작 ★★★ */
var LS_STORE_MAP = 'flai_store_map';
 
function getLearnedCategory(storeName) {
  if (!storeName) return null;
  var map = lsGet(LS_STORE_MAP, {});
  if (map[storeName]) return map[storeName];
  var keys = Object.keys(map);
  for (var i = 0; i < keys.length; i++) {
    if (storeName.indexOf(keys[i]) >= 0 || keys[i].indexOf(storeName) >= 0) {
      return map[keys[i]];
    }
  }
  return null;
}
 
function saveLearnedCategory(storeName, catId, subCat) {
  if (!storeName || storeName.length < 2) return;
  var map = lsGet(LS_STORE_MAP, {});
  var existing = map[storeName] || { count: 0 };
  map[storeName] = {
    catId: catId,
    subCat: subCat || '',
    count: existing.count + 1,
    lastDate: new Date().toISOString().split('T')[0]
  };
  lsSet(LS_STORE_MAP, map);
}
 
function buildLearningContext(maxEntries) {
  /* 1단계: 수동 학습 데이터 (사용자가 수정 확정한 것) */
  var map = lsGet(LS_STORE_MAP, {});

  /* 2단계: 기존 전체 거래 내역에서 패턴 자동 추출 */
  var allTxs = lsGet(LS_TXS, []);
  allTxs.forEach(function(tx) {
    if (!tx.store || tx.store.length < 2) return;
    var key = tx.store;
    if (!map[key]) {
      map[key] = { catId: tx.catId, subCat: tx.subCat || '', count: 0 };
    }
    map[key].count++;
    /* 가장 최근 분류를 우선 반영 */
    map[key].catId = tx.catId;
    if (tx.subCat) map[key].subCat = tx.subCat;
  });

  /* 3단계: 사용 횟수 많은 순으로 정렬 후 프롬프트 생성 */
  var entries = Object.keys(map).map(function(k) {
    return { store: k, catId: map[k].catId, subCat: map[k].subCat, count: map[k].count };
  });
  entries.sort(function(a, b) { return b.count - a.count; });
  var top = entries.slice(0, maxEntries || 30);
  if (top.length === 0) return '';
  var lines = top.map(function(e) {
    return '"' + e.store + '" → category:"' + e.catId + '", sub_category:"' + (e.subCat || '') + '"';
  });
  return '\n\n★이 사용자의 과거 분류 이력(category와 sub_category 모두 반드시 동일하게 따를 것):\n' + lines.join('\n');
}

function callGeminiText(promptText, apiKey, callback) {
  // 대표님 지시대로 문자 파싱은 기존 Groq 키(LS_GEMINI)를 고정 사용
  var groqKey = lsGet(LS_GEMINI, apiKey); 
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant', // 문자 파싱 최강 모델
    messages: [{ role: 'user', content: promptText }],
    temperature: 0.1
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + groqKey);
  xhr.timeout = 20000;
  xhr.onload = function() {
    if(xhr.status >= 200 && xhr.status < 300) {
      try {
        var data = JSON.parse(xhr.responseText);
        callback(null, data.choices[0].message.content);
      } catch(e) { callback('해석 실패', null); }
    } else { callback('Groq 서버 오류', null); }
  };
  xhr.onerror = function() { callback('네트워크 오류', null); };
  xhr.send(body);
}

async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        // [중요] 파일이 없으면 그냥 원래 있던 base64라도 돌려주게 만들었어요
        if (!file) { resolve(null); return; } 

        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                // 너비를 800으로 더 줄여볼게요 (그럼 진짜 번개처럼 빨라져요!)
                let w = 800; 
                let h = Math.round((img.height * w) / img.width);
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                // 화질을 0.5(50%)로 더 낮춰서 용량을 확 줄입니다.
                resolve(canvas.toDataURL('image/jpeg', 0.5).split(',')[1]);
            };
        };
    });
}

// --- ▼ 이 블록 전체를 복사해서 기존 callGeminiOCR 함수를 덮어쓰세요 ▼ ---
function callGeminiOCR(base64Image, mimeType, apiKey, callback) {

  /* ── 1. 저장된 API 키 로드 및 유효성 검사 ── */
  var googleKey = lsGet('flai_google_gemini_key', '');
  var openRouterKey = lsGet('flai_openrouter_api_key', '');
  var groqKey = lsGet('flai_groq_api_key', ''); // 메인 설정값

  // 키가 문자열 "null"이거나 공백일 경우 초기화하여 팝업 유도
  if (googleKey === 'null' || googleKey === 'undefined') googleKey = '';
  if (openRouterKey === 'null' || openRouterKey === 'undefined') openRouterKey = '';

  /* ── 2. 팝업 강제 출력 로직 (키가 하나라도 없으면 실행) ── */
  if (!googleKey || !openRouterKey) {
    var input = prompt(
      '📷 [영수증 AI] 2중 백업 키 설정이 필요합니다.\n\n' +
      '형식: 제미나이키, 오픈라우터키\n' +
      '(반드시 쉼표 ","로 구분해서 넣어주세요)\n\n' +
      '현재 상태:\n' +
      '- Gemini: ' + (googleKey ? '✅' : '❌ 미등록') + '\n' +
      '- OpenRouter: ' + (openRouterKey ? '✅' : '❌ 미등록')
    );

    if (input && input.includes(',')) {
      var keys = input.split(',');
      googleKey = keys[0].trim();
      openRouterKey = keys[1].trim();

      if (googleKey) lsSet('flai_google_gemini_key', googleKey);
      if (openRouterKey) lsSet('flai_openrouter_api_key', openRouterKey);
      alert('API 키 설정이 완료되었습니다. 분석을 다시 시작합니다.');
    } else {
      // 키 입력을 취소했거나 잘못 입력했을 때
      if (!googleKey) {
        callback('Gemini 키가 등록되지 않아 분석을 중단합니다.', null);
        return;
      }
    }
  }

  /* ── 3. 순차 분석 엔진 (Fallback) ── */
  var providers = [
  { name: 'Gemini', type: 'google', url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + googleKey },
  
  { name: 'Groq', type: 'groq', url: 'https://api.groq.com/openai/v1/chat/completions', key: groqKey },
  { name: 'OpenRouter', type: 'openrouter', url: 'https://openrouter.ai/api/v1/chat/completions', key: openRouterKey }
];

  function startOCR(index) {
    if (index >= providers.length) {
      callback('모든 백업 AI(Gemini/Groq/OpenRouter)가 응답하지 않습니다.', null);
      return;
    }

    var p = providers[index];
    if (p.type !== 'google' && !p.key) { startOCR(index + 1); return; }

    var xhr = new XMLHttpRequest();
    xhr.open('POST', p.url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    if (p.key) xhr.setRequestHeader('Authorization', 'Bearer ' + p.key);
    xhr.timeout = 30000;

     var learningCtx = buildLearningContext(20);
    var prompt_text = '이 영수증 이미지에서 정보를 추출해 JSON만 출력(설명 금지).\n' +
      '{"store_name":"상호명","amount":숫자,"date":"YYYY-MM-DD","category":"ID","sub_category":"소분류"}\n\n' +
      '★상호명: "상호:" 뒤 텍스트를 정확히 복사. 없으면 상단 가게이름.\n' +
      '★금액: "합계","총금액","결제금액","카드결제" 옆 최종 숫자. 쉼표 제거.\n' +
      '★날짜: YYYY-MM-DD 변환 (26/04/13→2026-04-13).\n' +
      '★카테고리 규칙:\n' +
      '  병원,의원,클리닉,피부과→health,sub:"병원" | 약국→health,sub:"약" | 보조식품→health,sub:"건강보조식품"\n' +
      '  식당,치킨,분식,휴게소→food,sub:"외식" | 카페,베이커리,디저트,아이스크림→food,sub:"간식/후식/디저트" | 마트,슈퍼,편의점→food,sub:"식자재" | 구내식당,급식→food,sub:"식대"\n' +
      '  온라인쇼핑,쿠팡→shop,sub:"온라인" | 오프라인매장→shop,sub:"오프라인"\n' +
      '  주유소→trans,sub:"주유" | 버스→trans,sub:"버스" | 택시,카카오T→trans,sub:"택시" | 지하철→trans,sub:"지하철"\n' +
      '  학원→edu,sub:"학원" | 서점→edu,sub:"서적" | 인강→edu,sub:"인강"\n' +
      '  다이소,올리브영,세제→daily,sub:"위생&케어용품" | 가전→daily,sub:"가전&가구"\n' +
      '  그외→other,sub:"편의점"\n' +
      '★특수규칙: 금액이 4800원 또는 4800의 배수(9600,14400,19200...)이면 90% 확률로 담배 구매임→category:"other",sub_category:"편의점"' +
      learningCtx;

    var body = (p.type === 'google') ? 
  JSON.stringify({ 
    contents: [{ 
      parts: [
        { text: prompt_text }, 
        { inline_data: { mime_type: mimeType || 'image/jpeg', data: base64Image } }
      ] 
    }]
    // generationConfig 완전 제거 (v1에서는 필요 없음)
  }) :
      JSON.stringify({ model: p.type === 'groq' ? "llama-3.2-11b-vision-preview" : "openai/gpt-4o-mini", messages: [{ role: "user", content: [{ type: "text", text: prompt_text }, { type: "image_url", image_url: { url: "data:" + (mimeType || 'image/jpeg') + ";base64," + base64Image } }] }], response_format: { type: "json_object" } });

    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var res = JSON.parse(xhr.responseText);
          var out = (p.type === 'google') ? res.candidates[0].content.parts[0].text : res.choices[0].message.content;
          callback(null, JSON.parse(out.substring(out.indexOf('{'), out.lastIndexOf('}') + 1)));
        } catch (e) { startOCR(index + 1); }
      } else {
        startOCR(index + 1); // 에러 발생 시 다음 순위로 자동 전환
      }
    };
    xhr.onerror = function() { startOCR(index + 1); };
    xhr.send(body);
  }

  startOCR(0); // 분석 시작
}

function testGeminiKey(apiKey, onResult) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: 'hi' }],
    max_tokens: 10
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 15000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var d=JSON.parse(xhr.responseText);
        if(d.choices && d.choices[0]) onResult('success','');
        else onResult('error','알 수 없는 응답');
      } catch(e){ onResult('error','응답 파싱 오류'); }
    } else {
      var em='HTTP '+xhr.status;
      try{var ed=JSON.parse(xhr.responseText);if(ed.error)em=ed.error.message;}catch(e2){}
      onResult('error', em);
    }
  };
  xhr.onerror = function() { onResult('cors',''); };
  xhr.ontimeout = function() { onResult('error','요청 시간 초과'); };
  xhr.send(body);
}

    h('p',{style:{color:C.gold,fontSize:11,textAlign:'center',fontWeight:600,marginTop:12}},
      '※ 4단계 통합 시스템이 최상의 분석 품질을 보장합니다.')
  );
}

/* ★수정: 영수증 다중 등록 + 일괄 파싱 시스템 (완전 재설계) */
function ReceiptIn(props) {
  var onAdd  = props.onAdd;
  var onBack = props.onBack;

  /*
   * items 배열 각 아이템 구조:
   * { id, imgSrc, mimeType, b64, status, store, amount, date, catId, subCat, member, err, editing }
   * status: 'registered' → 'analyzing' → 'parsed' → 'saved'  (또는 'error')
   */
  var items     = useState([]);    var setItems     = items[1];     items     = items[0];
  var analyzing = useState(false); var setAnalyzing = analyzing[1]; analyzing = analyzing[0];
  var progress  = useState(0);     var setProgress  = progress[1];  progress  = progress[0];

  var fileRef = useRef(null);
  var camRef  = useRef(null);

  var apiKey = lsGet(LS_GEMINI, '');

  /* ── 사진 등록 (파싱 없이 리스트에 추가만) ── */
  function handleFiles(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var fileArr = Array.from(files).slice(0, 10);

    fileArr.forEach(function(file) {
      var mime = file.type || 'image/jpeg';
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        var b64 = dataUrl.split(',')[1];
        var newItem = {
          id: Date.now() + Math.random(),
          imgSrc: dataUrl,
          mimeType: mime,
          b64: b64,
          status: 'registered',
          store: '',
          amount: '',
          date: new Date().toISOString().split('T')[0],
          catId: 'food',
          subCat: '',
          member: 'mom',
          err: '',
          editing: false
        };
        setItems(function(prev) { return prev.concat([newItem]); });
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  /* ── 개별 아이템 상태 업데이트 ── */
  function updateItem(id, changes) {
    setItems(function(prev) {
      return prev.map(function(item) {
        if (item.id === id) return Object.assign({}, item, changes);
        return item;
      });
    });
  }

  /* ── 아이템 삭제 ── */
  function removeItem(id) {
    setItems(function(prev) {
      return prev.filter(function(item) { return item.id !== id; });
    });
  }

  /* ── [분석 시작] 전체 순차 파싱 (화면 복구 및 속도 업그레이드 버전) ── */
function startAnalyzeAll() {
  if (!apiKey) { alert('설정에서 AI API 키를 먼저 등록해주세요!'); return; }

  var targets = items.filter(function(item) {
    return item.status === 'registered' || item.status === 'error';
  });

  if (targets.length === 0) { alert('분석할 사진이 없습니다.'); return; }

  setAnalyzing(true);
  setProgress(0);

  var idx = 0;

  // 마법의 async 단어가 여기 들어있어요!
  async function processNext() {
    if (idx >= targets.length) {
      setAnalyzing(false);
      return;
    }

    var target = targets[idx];
    
    // [1단계] 진짜 사진 파일을 찾아내는 줄 (속도의 핵심)
    if (!target.file && target.el && target.el.files) {
      target.file = target.el.files[0];
    }

    updateItem(target.id, { status: 'analyzing' });
    setProgress(idx + 1);

    // [2단계] 사진 압축하기 (실패해도 멈추지 않게 보험을 들었어요)
    let finalImage = target.b64; 
    try {
      if (target.file) {
        // 압축기(Canvas)를 돌려서 아주 가볍게 만들어요
        finalImage = await compressImage(target.file);
      }
    } catch (e) {
      console.log("압축 실패: 원래 사진으로 보낼게요.");
      finalImage = target.b64;
    }

    // [3단계] 로봇(AI)에게 전달하기
    callGeminiOCR(finalImage, target.mimeType, apiKey, function(err, result) {
      if (err) {
        updateItem(target.id, { status: 'error', err: err });
      } else {
        updateItem(target.id, {
          status: 'parsed',
          store: result.store_name || '',
          amount: result.amount ? String(result.amount) : '',
          catId: result.category || 'food',
          subCat: result.sub_category || '',
          date: (result.date && result.date.length === 10) ? result.date : new Date().toISOString().split('T')[0],
          err: ''
        });
      }
      idx++;
      setTimeout(processNext, 500); // 다음 영수증 분석하러 가기!
    });
  }

  // 진짜로 시작하는 버튼!
  processNext();
}

  /* ── 개별 [등록] → 지출내역 저장 ── */
  function saveItem(item) {
    if (!item.amount || parseInt(item.amount) <= 0) {
      alert('금액을 입력해주세요.'); return;
    }
    saveLearnedCategory(item.store, item.catId, item.subCat);
    onAdd({
      id: Date.now(),
      type: 'expense',
      amount: parseInt(item.amount),
      catId: item.catId,
      subCat: item.subCat,
      store: item.store || '영수증',
      member: item.member,
      date: item.date,
      method: '카드',
      source: 'receipt'
    }, false);
    updateItem(item.id, { status: 'saved' });
  }

  /* ── 상태별 카운트 ── */
  var countReg   = items.filter(function(i){ return i.status==='registered'; }).length;
  var countDone  = items.filter(function(i){ return i.status==='parsed'; }).length;
  var countSaved = items.filter(function(i){ return i.status==='saved'; }).length;
  var countErr   = items.filter(function(i){ return i.status==='error'; }).length;
  var countAll   = items.length;

  /* ══════════════════════════════════════════ */
  /* ★★★ 화면 렌더링 ★★★                      */
  /* ══════════════════════════════════════════ */
  return h('div', {style:{padding:'0 16px 100px', overflowY:'auto', height:'100vh'}},
    h(Hdr, {title:'📷 영수증 AI 인식 (다중)', onBack:onBack}),

    /* ── API 키 미등록 경고 ── */
    !apiKey && h('div',{style:{background:C.gold+'15',border:'1px solid '+C.gold+'44',borderRadius:12,padding:'12px 14px',marginBottom:14}},
      h('p',{style:{color:C.gold,fontSize:12,fontWeight:700,margin:'0 0 6px'}},'💡 AI 자동 인식 활성화 방법'),
      h('p',{style:{color:C.muted,fontSize:12,margin:0,lineHeight:1.7}},'설정 탭 → [AI API 키 설정]에서 무료 API 키를 입력하면 영수증을 자동으로 인식합니다.')
    ),

    /* ── 숨겨진 파일 입력 ── */
    h('input', {ref:camRef, type:'file', accept:'image/*', capture:'environment', multiple:true, onChange:handleFiles, className:'hidden-file'}),
    h('input', {ref:fileRef, type:'file', accept:'image/*', multiple:true, onChange:handleFiles, className:'hidden-file'}),

    /* ══════════════════════════════════════════ */
    /* ── 사진이 없을 때: 초기 안내 화면 ──       */
    /* ══════════════════════════════════════════ */
    items.length === 0 && h('div', null,
      h(GCard, {style:{marginBottom:14, border:'1px solid '+C.accent+'44', background:C.accent+'08'}},
        h('p',{style:{color:C.accent,fontSize:13,fontWeight:700,margin:'0 0 8px'}},'📋 사용 방법'),
        h('p',{style:{color:C.muted,fontSize:12,margin:0,lineHeight:1.8}},
          '① 영수증 사진을 1장씩 또는 여러 장 등록\n' +
          '② 등록 완료 후 [분석 시작] 버튼 클릭\n' +
          '③ AI가 순차적으로 모든 영수증 분석\n' +
          '④ 결과 확인 후 개별 [등록] 또는 [수정]')
      ),
      h('div',{onClick:function(){if(camRef.current) camRef.current.click();},
        style:{background:C.faint,borderRadius:16,height:180,display:'flex',flexDirection:'column',
          alignItems:'center',justifyContent:'center',marginBottom:14,
          border:'2px dashed '+C.accent+'66',cursor:'pointer'}},
        h('span',{style:{fontSize:48}},'📷'),
        h('p',{style:{color:C.muted,fontSize:14,marginTop:10}},'탭하여 영수증 사진 등록'),
        h('p',{style:{color:C.faint,fontSize:11,marginTop:4}},'여러 장 동시 선택 가능 (최대 10장)')
      ),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
        h('button',{onClick:function(){if(camRef.current) camRef.current.click();},
          style:{padding:14,borderRadius:12,border:'none',cursor:'pointer',
            background:C.accent,color:'#fff',fontSize:14,fontWeight:700}},
          '📷 카메라 촬영'),
        h('button',{onClick:function(){if(fileRef.current) fileRef.current.click();},
          style:{padding:14,borderRadius:12,border:'1px solid '+C.border,cursor:'pointer',
            background:C.card2,color:C.text,fontSize:14,fontWeight:700}},
          '🖼️ 갤러리 선택')
      )
    ),

    /* ══════════════════════════════════════════ */
    /* ── 사진이 있을 때 ──                       */
    /* ══════════════════════════════════════════ */
    items.length > 0 && h('div', null,

      /* ── 상태 요약 바 ── */
      h(GCard, {style:{marginBottom:12, padding:'12px 16px'}},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
          h('p',{style:{color:C.text,fontSize:14,fontWeight:800,margin:0}},
            '📷 등록된 영수증: ' + countAll + '장'),
          !analyzing && h('button',{
            onClick:function(){if(fileRef.current) fileRef.current.click();},
            style:{padding:'5px 12px',borderRadius:16,border:'1px dashed '+C.accent+'66',
              background:C.accent+'11',color:C.accent,fontSize:11,fontWeight:700,cursor:'pointer'}
          },'+ 사진 추가')
        ),
        h('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
          countReg > 0 && h(Bdg,{text:'대기 '+countReg,color:C.gold}),
          countDone > 0 && h(Bdg,{text:'분석완료 '+countDone,color:C.green}),
          countSaved > 0 && h(Bdg,{text:'저장됨 '+countSaved,color:C.accent}),
          countErr > 0 && h(Bdg,{text:'실패 '+countErr,color:C.red})
        )
      ),

      /* ── 분석 진행률 (분석 중일 때만) ── */
      analyzing && h(GCard,{style:{marginBottom:12,textAlign:'center',padding:'16px',
          border:'1px solid '+C.accent+'44'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}},
          h('span',{style:{fontSize:28}},'🧬'),
          h('div',{style:{flex:1,textAlign:'left'}},
            h('p',{style:{color:C.text,fontSize:14,fontWeight:700,margin:'0 0 4px'}},
              'AI 분석 중... ('+progress+'/'+countAll+')'),
            h('p',{style:{color:C.muted,fontSize:11,margin:0}},
              '영수증을 순차적으로 분석하고 있습니다')
          )
        ),
        h('div',{style:{background:C.faint,borderRadius:6,height:10,overflow:'hidden'}},
          h('div',{style:{width:Math.round(progress/Math.max(countAll,1)*100)+'%',
            height:'100%',background:C.green,borderRadius:6,
            transition:'width 0.5s ease'}})
        )
      ),

      /* ══════════════════════════════════════════ */
      /* ── 개별 영수증 카드 목록 ──                */
      /* ══════════════════════════════════════════ */
      items.map(function(item, idx) {
        var borderColor =
          item.status === 'saved' ? C.green + '88' :
          item.status === 'parsed' ? C.accent + '66' :
          item.status === 'analyzing' ? C.gold + '88' :
          item.status === 'error' ? C.red + '66' :
          C.border;

        return h(GCard, {key:item.id, style:{
          marginBottom:12, padding:12,
          border:'1px solid '+borderColor,
          opacity: item.status==='saved' ? 0.5 : 1,
          transition:'all 0.3s'
        }},

          /* ── 카드 상단: 번호 + 상태 + 삭제 ── */
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
            h('div',{style:{display:'flex',alignItems:'center',gap:6}},
              h('span',{style:{background:C.accent,color:'#fff',fontSize:10,fontWeight:800,
                padding:'2px 8px',borderRadius:10}}, '#'+(idx+1)),
              item.status==='registered' && h(Bdg,{text:'⏳ 대기중',color:C.gold}),
              item.status==='analyzing' && h(Bdg,{text:'🔄 분석중...',color:C.accent}),
              item.status==='parsed' && h(Bdg,{text:'✅ 분석완료',color:C.green}),
              item.status==='error' && h(Bdg,{text:'❌ 실패',color:C.red}),
              item.status==='saved' && h(Bdg,{text:'💾 저장됨',color:C.green})
            ),
            item.status !== 'saved' && item.status !== 'analyzing' &&
              h('button',{onClick:function(){removeItem(item.id);},
                style:{background:C.red+'22',border:'none',color:C.red,
                  padding:'4px 10px',borderRadius:8,fontSize:11,fontWeight:700,cursor:'pointer'}},
                '✕ 삭제')
          ),

          /* ── 사진 + 결과 가로 배치 ── */
          h('div',{style:{display:'flex',gap:10}},
            h('img',{src:item.imgSrc,
              style:{width:80,height:100,objectFit:'cover',borderRadius:10,flexShrink:0,
                border:'1px solid '+C.border}}),

            h('div',{style:{flex:1,minWidth:0}},

              item.status === 'registered' && h('div',{style:{

                  height:'100%',color:C.muted,fontSize:12}},
                '📋 [분석 시작] 버튼을 눌러주세요'),

              /* 분석 중 */
              item.status === 'analyzing' && h('div',{style:{
                  display:'flex',alignItems:'center',justifyContent:'center',
                  height:'100%',color:C.accent,fontSize:12}},
                '🔄 AI가 분석하고 있습니다...'),

              /* 에러 */

                h('p',{style:{color:C.muted,fontSize:10,margin:'4px 0 0'}},
                  '[분석 시작]을 다시 눌러 재시도하세요')),

              /* 파싱 완료: 편집 가능 */
              (item.status === 'parsed' || item.status === 'saved') && h('div',null,
                h('input',{value:item.store,
                  disabled:item.status==='saved',
                  onChange:function(e){updateItem(item.id,{store:e.target.value});},
                  placeholder:'상호명',
                  style:{width:'100%',padding:'6px 8px',borderRadius:6,
                    background:C.faint,border:'1px solid '+C.border,
                    color:C.text,fontSize:12,marginBottom:5,outline:'none',
                    boxSizing:'border-box'}}),
                h('div',{style:{display:'flex',gap:5,marginBottom:5}},

                    disabled:item.status==='saved',
                    onChange:function(e){updateItem(item.id,{amount:e.target.value.replace(/[^\d]/g,'')});},

                      background:C.faint,border:'1px solid '+C.border,
                      color:C.red,fontSize:14,fontWeight:800,outline:'none'}}),
                  h('input',{type:'date',value:item.date,
                    disabled:item.status==='saved',
                    onChange:function(e){updateItem(item.id,{date:e.target.value});},
                    style:{flex:1,padding:'6px 8px',borderRadius:6,
                      background:C.faint,border:'1px solid '+C.border,
                      color:C.text,fontSize:11,outline:'none'}})
                ),
                item.status==='parsed' && h('div',{style:{display:'flex',gap:4,marginBottom:5}},

                )

            )
          ),

          /* ── 카테고리 선택 (파싱 완료 시) ── */
          item.status === 'parsed' && h('div',{style:{marginTop:8}},
            h('div',{style:{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}},

                  onClick:function(){
                    updateItem(item.id, {catId:c.id, subCat:''});
                  },
                  style:{padding:'4px 8px',borderRadius:12,border:'none',cursor:'pointer',
                    background:isActive?c.color+'44':C.faint,

            ),
            (item.catId && SUB_CATS[item.catId]) && h('div',{style:{
                padding:'6px 8px',background:C.card2,borderRadius:8,
                border:'1px dashed '+getCat(item.catId).color+'44'}},
              h('p',{style:{color:getCat(item.catId).color,fontSize:9,fontWeight:700,margin:'0 0 4px'}},'📌 세부 항목'),
              h('div',{style:{display:'flex',flexWrap:'wrap',gap:3}},
                SUB_CATS[item.catId].map(function(sub){
                  var isSel = item.subCat === sub;
                  return h('button',{key:sub,
                    onClick:function(){
                      updateItem(item.id, {subCat: isSel ? '' : sub});
                    },
                    style:{padding:'3px 8px',borderRadius:12,cursor:'pointer',border:'none',
                      background:isSel?getCat(item.catId).color:C.faint,
                      color:isSel?'#fff':C.muted,fontSize:10,fontWeight:isSel?700:400}},
                    sub);

              )
            ),
            h('button',{onClick:function(){saveItem(item);},
              style:{width:'100%',marginTop:8,padding:10,borderRadius:10,border:'none',
                cursor:'pointer',fontWeight:700,fontSize:13,
                background:'linear-gradient(135deg,'+C.green+',#00F5C4)',color:'#fff'}},
              '💾 지출 내역에 등록')
          )
        );
      }),

      /* ── 하단 액션 버튼들 ── */
      !analyzing && h('div',{style:{display:'flex',flexDirection:'column',gap:10,marginTop:4}},
        (countReg > 0 || countErr > 0) &&
          h('button',{onClick:startAnalyzeAll,
            style:{width:'100%',padding:16,borderRadius:14,border:'none',cursor:'pointer',
              background:'linear-gradient(135deg,'+C.accent+',#536DFE)',
              color:'#fff',fontSize:16,fontWeight:800,
              boxShadow:'0 4px 16px '+C.accent+'44'}},
            '🧬 분석 시작 ('+(countReg+countErr)+'장)'),
        h('button',{onClick:function(){
            if(confirm('등록된 모든 영수증을 삭제할까요?')){setItems([]);}
          },
          style:{width:'100%',padding:12,borderRadius:12,
            border:'1px solid '+C.red+'44',background:C.red+'11',
            color:C.red,fontSize:13,fontWeight:600,cursor:'pointer'}},
          '🗑️ 전체 초기화')
      )
    )
  );
}

/* ★수정: 문자 파싱(SMSIn)에 소분류(subCat) 파싱 및 UI 적용 */
function SMSIn(props) {
  var onAdd = props.onAdd;
  var onBack = props.onBack;
  var sms    = useState('');    var setSms    = sms[1];    sms    = sms[0];
  var result = useState(null);  var setResult = result[1]; result = result[0];
  var errMsg = useState('');    var setErrMsg = errMsg[1]; errMsg = errMsg[0];
  var member = useState('dad'); var setMember = member[1]; member = member[0];

  function parseSMS() {
    var text = sms.trim();
    if(!text) { setErrMsg('문자 내용을 입력해주세요'); return; }
    var apiKey = lsGet(LS_GEMINI, '');
    if(!apiKey) { setErrMsg('설정에서 Gemini API 키를 먼저 등록해주세요!'); return; }

    setErrMsg('🧬 AI가 문자 내용을 분석 중입니다...');

        {k:['택시','카카오t'], c:'trans', s:'택시'},

        {k:['정비','카센터','타이어','세차'], c:'other', s:'정비&수리'}
      ];
      for(var ri = 0; ri < rules.length; ri++) {
        for(var ki = 0; ki < rules[ri].k.length; ki++) {
          if(st.indexOf(rules[ri].k[ki]) >= 0) {
            data.category = rules[ri].c;
            data.sub_category = rules[ri].s;
            matched = true; break;
          }
        }
        if(matched) break;
      }
      if(!matched && isMart) { data.category = 'food'; data.sub_category = '식자재'; }
      if(!matched && isCVS)  { data.category = 'other'; data.sub_category = '편의점'; }
    }
    return data;
  }
 
  /* ★수정됨: 캡처 원본의 거대한 용량으로 인한 404/402 에러를 막기 위해 압축 로직(async/await) 적용 */
  async function handleFile(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var mime = file.type || 'image/jpeg';
    var reader = new FileReader();
    reader.onload = async function(ev) {
      var dataUrl = ev.target.result;
      setImgSrc(dataUrl);
      setStep(2);
      setErrMsg('');
 
      /* ★ AI 전송 전 스크린샷 용량을 압축하여 서버 과부하 원천 차단 */
      var finalImage = dataUrl.split(',')[1];
      try {
        if (typeof compressImage === 'function') {
          finalImage = await compressImage(file);
        }
      } catch(err) {
        console.log("압축 우회 진행", err);
      }

      callGeminiOCR(finalImage, mime, apiKey, function(err, result) {
        if(err) {
          setErrMsg('AI 분석 실패: ' + err);
          setStep(3);
          return;
        }
        /* 강제 보정 적용 */
        result = forceCorrect(result);
        setEditSt(result.store_name || result.store || '');
        setEditAmt(result.amount ? String(result.amount) : '');
        setEditCat(result.category || 'food');
        setEditSubCat(result.sub_category || '');
        // ★ 날짜 보정: 연도 없거나 과거 연도면 올해로 보정
        if(result.date) {
          var rd = String(result.date).replace(/\//g,'-');
          if(rd.length <= 5) {
            var dp = rd.split('-');
            rd = new Date().getFullYear() + '-' + String(dp[0]).padStart(2,'0') + '-' + String(dp[1]||'01').padStart(2,'0');
          }
          if(rd.length === 10) {
            var ry = parseInt(rd.split('-')[0]);
            var cy = new Date().getFullYear();
            if(ry < cy) rd = cy + rd.substring(4);
          }
          setEditDate(rd);
        }
        setStep(3);
      });
    };
    reader.readAsDataURL(file);
  }

function FamilyGoalManager(props) {
  var txs = props.txs;
  var goals = useState(function(){ return lsGet(LS_GOALS, { title: '여름휴가비 모으기', target: 3000000, isCompleted: false }); });

  var currentSavings = txs.filter(function(t){ return t.catId === 'travel_fund'; }).reduce(function(s,t){ return s + (t.assetType === 'out' ? -t.amount : t.amount); }, 0);
  
  var pct = goals.target > 0 ? Math.min((currentSavings / goals.target) * 100, 100) : 0;

  var barBg;
  if (pct >= 80) barBg = 'linear-gradient(90deg, #FF8C00, #FFD700)';
  else if (pct >= 50) barBg = 'linear-gradient(90deg, #F5F5DC, #E1C699)';
  else barBg = 'linear-gradient(90deg, #5C4033, #3E2723)';

  var barAnim = pct >= 80 ? 'sparkleOrange 1s infinite alternate' : 'none';
  var barShadow = 'inset 0 2px 5px rgba(255,255,255,0.4), inset 0 -2px 5px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3)';

  useEffect(function() {
    if (pct >= 100 && !goals.isCompleted) {
      setShowFirework(true);
      setGoals(Object.assign({}, goals, { isCompleted: true }));
      lsSet(LS_GOALS, Object.assign({}, goals, { isCompleted: true }));
      
      var apiKey = lsGet(LS_GEMINI, '');

        var prompt = "가족 목표 '" + goals.title + "'(" + goals.target + "원) 달성 축하! 다음으로 도전할 만한 여행지나 목표 제안해줘.";

      }
      setTimeout(function(){ setShowFirework(false); }, 4000);
    }
  }, [pct, goals]);

  function saveGoal() {
    var newGoal = { title: editTitle, target: parseInt(editTarget)||0, isCompleted: false };
    setGoals(newGoal); lsSet(LS_GOALS, newGoal); setIsEditing(false); setAiMsg('');
  }

        h('div', {style:{width: pct+'%', height:'100%', background: barBg, borderRadius:10, boxShadow: barShadow, transition:'width 1s ease-in-out', animation: barAnim}})

  );

function Dashboard(props) {
  var txs = props.txs;
  var onNav = props.onNav;
  var startDay = props.startDay || 1;
  var onAdd = props.onAdd;
  var onDelete = props.onDelete;
  var dp = props.dp;
  var setDp = props.setDp;
  var baseDate = props.baseDate;
  var setBaseDate = props.setBaseDate;
  var modal = useState(null); var setModal = modal[1]; modal = modal[0];
  var isAnl = useState(false); var setIsAnl = isAnl[1]; isAnl = isAnl[0];
  var mSht = useState(null); var setMSht = mSht[1]; mSht = mSht[0];
  var guideData = useState(null); var setGuideData = guideData[1]; guideData = guideData[0];
  var detailType = useState(null); var setDetailType = detailType[1]; detailType = detailType[0];  

  var ftx = useMemo(function(){ return fDash(txs, dp, baseDate, 1); }, [txs, dp, baseDate]);
  
  var prevFtx = useMemo(function(){
    var pd = new Date(baseDate);
    if (dp === '이번달') pd.setMonth(pd.getMonth() - 1);
    else if (dp === '분기') pd.setMonth(pd.getMonth() - 3);
    else pd.setFullYear(pd.getFullYear() - 1);
    // ★ 여기도 무조건 1일 기준으로 고정합니다.
    return fDash(txs, dp, pd, 1);
    }, [txs, dp, baseDate]);

  var curInc = ftx.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var curExp = ftx.filter(function(t){return t.type==='expense'&&t.catId!=='invest'&&t.catId!=='travel_fund';}).reduce(function(s,t){return s+t.amount;},0);
  var curRate = curInc > 0 ? Math.round(curExp/curInc*100) : 0;

  var accNetSavings = useMemo(function(){
    var lastDayOfBase = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0, 23, 59, 59);
    return txs.filter(function(t) {
      return new Date(t.date) <= lastDayOfBase;
    }).reduce(function(s, t) {
      if (t.type === 'income') return s + t.amount;
      if (t.type === 'expense' && t.catId !== 'invest' && t.catId !== 'travel_fund') return s - t.amount;
      return s;
    }, 0);
  }, [txs, baseDate]);

  var accInv = useMemo(function(){
    var lastDayOfBase = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0, 23, 59, 59);
    return txs.filter(function(t) {
      return new Date(t.date) <= lastDayOfBase;
    }).filter(function(t){
      return t.type==='invest' || t.type==='asset_move' || t.catId==='invest' || t.catId==='travel_fund';
    }).reduce(function(s, t) {
      return s + (t.assetType === 'out' ? -t.amount : t.amount);
    }, 0);
  }, [txs, baseDate]);

  var prvInc = prevFtx.filter(function(t){return t.type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var prvExp = prevFtx.filter(function(t){return t.type==='expense' && t.catId!=='invest' && t.catId!=='travel_fund';}).reduce(function(s,t){return s+t.amount;},0);
  
  function calcMom(cur, prv) {
    if(prv === 0) return cur > 0 ? { pct: 100, up: true } : { zero: true };
    var diff = cur - prv;
    var pct = Math.abs(Math.round((diff / prv) * 100));
    return { pct: pct, up: diff > 0, zero: diff === 0 };
  }
  var momInc = calcMom(curInc, prvInc);
  var momExp = calcMom(curExp, prvExp);

  function moveDate(dir) {
    var nd = new Date(baseDate);
    if (dp === '이번달') nd.setMonth(nd.getMonth() + dir);
    else if (dp === '분기') nd.setMonth(nd.getMonth() + dir * 3);
    else nd.setFullYear(nd.getFullYear() + dir);
    setBaseDate(nd);
  }
  function getDateLabel() {

    if (dp === '분기') return baseDate.getFullYear() + '년 ' + (Math.floor(baseDate.getMonth() / 3) + 1) + '분기';
    return baseDate.getFullYear() + '년';
  }

  var totI = curInc; var totE = curExp; var rate = curRate; var totInv = accInv;
  var exp = ftx.filter(function(t){return t.type==='expense' && t.catId!=='invest' && t.catId!=='travel_fund';});
  var inc = ftx.filter(function(t){return t.type==='income';});
  var byM = MEMBERS.map(function(m){ return Object.assign({},m,{amt:exp.filter(function(t){return t.member===m.id;}).reduce(function(s,t){return s+t.amount;},0)}); });
  var byC = EX_CATS.map(function(c){ return Object.assign({},c,{value:exp.filter(function(t){return t.catId===c.id;}).reduce(function(s,t){return s+t.amount;},0)}); }).filter(function(c){return c.value>0;}).sort(function(a,b){return b.value-a.value;});
  var rec = ftx.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,4);

  var prevExp = useMemo(function(){ return prevFtx.filter(function(t){return t.type==='expense'&&t.catId!=='invest'&&t.catId!=='travel_fund';}); }, [prevFtx]);
  var prevByC = useMemo(function(){

    }).filter(function(c){return c.value>0;});
  }, [prevExp]);

  var pacingGuide = useMemo(function(){

    var currentFinMonth = getFinMonth(now.toISOString(), sd);
    var currentPeriodStart = new Date(currentFinMonth.y, currentFinMonth.m, sd);

    var daysInPrevMonth = Math.round((prevPeriodEnd - prevPeriodStart) / (1000*60*60*24)) + 1;
    var daysInCurMonth = Math.round((currentPeriodEnd - currentPeriodStart) / (1000*60*60*24)) + 1;
    var daysElapsed = Math.max(1, Math.round((now - currentPeriodStart) / (1000*60*60*24)));
    var daysRemaining = Math.max(0, daysInCurMonth - daysElapsed);
    var minFoodBudget = 250000;
    var minTransBudget = 75000;
    var curDailyAvg = curExp / daysElapsed;
    var projectedTotalExpense = curExp + Math.round(curDailyAvg * daysRemaining);

    return {
      period: dp,

      daysElapsed: daysElapsed,

          h('div',{style:{width:38,height:38,borderRadius:'50%',background:C.faint, display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,position:'relative'}},'🔔', h('div',{style:{position:'absolute',top:6,right:6,width:8,height:8, borderRadius:'50%',background:C.red,border:'2px solid '+C.card}}))

      h('div',{style:{display:'flex',gap:6,marginBottom:14}},

      var ty = dt.getFullYear(), tm = dt.getMonth();
      if(dt.getDate() < sd) { tm--; if(tm<0){tm=11; ty--;} }
      return ty === curLY && tm === curLM;
    });
    var monthlyTotI = monthlyIncTxs.reduce(function(s,t){ return s+t.amount; }, 0);

    if(period === '주간') {
      var startDate = new Date(curLY, curLM, sd);
      var endDate = new Date(curLM===11?curLY+1:curLY, curLM===11?0:curLM+1, sd-1);
      var days = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
      return Math.round((monthlyTotI / days) * 7);
    } else if(period === '연간') {
      return inc.reduce(function(s,t){ return s+t.amount; }, 0);
    } else {
      return monthlyTotI;
    }
  }, [txs, period, inc, startDay]);

  var ALL_ANALYSIS_CATS = [{id:'all', name:'전체', icon:'📊', color:'#3D5AFE'}].concat(EX_CATS);

    return exp.filter(function(t){ return t.catId===catId; }).reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemCatTotal(catId, memberId) {
    var filtered = exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);
    });
    return filtered.reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemTxs(catId, memberId) {
    return exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);
    }).sort(function(a,b){ return new Date(b.date)-new Date(a.date); });

    var cx=50, cy=50, R=36, sw=15;
    var total = totE || 1;
    var circumference = 2 * Math.PI * R;
    var offset = 0;
    var slices = EX_CATS.map(function(c){
      var val = exp.filter(function(t){ return t.catId===c.id; }).reduce(function(s,t){ return s+t.amount; },0);
      return {color:c.color, val:val};
    }).filter(function(s){ return s.val>0; });
    if(slices.length===0) {
      return h('svg',{width:90,height:90,viewBox:'0 0 100 100'},
        h('circle',{cx:50,cy:50,r:36,fill:'none',stroke:'#2E2E52',strokeWidth:15}),
        h('text',{x:50,y:47,textAnchor:'middle',fontSize:10,fill:'#8888AA'},'데이터'),
        h('text',{x:50,y:59,textAnchor:'middle',fontSize:10,fill:'#8888AA'},'없음')
      );
    }
    var paths = [];
    slices.forEach(function(s){
      var dash = (s.val/total)*circumference;
      var gap  = circumference - dash;
      paths.push(h('circle',{key:s.color+offset,cx:cx,cy:cy,r:R,fill:'none',stroke:s.color,strokeWidth:sw,
        strokeDasharray:String(dash.toFixed(1))+' '+String(gap.toFixed(1)),
        strokeDashoffset:String(-offset.toFixed(1)),
        transform:'rotate(-90 50 50)'}));
      offset += dash;
    });
    return h('svg',{width:90,height:90,viewBox:'0 0 100 100'},
      h('circle',{cx:cx,cy:cy,r:R,fill:'none',stroke:'#2E2E52',strokeWidth:sw}),
      paths,
      h('text',{x:50,y:46,textAnchor:'middle',fontSize:10,fill:'#F0F0FF',fontWeight:'700'},'총지출'),

  var txs = props.txs;

  var now = new Date();
  var cyState = useState(now.getFullYear()); var calYear = cyState[0]; var setCalYear = cyState[1];

function getHoliday(dateStr) {
  var parts = dateStr.split('-');
  var year = parts[0];
  var mmdd = parts[1] + '-' + parts[2];
  var fixed = KR_HOLIDAYS.fixed[mmdd];
  if (fixed) return fixed;
  var yearly = KR_HOLIDAYS[year];
  if (yearly && yearly[mmdd]) return yearly[mmdd];
  return null;
}

function AuthScreen(props) {

  var mode   = useState('login'); var setMode   = mode[1];   mode   = mode[0];
  var loginId = useState('');     var setLoginId = loginId[1]; loginId = loginId[0];
  var loginPw = useState('');     var setLoginPw = loginPw[1]; loginPw = loginPw[0];
  var sName   = useState('');     var setSName   = sName[1];   sName   = sName[0];

  var errs    = useState({});     var setErrs    = errs[1];    errs    = errs[0];

  function doLogin() {
    var users = lsGet(LS_USERS, []);
    var found = users.find(function(u){ return u.userId === loginId.trim(); });
    if (!found || found.pw !== loginPw) return alert('정보가 올바르지 않습니다.');
    onLogin({userId: found.userId, name: found.name});
  }

  function doSignup() {
    var users = lsGet(LS_USERS, []);
    if (users.some(function(u){return u.userId===sId.trim();})) return alert('중복 아이디');
    var newUser = {userId: sId.trim(), name: sName.trim(), pw: sPw};
    users.push(newUser); lsSet(LS_USERS, users);
    onLogin({userId: newUser.userId, name: newUser.name});
  }

  return h('div', {style:{minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', padding:'20px 24px', background:C.bg}},
    h('div', {style:{textAlign:'center', marginBottom:28}}, h('p', {style:{fontSize:52}}, '👨‍👩‍👧'), h('p', {style:{color:C.text, fontSize:22, fontWeight:900}}, 'FamilyLedger AI')),

    for(var ri=0; ri<rules.length; ri++) {
      for(var ki=0; ki<rules[ri].k.length; ki++) {
        if(st.indexOf(rules[ri].k[ki]) >= 0) return {c:rules[ri].c, s:rules[ri].s};
      }
    }
    if(isMart) return {c:'food',s:'식자재'};
    if(isCVS)  return {c:'other',s:'편의점'};
 
    /* 학습 데이터 참조 */
    var learned = getLearnedCategory(storeName);
    if(learned) return {c:learned.catId, s:learned.subCat};
 
    return {c:'other',s:''};
  }
 
 /* ── CSV/엑셀 파일 읽기 ── */
  function handleFile(e) {
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    setErrMsg('');
    var ext = file.name.split('.').pop().toLowerCase();
    setUploadFileName(file.name);
    if(ext === 'csv' || ext === 'txt') {
      /* CSV 파싱 */
      if(typeof Papa === 'undefined') {
        setErrMsg('CSV 파서가 로딩되지 않았습니다.');
        return;
      }
      Papa.parse(file, {
        header: true,
        encoding: 'UTF-8',
        skipEmptyLines: true,
        complete: function(result) {
          processData(result.data);
        },
        error: function(err) {
          setErrMsg('CSV 읽기 실패: ' + err.message);
        }
      });
    } else if(ext === 'xlsx' || ext === 'xlsm' || ext === 'xls') {
      /* ★ 엑셀 파싱 (SheetJS) */
      if(typeof XLSX === 'undefined') {
        setErrMsg('엑셀 파서가 로딩되지 않았습니다. 페이지를 새로고침 해주세요.');
        return;
      }
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = new Uint8Array(ev.target.result);
          var workbook = XLSX.read(data, {type:'array'});
          var sheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[sheetName];
          var rawRows = XLSX.utils.sheet_to_json(worksheet, {header:1, defval:''});

          /* ★ 신한카드 명세서 자동 감지 및 파싱 */
          var parsed = [];
          var isShinhan = rawRows.some(function(r){ return String(r[0]||'').indexOf('총합계') >= 0 || String(r[1]||'') === '본인'; });

          if(isShinhan) {
            /* 신한카드 포맷: A=일자, B=본인, C=가맹점, D=이용금액, F=내실금액 */
            for(var ri = 0; ri < rawRows.length; ri++) {
              var row = rawRows[ri];
              var cellA = String(row[0] || '').trim();
              var cellB = String(row[1] || '').trim();
              var cellC = String(row[2] || '').trim();
              var cellD = row[3]; /* 이용금액 */
              var cellF = row[5]; /* 내실금액 */

              /* 유효 데이터 행: B열이 '본인'이고 C열(가맹점)이 있는 행 */
              if(cellB !== '본인' || !cellC) continue;
              /* 합계/소계 행 스킵 */
              if(cellC.indexOf('합계') >= 0 || cellC.indexOf('소계') >= 0) continue;

              /* 날짜 변환: 26.03.13 → 2026-03-13 / 25.05.11 → 2025-05-11 */
              var dateStr = '';
              var dm = cellA.match(/^(\d{2})\.(\d{2})\.(\d{2})$/);
              if(dm) {
                var yr = parseInt(dm[1]);
                dateStr = (yr < 50 ? '20' : '19') + dm[1] + '-' + dm[2] + '-' + dm[3];
              } else {
                dateStr = new Date().toISOString().split('T')[0];
              }

              /* 금액: D열(이용금액) 우선, 없으면 F열(내실금액) */
              var rawAmt = cellD ? String(cellD) : String(cellF || '0');
              var amount = Math.abs(parseInt(String(rawAmt).replace(/[^0-9-]/g,'')) || 0);
              if(amount <= 0) {
                /* D열도 F열도 없으면 스킵 */
                var fallback = Math.abs(parseInt(String(cellF || '0').replace(/[^0-9-]/g,'')) || 0);
                if(fallback > 0) amount = fallback; else continue;
              }

              parsed.push({
                store: cellC,
                amount: amount,
                date: dateStr,
                method: '신한카드'
              });
            }
          } else {
            /* 일반 엑셀: 첫 번째 행을 헤더로 사용 */
            if(rawRows.length < 2) { setErrMsg('데이터가 비어있습니다.'); return; }
            var headers = rawRows[0].map(function(h){ return String(h||'').trim(); });
            var storeIdx = headers.findIndex(function(h){ return h.indexOf('가맹점')>=0||h.indexOf('상호')>=0||h.indexOf('이용처')>=0||h.indexOf('매장')>=0; });
            var amtIdx = headers.findIndex(function(h){ return h.indexOf('금액')>=0||h.indexOf('결제')>=0||h.indexOf('이용금액')>=0; });
            var dateIdx = headers.findIndex(function(h){ return h.indexOf('날짜')>=0||h.indexOf('일자')>=0||h.indexOf('일시')>=0; });
            if(storeIdx < 0) storeIdx = 0;
            if(amtIdx < 0) amtIdx = 1;
            if(dateIdx < 0) dateIdx = 2;

            for(var gi = 1; gi < rawRows.length; gi++) {
              var grow = rawRows[gi];
              var gStore = String(grow[storeIdx] || '').trim();
              var gAmt = Math.abs(parseInt(String(grow[amtIdx] || '0').replace(/[^0-9-]/g,'')) || 0);
              var gDate = String(grow[dateIdx] || '').trim().replace(/\./g,'-').replace(/\//g,'-');
              if(gDate.length === 8) gDate = gDate.slice(0,4)+'-'+gDate.slice(4,6)+'-'+gDate.slice(6,8);
              if(!gDate || gDate.length < 10) gDate = new Date().toISOString().split('T')[0];
              if(gAmt > 0 && gStore) {
                parsed.push({ store: gStore, amount: gAmt, date: gDate, method: '카드' });
              }
            }
          }

          if(parsed.length === 0) {
            setErrMsg('유효한 거래 데이터를 찾지 못했습니다.\n엑셀 파일 형식을 확인해주세요.');
            return;
          }

          /* forceCorrect 적용 후 rows 상태에 세팅 */
          var finalRows = parsed.map(function(p, idx) {
            var result = forceCorrect(p.store, p.amount);
            return {
              id: Date.now() + idx,
              store: p.store,
              amount: p.amount,
              date: p.date,
              method: p.method,
              catId: result.c,
              subCat: result.s,
              selected: true,
              saved: false
            };
          });
          setRows(finalRows);
          setStatus('preview');
        } catch(ex) {
          setErrMsg('엑셀 파일 읽기 실패: ' + ex.message);
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      setErrMsg('지원 형식: .csv, .xlsx, .xlsm\n카드사 앱에서 다운로드한 파일을 업로드하세요.');
    }
    e.target.value = '';
  }
 
  /* ── 데이터 처리 + 자동 분류 ── */
  function processData(data) {
    if(!data || data.length === 0) { setErrMsg('데이터가 비어있습니다.'); return; }
    var cols = Object.keys(data[0]);
    var storeCol = cols.find(function(c){return c.indexOf('가맹점')>=0||c.indexOf('상호')>=0||c.indexOf('이용처')>=0||c.indexOf('매장')>=0;}) || cols[0];
    var amtCol = cols.find(function(c){return c.indexOf('금액')>=0||c.indexOf('결제')>=0||c.indexOf('이용금액')>=0;}) || cols[1];
    var dateCol = cols.find(function(c){return c.indexOf('날짜')>=0||c.indexOf('일자')>=0||c.indexOf('일시')>=0||c.indexOf('거래')>=0;}) || cols[2];
    var methodCol = cols.find(function(c){return c.indexOf('카드')>=0||c.indexOf('결제수단')>=0;});
 
    var parsed = data.map(function(row, idx) {
      var store = (row[storeCol] || '').trim();
      var rawAmt = (row[amtCol] || '0').replace(/[^0-9-]/g, '');
      var amount = Math.abs(parseInt(rawAmt) || 0);
      var date = (row[dateCol] || '').trim();
      if(date.length >= 8) {
        date = date.replace(/\./g, '-').replace(/\//g, '-');
        if(date.length === 8) date = date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8);
      }
      if(!date || date.length < 10) date = new Date().toISOString().split('T')[0];
      var method = methodCol ? (row[methodCol] || '카드').trim() : '카드';
      var result = forceCorrect(store, amount);
 
      return {
        id: Date.now() + idx,
        store: store,
        amount: amount,
        date: date,
        method: method,
        catId: result.c,
        subCat: result.s,
        selected: amount > 0,
        saved: false
      };
    }).filter(function(r) { return r.amount > 0 && r.store; });
 
    setRows(parsed);
    setStatus('preview');
  }
 
  /* ── 선택된 항목 일괄 저장 ── */
  function saveAll() {
    var targets = rows.filter(function(r){ return r.selected && !r.saved; });
    if(targets.length === 0) return alert('저장할 항목이 없습니다.');
    setStatus('saving');
    var saved = 0;
    targets.forEach(function(r, idx) {
      setTimeout(function() {
        saveLearnedCategory(r.store, r.catId, r.subCat);
        onAdd({
          id: Date.now() + idx,
          type: 'expense',
          amount: r.amount,
          catId: r.catId,
          subCat: r.subCat,
          store: r.store,
          member: 'dad',
          date: r.date,
          method: r.method,
          source: 'bulk'
        }, false);
        saved++;
        setProgress(Math.round(saved / targets.length * 100));
        if(saved === targets.length) {
          var updatedRows = rows.map(function(row){ return row.selected ? Object.assign({},row,{saved:true}) : row; });
          setRows(updatedRows);
          setStatus('done');
          /* ★ 보관함에 자동 기록 */
          var archive = lsGet(LS_CARD_ARCHIVE, []);
          var cardName = '카드';
          if(uploadFileName.indexOf('신한') >= 0) cardName = '신한카드';
          else if(uploadFileName.indexOf('국민') >= 0 || uploadFileName.indexOf('KB') >= 0) cardName = 'KB국민카드';
          else if(uploadFileName.indexOf('하나') >= 0) cardName = '하나카드';
          else if(uploadFileName.indexOf('우리') >= 0) cardName = '우리카드';
          else if(uploadFileName.indexOf('현대') >= 0) cardName = '현대카드';
          else if(uploadFileName.indexOf('삼성') >= 0) cardName = '삼성카드';
          else if(uploadFileName.indexOf('롯데') >= 0) cardName = '롯데카드';
          else if(uploadFileName.indexOf('NH') >= 0 || uploadFileName.indexOf('농협') >= 0) cardName = 'NH농협카드';
          archive.unshift({
            id: Date.now(),
            uploadDate: new Date().toISOString().split('T')[0],
            cardName: cardName,
            fileName: uploadFileName,
            totalCount: rows.length,
            savedCount: targets.length,
            skippedCount: rows.length - targets.length,
            items: updatedRows.map(function(r){ return {store:r.store, amount:r.amount, date:r.date, catId:r.catId, subCat:r.subCat, method:r.method, saved:r.saved}; })
          });
          lsSet(LS_CARD_ARCHIVE, archive);
        }
      }, idx * 100);
    });
  }

function App() {
  var savedUser = lsGet(LS_USER, null);
  var loggedIn  = useState(!!savedUser);   var setLoggedIn = loggedIn[1];  loggedIn = loggedIn[0];
  var curUser   = useState(savedUser);     var setCurUser  = curUser[1];   curUser  = curUser[0];
  var tab       = useState('dashboard');   var setTab      = tab[1];       tab      = tab[0];

  // ★★★ [뒤로가기 연동] 휴대폰 ◁ 버튼으로 이전 화면 복귀 ★★★
  var isPopNav = useRef(false);

  function navTo(newTab) {
    if (newTab === tab) return;
    history.pushState({ tab: newTab }, '');
    setTab(newTab);
  }

  function navBack() {
    if (history.state && history.state.tab) {
      history.back();
    } else {
      setTab('dashboard');
    }
  }

  useEffect(function() {
    history.replaceState({ tab: 'dashboard' }, '');
    function handlePop(e) {
      if (e.state && e.state.tab) {
        isPopNav.current = true;
        setTab(e.state.tab);
      }
    }
    window.addEventListener('popstate', handlePop);
    return function() { window.removeEventListener('popstate', handlePop); };
  }, []);
  var dpArr = useState('이번달'); var globalDp = dpArr[0]; var setGlobalDp = dpArr[1];
  var baseDateArr = useState(new Date()); var globalBaseDate = baseDateArr[0]; var setGlobalBaseDate = baseDateArr[1];

  var txs       = useState(function(){ return lsGet(LS_TXS, []); });       var setTxs = txs[1]; txs = txs[0];
  var cards     = useState(function(){ return lsGet(LS_CARDS, INIT_CARDS); }); var setCards = cards[1]; cards = cards[0];

  }, []);

      var t = txs[di];
      var oldStore = (t.store || '').replace(/\s/g,'').toLowerCase();
      if(t.amount === tx.amount && t.date === tx.date && t.member === tx.member && (newStore === oldStore || newStore.indexOf(oldStore) >= 0 || oldStore.indexOf(newStore) >= 0)) {
        dupFound = t; break;
      }
    }
    if(dupFound) { setPendingTx({tx: tx, isFixed: isFixed}); setDupModal(dupFound); } 
    else { doSaveTx(tx, isFixed); }
  }

  function updTx(u) { if(fbDb){ fbSaveTx(u); } else { setTxs(function(p){ var n=p.map(function(t){return t.id===u.id?u:t;}); lsSet(LS_TXS,n); return n; }); } }
  function delTx(id) { if(fbDb){ fbDelTx(id); } else { setTxs(function(p){ var n=p.filter(function(t){return t.id!==id;}); lsSet(LS_TXS,n); return n; }); } }
  function bulkDel(ids) { ids.forEach(function(id){ delTx(id); }); }

  if(!loggedIn) return h(AuthScreen, {onLogin: function(u){ lsSet(LS_USER,u); setCurUser(u); setLoggedIn(true); }});

  return h('div', {style:{ background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'Pretendard', sans-serif", maxWidth:430, margin:'0 auto', position:'relative' }},
    tab==='dashboard' && h(Dashboard,  {txs:txs, onNav:navTo, startDay:startDay, onAdd:addTx, onDelete:delTx, dp:globalDp, setDp:setGlobalDp, baseDate:globalBaseDate, setBaseDate:setGlobalBaseDate}),
    tab==='calendar'  && h(CalendarView, {txs:txs, startDay:startDay}),
    tab==='analysis'  && h(Analysis,   {txs:txs, startDay:startDay, dp:globalDp, baseDate:globalBaseDate}),
    tab==='add'       && h(AddMenu,    {onAdd:addTx, onClose:navBack, cards:cards, fixedList:fixedExps, onDeleteFixed:delTx}),
    tab==='list'      && h(TxList,     {txs:txs, onUpdate:updTx, onDelete:delTx, onBulkDelete:bulkDel}),
    tab==='settings'  && h(Settings,   {txs:txs, onLogout:function(){lsDel(LS_USER); setLoggedIn(false);}, curUser:curUser, startDay:startDay, setStartDay:setStartDay}),
    h(BNav, {active:tab, onTab:navTo}),
    dupModal && h(DuplicateModal, {
      dupTx: dupModal, 
      newTx: pendingTx.tx, 
      onCancel: function(){ setDupModal(null); setPendingTx(null); },
      onForce: function(){ doSaveTx(pendingTx.tx, pendingTx.isFixed, '중복 항목을 강제 저장했습니다'); setDupModal(null); setPendingTx(null); }
    }),
    toast && h(Toast, {message:toast, onHide:function(){setToast(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
});
</script>
</body>
</html>
