function getFinMonth(dateStr, sDay) {
  var d = new Date(dateStr);
  var y = d.getFullYear();
  var m = d.getMonth();
  // 거래 날짜가 시작일보다 작으면, 가계부상으로는 아직 '저번 달'임!
  if (d.getDate() < sDay) {
    m--;
    if (m < 0) { m = 11; y--; }
  }
  return { y: y, m: m };
}

function fDash(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  var curY = nowFm.y;
  var curM = nowFm.m;
  var curQ = Math.floor(curM / 3);

  if (p === '이번달') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === curY && fm.m === curM; });
  }
  if (p === '이번분기') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); var tQ = Math.floor(fm.m / 3); return fm.y === curY && tQ === curQ; });
  }
  // '올해'
  return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === curY; });
}

function fPeriod(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  
  if (p === '주간') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6); weekAgo.setHours(0,0,0,0);
    return txs.filter(function(t) { return new Date(t.date) >= weekAgo; });
  }
  if (p === '월간') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y && fm.m === nowFm.m; });
  }

// ★ [리디자인] DonutChart — 2026 Glassmorphism + Neon Glow 3D 도넛 차트
function DonutChart(props) {
  var data = props.data || [];
  var size = props.size || 110;
  var totalLabel = props.totalLabel || null;

  if (!data.length) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background:'radial-gradient(circle, #1C2541, #0A0E1A)',
    boxShadow:'0 0 20px rgba(0,229,255,0.1)'
  }});

  var total = data.reduce(function(s,d){return s+d.value;},0);
  if (!total) return h('div',{style:{
    width:size, height:size, borderRadius:'50%',
    background:'radial-gradient(circle, #1C2541, #0A0E1A)'
  }});

  var cx = size/2, cy = size/2;
  var R = size/2 * 0.82, r = size/2 * 0.50;
  var angle = -Math.PI/2;
  var paths = [], glowFilters = [];

  // 네온 그라데이션 팔레트
  var neonPalette = [
    ['#FF6B6B','#FF007C'], ['#00E5FF','#536DFE'], ['#FFD600','#FF9800'],
    ['#69F0AE','#00BFA5'], ['#CE93D8','#7C3AED'], ['#FF8A65','#FF5252']
  ];

  data.forEach(function(d,i){
    var slice = (d.value/total)*2*Math.PI;
    if(slice < 0.01){ angle += slice; return; }

    var x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
    var x2=cx+R*Math.cos(angle+slice), y2=cy+R*Math.sin(angle+slice);
    var xi1=cx+r*Math.cos(angle+slice), yi1=cy+r*Math.sin(angle+slice);
    var xi2=cx+r*Math.cos(angle), yi2=cy+r*Math.sin(angle);
    var lg = slice > Math.PI ? 1 : 0;

    var gradId = 'ng'+i, pal = neonPalette[i % neonPalette.length];

    glowFilters.push(
      h('defs', {key:'def'+i},
        h('linearGradient', {
          key: gradId, id: gradId,
          x1: '0%', y1: '0%', x2: '100%', y2: '100%'
        },
          h('stop', {offset:'0%', stopColor: pal[0]}),
          h('stop', {offset:'100%', stopColor: pal[1]})
        )
      )
    );

    // 글로우 + 메인 슬라이스
    paths.push(
      h('path', {
        key:'g'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')', opacity:'0.3',
        style:{filter:'blur(3px)'}
      }),
      h('path', {
        key:'p'+i,
        d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
        fill: 'url(#'+gradId+')',
        stroke: 'rgba(255,255,255,0.1)',
        strokeWidth: 1
      })
    );
    angle += slice;
  });

  return h('div', {style:{position:'relative', width:size, height:size}},
    h('svg', {
      width:size, height:size, viewBox:'0 0 '+size+' '+size,
      style:{filter:'drop-shadow(0 4px 16px rgba(0,0,0,0.5))'}
    },
      glowFilters, paths,
      h('circle', {
        cx:cx, cy:cy, r:r-2,
        fill:'rgba(10,14,26,0.9)',
        stroke:'rgba(255,255,255,0.1)',
        strokeWidth:1
      }),
      totalLabel && h('text', {
        x:cx, y:cy-4, textAnchor:'middle',
        fontSize:9, fill:'rgba(255,255,255,0.6)',
        fontWeight:'600'
      }, '총지출'),
      totalLabel && h('text', {
        x:cx, y:cy+6, textAnchor:'middle',
        fontSize:12, fill:'#ffffff',
        fontWeight:'800'
      }, totalLabel)
    )
  );
}


function LineChartSVG(props) {
  var data = props.data || [];
  var height = props.height || 140;
  var w=320, pL=38, pR=10, pT=14, pB=24;
  var iw=w-pL-pR, ih=height-pT-pB;
  if(data.length<2) return h('div',{style:{height:height,display:'flex',alignItems:'center',justifyContent:'center'}},
    h('span',{style:{color:C.muted,fontSize:12}},'데이터 없음'));
  var maxE = Math.max.apply(null,data.map(function(d){return d.expense;}));
  var maxI = data[0].income ? Math.max.apply(null,data.map(function(d){return d.income||0;})) : maxE;
  var maxV = Math.max(maxE,maxI,1);
  function px(i){ return pL+i*(iw/(data.length-1)); }
  function pyE(v){ return pT+ih-(v/maxV)*ih; }
  function pyI(v){ return pT+ih-(v/maxV)*ih; }
  var ePts = data.map(function(d,i){return px(i)+','+pyE(d.expense);}).join(' ');
  var iPts = data[0].income ? data.map(function(d,i){return px(i)+','+pyI(d.income);}).join(' ') : null;
  return h('svg',{viewBox:'0 0 '+w+' '+height,width:'100%',height:height},
    [0,0.5,1].map(function(f,i){
      return h('line',{key:'g'+i,x1:pL,y1:pT+ih*f,x2:w-pR,y2:pT+ih*f,stroke:C.border,strokeDasharray:'4 4'});
    }),
    [maxV,maxV*0.5,0].map(function(v,i){
      return h('text',{key:'y'+i,x:pL-4,y:pT+ih*(i*0.5)+4,textAnchor:'end',fontSize:9,fill:C.muted},(v/10000).toFixed(0)+'만');
    }),
    data.map(function(d,i){
      return h('text',{key:'x'+i,x:px(i),y:height-4,textAnchor:'middle',fontSize:10,fill:C.muted},d.month);
    }),
    iPts && h('polyline',{points:iPts,fill:'none',stroke:C.green,strokeWidth:2.5,strokeLinejoin:'round'}),
    h('polyline',{points:ePts,fill:'none',stroke:C.red,strokeWidth:2.5,strokeLinejoin:'round'}),
    data.map(function(d,i){return h('circle',{key:'ec'+i,cx:px(i),cy:pyE(d.expense),r:4,fill:C.red});}),
    iPts && data.map(function(d,i){return h('circle',{key:'ic'+i,cx:px(i),cy:pyI(d.income||0),r:4,fill:C.green});})
  );
}

function SavingsModal(props) {
  var onClose = props.onClose;

  var totE = exp.reduce(function(s,t){return s+t.amount;},0);
  var byCat = {};
  exp.forEach(function(t){byCat[t.catId]=(byCat[t.catId]||0)+t.amount;});
  var tips = [
    {icon:'☕',cat:'food',  base:0.28,label:'식비 28% 이하 목표'},
    {icon:'🛒',cat:'shop',  base:0.20,label:'쇼핑 20% 이하 목표'},
    {icon:'📱',cat:'comm',  base:0.05,label:'통신비 5% 이하 목표'},
    {icon:'🎬',cat:'culture',base:0.08,label:'문화생활 8% 이하 목표'}
  ];
  var annual = 0;
  var rows = tips.map(function(tip){
    var curr = byCat[tip.cat]||0;
    var tgt = totE*tip.base;
    var save = Math.max(Math.round(curr-tgt),0);
    annual += save*12;
    return {icon:tip.icon,label:tip.label,curr:curr,tgt:tgt,save:save};
  }).filter(function(r){return r.save>0;});
  return h(Sheet,{title:'🤖 AI 절약 제안',onClose:onClose},
    h('div',{style:{padding:'12px',background:C.green+'15',borderRadius:12,textAlign:'center',marginBottom:14}},

      h('p',{style:{color:C.green,fontSize:24,fontWeight:900,margin:0}},fmt(annual))
    ),
    rows.length===0
      ? h('p',{style:{color:C.muted,textAlign:'center',padding:'20px 0'}},'현재 지출 패턴이 양호합니다 👍')

            h('span',{style:{fontSize:24,flexShrink:0}},r.icon),
            h('div',{style:{flex:1}},
              h('p',{style:{color:C.text,fontSize:13,fontWeight:600,margin:'0 0 3px'}},r.label),
              h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
                h('span',{style:{color:C.red,fontSize:11}},'현재 '+fmt(r.curr)),

                h('span',{style:{color:C.green,fontSize:11}},'목표 '+fmt(r.tgt))
              )
            ),
            h('span',{style:{color:C.green,fontSize:13,fontWeight:800,flexShrink:0}},'+'+fmtS(r.save)+'/월')
          );
        })

}

// ★§3 수정: Gemini OCR — 구글 최신 세대(gemini-2.5-flash) 완벽 적용 ★
var LS_GEMINI = 'flai_gemini_key';

/* ★추가: AI 음성 및 텍스트 분석용 함수 (재무분석 & 음성인식에 사용) */
function callGeminiText(promptText, apiKey, callback) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: promptText }],
    temperature: 0.3,
    max_tokens: 2000
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 30000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var data = JSON.parse(xhr.responseText);
        var text = data.choices[0].message.content;
        callback(null, text);
      } catch(e) { callback('응답 해석 실패', null); }
    } else {
      var em = 'HTTP ' + xhr.status;
      try { var ed=JSON.parse(xhr.responseText); if(ed.error) em=ed.error.message||em; } catch(e2){}
      callback(em, null);
    }
  };
  xhr.onerror = function() { callback('네트워크 오류', null); };
  xhr.ontimeout = function() { callback('요청 시간 초과', null); };
  xhr.send(body);
}
// --- [여기를 복사해서 callGeminiOCR 바로 위에 붙여넣으세요] ---
async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        // [중요] 파일이 없으면 그냥 원래 있던 base64라도 돌려주게 만들었어요
        if (!file) { resolve(null); return; } 

        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                // 너비를 800으로 더 줄여볼게요 (그럼 진짜 번개처럼 빨라져요!)
                let w = 800; 
                let h = Math.round((img.height * w) / img.width);
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                // 화질을 0.5(50%)로 더 낮춰서 용량을 확 줄입니다.
                resolve(canvas.toDataURL('image/jpeg', 0.5).split(',')[1]);
            };
        };
    });
}

  // 키가 문자열 "null"이거나 공백일 경우 초기화하여 팝업 유도
  if (googleKey === 'null' || googleKey === 'undefined') googleKey = '';
  if (openRouterKey === 'null' || openRouterKey === 'undefined') openRouterKey = '';

  /* ── 2. 팝업 강제 출력 로직 (키가 하나라도 없으면 실행) ── */
  if (!googleKey || !openRouterKey) {
    var input = prompt(
      '📷 [영수증 AI] 2중 백업 키 설정이 필요합니다.\n\n' +
      '형식: 제미나이키, 오픈라우터키\n' +
      '(반드시 쉼표 ","로 구분해서 넣어주세요)\n\n' +
      '현재 상태:\n' +
      '- Gemini: ' + (googleKey ? '✅' : '❌ 미등록') + '\n' +
      '- OpenRouter: ' + (openRouterKey ? '✅' : '❌ 미등록')
    );

    if (input && input.includes(',')) {
      var keys = input.split(',');
      googleKey = keys[0].trim();
      openRouterKey = keys[1].trim();

      if (googleKey) lsSet('flai_google_gemini_key', googleKey);
      if (openRouterKey) lsSet('flai_openrouter_api_key', openRouterKey);
      alert('API 키 설정이 완료되었습니다. 분석을 다시 시작합니다.');
    } else {
      // 키 입력을 취소했거나 잘못 입력했을 때
      if (!googleKey) {
        callback('Gemini 키가 등록되지 않아 분석을 중단합니다.', null);
        return;
      }
    }
  }

  /* ── 3. 순차 분석 엔진 (Fallback) ── */
  var providers = [
    { name: 'Gemini', type: 'google', url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent?key=' + googleKey },
    { name: 'Groq', type: 'groq', url: 'https://api.groq.com/openai/v1/chat/completions', key: groqKey },
    { name: 'OpenRouter', type: 'openrouter', url: 'https://openrouter.ai/api/v1/chat/completions', key: openRouterKey }
  ];

  function startOCR(index) {
    if (index >= providers.length) {
      callback('모든 백업 AI(Gemini/Groq/OpenRouter)가 응답하지 않습니다.', null);
      return;
    }

    var p = providers[index];
    if (p.type !== 'google' && !p.key) { startOCR(index + 1); return; }

    var xhr = new XMLHttpRequest();
    xhr.open('POST', p.url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    if (p.key) xhr.setRequestHeader('Authorization', 'Bearer ' + p.key);
    xhr.timeout = 30000;

    var prompt_text = '이 영수증에서 상호(store_name), 합계(amount), 날짜(date:YYYY-MM-DD), 카테고리(category:food,health,trans,shop,edu,other)를 JSON으로만 추출해.';

    var body = (p.type === 'google') ? 
      JSON.stringify({ contents: [{ parts: [{ text: prompt_text }, { inline_data: { mime_type: mimeType || 'image/jpeg', data: base64Image } }] }], generationConfig: { responseMimeType: "application/json" } }) :
      JSON.stringify({ model: p.type === 'groq' ? "llama-3.2-11b-vision-preview" : "openai/gpt-4o-mini", messages: [{ role: "user", content: [{ type: "text", text: prompt_text }, { type: "image_url", image_url: { url: "data:" + (mimeType || 'image/jpeg') + ";base64," + base64Image } }] }], response_format: { type: "json_object" } });

    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var res = JSON.parse(xhr.responseText);
          var out = (p.type === 'google') ? res.candidates[0].content.parts[0].text : res.choices[0].message.content;
          callback(null, JSON.parse(out.substring(out.indexOf('{'), out.lastIndexOf('}') + 1)));
        } catch (e) { startOCR(index + 1); }
      } else {
        startOCR(index + 1); // 에러 발생 시 다음 순위로 자동 전환
      }
    };
    xhr.onerror = function() { startOCR(index + 1); };
    xhr.send(body);
  }

  startOCR(0); // 분석 시작
}

function testGeminiKey(apiKey, onResult) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: 'hi' }],
    max_tokens: 10
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 15000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var d=JSON.parse(xhr.responseText);
        if(d.choices && d.choices[0]) onResult('success','');
        else onResult('error','알 수 없는 응답');
      } catch(e){ onResult('error','응답 파싱 오류'); }
    } else {
      var em='HTTP '+xhr.status;
      try{var ed=JSON.parse(xhr.responseText);if(ed.error)em=ed.error.message;}catch(e2){}
      onResult('error', em);
    }
  };
  xhr.onerror = function() { onResult('cors',''); };
  xhr.ontimeout = function() { onResult('error','요청 시간 초과'); };
  xhr.send(body);
}

/* ★수정: 영수증 다중 등록 + 일괄 파싱 시스템 (완전 재설계) */
function ReceiptIn(props) {
  var onAdd  = props.onAdd;
  var onBack = props.onBack;

  /*
   * items 배열 각 아이템 구조:
   * { id, imgSrc, mimeType, b64, status, store, amount, date, catId, subCat, member, err, editing }
   * status: 'registered' → 'analyzing' → 'parsed' → 'saved'  (또는 'error')
   */
  var items     = useState([]);    var setItems     = items[1];     items     = items[0];
  var analyzing = useState(false); var setAnalyzing = analyzing[1]; analyzing = analyzing[0];
  var progress  = useState(0);     var setProgress  = progress[1];  progress  = progress[0];

  var fileRef = useRef(null);
  var camRef  = useRef(null);

  var apiKey = lsGet(LS_GEMINI, '');

  /* ── 사진 등록 (파싱 없이 리스트에 추가만) ── */
  function handleFiles(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var fileArr = Array.from(files).slice(0, 10);

    fileArr.forEach(function(file) {
      var mime = file.type || 'image/jpeg';
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        var b64 = dataUrl.split(',')[1];
        var newItem = {
          id: Date.now() + Math.random(),
          imgSrc: dataUrl,
          mimeType: mime,
          b64: b64,
          status: 'registered',
          store: '',
          amount: '',
          date: new Date().toISOString().split('T')[0],
          catId: 'food',
          subCat: '',
          member: 'mom',
          err: '',
          editing: false
        };
        setItems(function(prev) { return prev.concat([newItem]); });
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  /* ── 개별 아이템 상태 업데이트 ── */
  function updateItem(id, changes) {
    setItems(function(prev) {
      return prev.map(function(item) {
        if (item.id === id) return Object.assign({}, item, changes);
        return item;
      });
    });
  }

  /* ── 아이템 삭제 ── */
  function removeItem(id) {
    setItems(function(prev) {
      return prev.filter(function(item) { return item.id !== id; });
    });
  }

  /* ── [분석 시작] 전체 순차 파싱 (화면 복구 및 속도 업그레이드 버전) ── */
function startAnalyzeAll() {
  if (!apiKey) { alert('설정에서 AI API 키를 먼저 등록해주세요!'); return; }

  var targets = items.filter(function(item) {
    return item.status === 'registered' || item.status === 'error';
  });

  if (targets.length === 0) { alert('분석할 사진이 없습니다.'); return; }

  setAnalyzing(true);
  setProgress(0);

  var idx = 0;

  // 마법의 async 단어가 여기 들어있어요!
  async function processNext() {
    if (idx >= targets.length) {
      setAnalyzing(false);
      return;
    }

    var target = targets[idx];
    
    // [1단계] 진짜 사진 파일을 찾아내는 줄 (속도의 핵심)
    if (!target.file && target.el && target.el.files) {
      target.file = target.el.files[0];
    }

    updateItem(target.id, { status: 'analyzing' });
    setProgress(idx + 1);

    // [2단계] 사진 압축하기 (실패해도 멈추지 않게 보험을 들었어요)
    let finalImage = target.b64; 
    try {
      if (target.file) {
        // 압축기(Canvas)를 돌려서 아주 가볍게 만들어요
        finalImage = await compressImage(target.file);
      }
    } catch (e) {
      console.log("압축 실패: 원래 사진으로 보낼게요.");
      finalImage = target.b64;
    }

    // [3단계] 로봇(AI)에게 전달하기
    callGeminiOCR(finalImage, target.mimeType, apiKey, function(err, result) {
      if (err) {
        updateItem(target.id, { status: 'error', err: err });
      } else {
        updateItem(target.id, {
          status: 'parsed',
          store: result.store_name || '',
          amount: result.amount ? String(result.amount) : '',
          catId: result.category || 'food',
          subCat: result.sub_category || '',
          date: (result.date && result.date.length === 10) ? result.date : new Date().toISOString().split('T')[0],
          err: ''
        });
      }
      idx++;
      setTimeout(processNext, 500); // 다음 영수증 분석하러 가기!
    });
  }

  // 진짜로 시작하는 버튼!
  processNext();
}

  /* ── 개별 [등록] → 지출내역 저장 ── */

    if (!item.amount || parseInt(item.amount) <= 0) {

      id: Date.now(),

      date: item.date,
      method: '카드',
      source: 'receipt'
    }, false);
    updateItem(item.id, { status: 'saved' });
  }

  /* ── 상태별 카운트 ── */
  var countReg   = items.filter(function(i){ return i.status==='registered'; }).length;
  var countDone  = items.filter(function(i){ return i.status==='parsed'; }).length;
  var countSaved = items.filter(function(i){ return i.status==='saved'; }).length;
  var countErr   = items.filter(function(i){ return i.status==='error'; }).length;

  /* ══════════════════════════════════════════ */
  /* ★★★ 화면 렌더링 ★★★                      */
  /* ══════════════════════════════════════════ */

    h('input', {ref:camRef, type:'file', accept:'image/*', capture:'environment', multiple:true, onChange:handleFiles, className:'hidden-file'}),

        ),

/* ★수정: 문자 파싱(SMSIn)에 소분류(subCat) 파싱 및 UI 적용 */
function SMSIn(props) {
  var onAdd = props.onAdd;
  var onBack = props.onBack;
  var sms    = useState('');    var setSms    = sms[1];    sms    = sms[0];
  var result = useState(null);  var setResult = result[1]; result = result[0];
  var errMsg = useState('');    var setErrMsg = errMsg[1]; errMsg = errMsg[0];
  var member = useState('dad'); var setMember = member[1]; member = member[0];

  function parseSMS() {
    var text = sms.trim();
    if(!text) { setErrMsg('문자 내용을 입력해주세요'); return; }
    var apiKey = lsGet(LS_GEMINI, '');
    if(!apiKey) { setErrMsg('설정에서 Gemini API 키를 먼저 등록해주세요!'); return; }

    setErrMsg('🤖 AI가 문자 내용을 분석 중입니다...');
    /* ★수정: 소분류까지 추출하도록 프롬프트 변경 */
    var prompt = "다음은 카드 결제 문자야. 여기서 정보를 추출해서 반드시 JSON 형식만 출력해.\n" +
                 "형식: {\"bank\":\"카드사명\", \"amount\":숫자, \"store\":\"상호명\", \"date\":\"YYYY-MM-DD\", \"category\":\"대분류(food/trans 등)\", \"sub_category\":\"소분류명(외식/택시/온라인 등)\"}\n" +
                 "문자내용:\n" + text;

    callGeminiText(prompt, apiKey, function(err, res) {
      if(err) { setErrMsg('AI 분석 실패: ' + err); return; }
      try {
        var cleanJson = res.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
        var data = JSON.parse(cleanJson);
        if(!data.amount || data.amount === 0) { setErrMsg('결제 금액을 찾을 수 없습니다.'); return; }

        setResult({
          bank: data.bank || '카드', amount: data.amount, store: data.store || '미확인 가맹점',
          catId: data.category || 'other',
          subCat: data.sub_category || '', /* ★소분류 AI 데이터 매핑 */
          member: member, date: data.date || new Date().toISOString().split('T')[0]
        });
        setErrMsg('');
      } catch(e) { setErrMsg('문자 형식을 이해하지 못했습니다. 수동으로 입력해주세요.'); }
    });
  }
  var editRes = useState(null); var setEditRes = editRes[1]; editRes = editRes[0];
  useEffect(function(){ if(result) setEditRes(Object.assign({},result)); }, [result]);
  
  return h('div',{style:{padding:'0 16px 90px'}},
    h(Hdr,{title:'결제 문자 파싱',onBack:onBack}),
    !result ? h('div',null,
          h(GCard,{style:{marginBottom:12}},
            h('p',{style:{color:C.muted,fontSize:12,margin:'0 0 8px'}},'카드사 결제 알림 문자를 아래에 붙여넣으세요'),
            h('textarea',{ value:sms, onChange:function(e){setSms(e.target.value);setErrMsg('');}, placeholder:'예시:\n[신한카드] 87,300원 승인\n홍길동님 이마트 성수점\n\n문자 앱에서 복사하여 붙여넣으세요', style:{width:'100%',minHeight:110,background:C.bg,border:'1px solid '+C.border,borderRadius:10,color:C.text,fontSize:13,padding:12,resize:'none',outline:'none'}} )
          ),
          errMsg && h('div',{style:{background:C.red+'15',border:'1px solid '+C.red+'44',borderRadius:10,padding:'10px 14px',marginBottom:12}}, h('p',{style:{color:C.red,fontSize:12,margin:0,whiteSpace:'pre-line'}},errMsg) ),
          h('button',{onClick:parseSMS, style:{width:'100%',padding:16,borderRadius:12,border:'none',cursor:'pointer', background:'linear-gradient(135deg,'+C.accent+',#536DFE)',color:'#fff',fontSize:15,fontWeight:700}}, '🔍 자동 파싱하기')
        )
      : editRes && h('div',null,
          h(GCard,{style:{border:'1px solid '+C.green+'44',marginBottom:14}},
            h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:12}}, h('span',{style:{color:C.green,fontSize:18}},'✅'), h('p',{style:{color:C.green,fontSize:13,fontWeight:700,margin:0}},'확인 후 저장하세요'), h(Bdg,{text:result.bank,color:C.green}) ),
            h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 4px'}},'상호명'),
            h('input',{value:editRes.store,onChange:function(e){setEditRes(Object.assign({},editRes,{store:e.target.value}));}, style:{width:'100%',padding:'8px 12px',borderRadius:8,background:C.faint,border:'1px solid '+C.border,color:C.text,fontSize:13,marginBottom:10,outline:'none'}}),
            h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 4px'}},'금액'),
            h('input',{value:String(editRes.amount),onChange:function(e){setEditRes(Object.assign({},editRes,{amount:parseInt(e.target.value.replace(/\D/g,''))||0}));}, type:'tel', style:{width:'100%',padding:'8px 12px',borderRadius:8,background:C.faint,border:'1px solid '+C.border,color:C.red,fontSize:20,fontWeight:800,marginBottom:10,outline:'none'}}),
            h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 6px'}},'카테고리'),
            h('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginBottom:10}},
              EX_CATS.map(function(c){
                return h('button',{key:c.id,onClick:function(){setEditRes(Object.assign({},editRes,{catId:c.id, subCat:''}));},
                  style:{padding:'5px 10px',borderRadius:16,border:'none',cursor:'pointer', background:editRes.catId===c.id?c.color+'44':C.faint, color:editRes.catId===c.id?c.color:C.muted,fontSize:12}}, c.icon+' '+c.name);
              })
            ),
            /* ★ 소분류 화면 노출 부분 추가 */
            (editRes.catId && SUB_CATS[editRes.catId]) && h('div', {style:{marginBottom:10, padding:'8px', background:C.card2, borderRadius:8, border:'1px dashed '+getCat(editRes.catId).color+'66'}},
              h('p',{style:{color:getCat(editRes.catId).color, fontSize:10, fontWeight:700, margin:'0 0 6px'}}, '📌 세부 항목'),
              h('div',{style:{display:'flex', flexWrap:'wrap', gap:4}},
                SUB_CATS[editRes.catId].map(function(sub){
                  var isSel = editRes.subCat === sub;
                  return h('button',{key:sub, onClick:function(){setEditRes(Object.assign({},editRes,{subCat: isSel ? '' : sub}));},
                    style:{padding:'4px 10px', borderRadius:16, cursor:'pointer', border:'none', background: isSel ? getCat(editRes.catId).color : C.faint, color: isSel ? '#fff' : C.muted, fontSize:11, fontWeight:isSel?700:400 }}, sub);
                })
              )
            ),
            h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 6px'}},'구성원'),
            h('div',{style:{display:'flex',gap:8}},
              MEMBERS.map(function(m){
                return h('button',{key:m.id,onClick:function(){setEditRes(Object.assign({},editRes,{member:m.id}));},
                  style:{flex:1,padding:'8px 4px',borderRadius:10,border:'none',cursor:'pointer', background:editRes.member===m.id?m.color+'33':C.faint, outline:editRes.member===m.id?'2px solid '+m.color:'none', display:'flex',flexDirection:'column',alignItems:'center',gap:2}}, h('span',{style:{fontSize:18}},m.emoji), h('span',{style:{color:editRes.member===m.id?m.color:C.muted,fontSize:10}},m.name) );
              })
            )
          ),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
            h('button',{onClick:function(){setResult(null);setSms('');}, style:{padding:14,borderRadius:12,border:'1px solid '+C.border,background:C.card2,color:C.muted,fontSize:14,fontWeight:700,cursor:'pointer'}},'다시 입력'),
            h('button',{onClick:function(){
                if(!editRes.amount) return;
                onAdd({id:Date.now(),type:'expense',amount:editRes.amount,catId:editRes.catId, subCat:editRes.subCat, store:editRes.store,member:editRes.member, date:new Date().toISOString().split('T')[0],method:result.bank,source:'sms'}, false);

function Analysis(props) {
  var txs = props.txs;
  var period   = useState('월간'); var setPeriod  = period[1];   period   = period[0];
  var selCat   = useState(null);   var setSelCat  = selCat[1];   selCat   = selCat[0];
  var selMem   = useState(0);      var setSelMem  = selMem[1];   selMem   = selMem[0];
  var budget   = useState(function(){ return lsGet(LS_BUDGET, 0); });
  var setBudget = budget[1]; budget = budget[0];
  var editBudget = useState(false); var setEditBudget = editBudget[1]; editBudget = editBudget[0];
  var budgetInput = useState(String(budget||'')); var setBudgetInput = budgetInput[1]; budgetInput = budgetInput[0];
  var memViewMode = useState('sub'); var setMemViewMode = memViewMode[1]; memViewMode = memViewMode[0];
  var ftx = useMemo(function(){ return fPeriod(txs, period); }, [txs, period]);
  var exp = ftx.filter(function(t){ return t.type==='expense' && t.catId!=='invest' && t.catId!=='travel_fund'; });
  var inc = ftx.filter(function(t){ return t.type==='income'; });
  var totE = exp.reduce(function(s,t){ return s+t.amount; }, 0);
  
  var totI = useMemo(function(){
    var now = new Date();
    var curLY = now.getFullYear(), curLM = now.getMonth();
    if(now.getDate() < 10) { curLM--; if(curLM<0){curLM=11; curLY--;} }
    
    var monthlyIncTxs = txs.filter(function(t){
      if(t.type !== 'income') return false;
      var d = new Date(t.date);
      var ty = d.getFullYear(), tm = d.getMonth();
      if(d.getDate() < 10) { tm--; if(tm<0){tm=11; ty--;} }
      return ty === curLY && tm === curLM;
    });
    var monthlyTotI = monthlyIncTxs.reduce(function(s,t){ return s+t.amount; }, 0);

    if(period === '주간') {
      var startDate = new Date(curLY, curLM, 10);
      var endDate = new Date(curLM===11?curLY+1:curLY, curLM===11?0:curLM+1, 9);
      var days = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
      return Math.round((monthlyTotI / days) * 7);
    } else if(period === '연간') {
      return inc.reduce(function(s,t){ return s+t.amount; }, 0);
    } else {
      return monthlyTotI;
    }
  }, [txs, period, inc]);
  var ALL_ANALYSIS_CATS = [{id:'all', name:'전체', icon:'📊', color:'#3D5AFE'}].concat(EX_CATS);
  function getCatTotal(catId) {
    if(catId === 'all') return totE;
    return exp.filter(function(t){ return t.catId===catId; }).reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemCatTotal(catId, memberId) {
    var filtered = exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);
    });
    return filtered.reduce(function(s,t){ return s+t.amount; }, 0);
  }
  function getMemTxs(catId, memberId) {
    return exp.filter(function(t){
      return t.member===memberId && (catId==='all' || t.catId===catId);
    }).sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  }
  function buildDonut() {
    var cx=50, cy=50, R=36, sw=15;
    var total = totE || 1;
    var circumference = 2 * Math.PI * R;
    var offset = 0;
    var slices = EX_CATS.map(function(c){
      var val = exp.filter(function(t){ return t.catId===c.id; }).reduce(function(s,t){ return s+t.amount; },0);
      return {color:c.color, val:val};
    }).filter(function(s){ return s.val>0; });
    if(slices.length===0) {
      return h('svg',{width:90,height:90,viewBox:'0 0 100 100'},
        h('circle',{cx:50,cy:50,r:36,fill:'none',stroke:'#2E2E52',strokeWidth:15}),
        h('text',{x:50,y:47,textAnchor:'middle',fontSize:10,fill:'#8888AA'},'데이터'),
        h('text',{x:50,y:59,textAnchor:'middle',fontSize:10,fill:'#8888AA'},'없음')
      );
    }
    var paths = [];
    slices.forEach(function(s){
      var dash = (s.val/total)*circumference;
      var gap  = circumference - dash;
      paths.push(h('circle',{key:s.color+offset,cx:cx,cy:cy,r:R,fill:'none',stroke:s.color,strokeWidth:sw,
        strokeDasharray:String(dash.toFixed(1))+' '+String(gap.toFixed(1)),
        strokeDashoffset:String(-offset.toFixed(1)),
        transform:'rotate(-90 50 50)'}));
      offset += dash;
    });
    return h('svg',{width:90,height:90,viewBox:'0 0 100 100'},
      h('circle',{cx:cx,cy:cy,r:R,fill:'none',stroke:'#2E2E52',strokeWidth:sw}),
      paths,
      h('text',{x:50,y:46,textAnchor:'middle',fontSize:10,fill:'#F0F0FF',fontWeight:'700'},'총지출'),
      h('text',{x:50,y:58,textAnchor:'middle',fontSize:10,fill:'#8888AA'},fmtS(totE))
    );
  }
  var pLabel = period==='주간'?'이번 주':period==='월간'?'이번 달':'올해';
  var budgetPct = budget>0 ? Math.min(Math.round(totE/budget*100),100) : 0;

function TxList(props) {
  var txs = props.txs;

  var search  = useState('');    var setSearch  = search[1];  search  = search[0];
  var fCat    = useState('all'); var setFCat    = fCat[1];    fCat    = fCat[0];
  var fMem    = useState('all'); var setFMem    = fMem[1];    fMem    = fMem[0];
  var dFrom   = useState('');    var setDFrom   = dFrom[1];   dFrom   = dFrom[0];
  var dTo     = useState('');    var setDTo     = dTo[1];     dTo     = dTo[0];
  var editTx  = useState(null);  var setEditTx  = editTx[1];  editTx  = editTx[0];
  var showF   = useState(false); var setShowF   = showF[1];   showF   = showF[0];
  var selMode = useState(false); var setSelMode = selMode[1]; selMode = selMode[0];
  var selected= useState({});    var setSelected= selected[1];selected = selected[0];
  var holdTimer=useRef(null);
  var touchStartPos = useRef({ x: 0, y: 0 });
 
  /* ★변경1: 다중선택 버그 수정용 Ref 2개 추가 */
  var holdTriggered = useRef(false);  /* 길게 누르기가 실제로 발동했는지 */
  var justSelected  = useRef(false);  /* 터치로 이미 처리 완료했는지 (onClick 차단용) */
 
  var filtered = useMemo(function(){
    return txs.filter(function(tx){
      if(search && tx.store.toLowerCase().indexOf(search.toLowerCase())<0) return false;
      if(fCat!=='all' && tx.catId!==fCat) return false;
      if(fMem!=='all' && tx.member!==fMem) return false;
      if(dFrom && tx.date<dFrom) return false;
      if(dTo   && tx.date>dTo)   return false;
      return true;
    }).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  },[txs,search,fCat,fMem,dFrom,dTo]);
  var totE = filtered.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  var hasF = fCat!=='all'||fMem!=='all'||dFrom||dTo;
  var selCount = Object.keys(selected).filter(function(k){return selected[k];}).length;
 
  function startHold(id) {
    if(selMode) return;
    holdTriggered.current = false; /* ★변경2: 발동 전 초기화 */
    holdTimer.current = setTimeout(function(){
      holdTriggered.current = true; /* ★변경2: 발동됨 표시 */
      setSelMode(true);
      var s = {}; s[id]=true;
      setSelected(s);
      if(navigator.vibrate) navigator.vibrate(60);
    }, 600);
  }
  function cancelHold() {
    if(holdTimer.current) { clearTimeout(holdTimer.current); holdTimer.current=null; }
  }
  function tapItem(tx) {
    if(selMode) {
      var s = Object.assign({},selected);
      if(s[tx.id]) {
        delete s[tx.id]; /* 선택 해제 시 키 자체를 삭제 (false 잔류 방지) */
      } else {
        s[tx.id] = true;
      }
      setSelected(s);
    } else {
      setEditTx(tx);
    }
  }
  function exitSel() { setSelMode(false); setSelected({}); }
  function delSelected() {
    var ids = Object.keys(selected).filter(function(k){return selected[k];}).map(Number);
    if(ids.length===0) return;
    onBulkDelete(ids); exitSel();
  }
  function selAll() {
    var s = {};
    filtered.forEach(function(t){s[t.id]=true;});
    setSelected(s);

  return h('div',{style:{padding:'0 16px 95px',overflowY:'auto',height:'100vh'}},

            h('button',{onClick:selAll,style:{padding:'6px 12px',borderRadius:16,border:'none',cursor:'pointer',background:C.faint,color:C.muted,fontSize:12}},'전체선택'),
            h('button',{onClick:delSelected,disabled:selCount===0,
              style:{padding:'6px 14px',borderRadius:16,border:'none',cursor:'pointer',
                background:selCount>0?C.red:C.faint,color:selCount>0?'#fff':C.muted,fontSize:12,fontWeight:700}},

function VoiceIn(props) {
  var apiKey = lsGet(LS_GEMINI, '');
  var isRecording = useState(false); var setIsRecording = isRecording[1]; isRecording = isRecording[0];
  var transcript = useState('');     var setTranscript = transcript[1]; transcript = transcript[0];
  function startVoice() {
    if(!apiKey) return alert('API 키 필요');
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert('지원불가 브라우저');
    var rec = new SpeechRecognition(); rec.lang = 'ko-KR'; rec.start(); setIsRecording(true);
    rec.onresult = function(e) {
      var speech = e.results[0][0].transcript; setTranscript(speech); setIsRecording(false);
      var prompt = "JSON출력: '" + speech + "' 형식: {\"store_name\":\"상호\",\"amount\":금액,\"type\":\"expense\",\"category\":\"food\"}";
      callGeminiText(prompt, apiKey, function(err, res) {
        if(err) return;
        try {
          var data = JSON.parse(res.replace(/```json\n?|```/g,'').trim());
          props.onAdd({ id: Date.now(), type: data.type||'expense', amount: data.amount, catId: data.category||'other', store: data.store_name, member: 'dad', date: new Date().toISOString().split('T')[0], method: '현금', source: 'voice' }, false);
          alert('저장완료'); props.onBack();
        } catch(ex){}
      });
    };
  }
  return h('div', {style:{padding:'0 16px 90px'}}, h(Hdr, {title:'🎙️ AI 음성 인식', onBack:props.onBack}), h('div', {style:{textAlign:'center', marginTop:40}}, h('div', {onClick: startVoice, style:{ width:120, height:120, borderRadius:'50%', background: isRecording ? C.red : C.accent, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto', boxShadow: isRecording ? '0 0 20px '+C.red : '0 10px 20px '+C.accent+'44', cursor:'pointer' }}, h('span', {style:{fontSize:50}}, isRecording ? '🛑' : '🎤')), h('p', {style:{marginTop:30, color:C.text}}, transcript || '말씀해 주세요') ));
}

function App() {
  var savedUser = lsGet(LS_USER, null);
  var loggedIn  = useState(!!savedUser);   var setLoggedIn = loggedIn[1];  loggedIn = loggedIn[0];
  var curUser   = useState(savedUser);     var setCurUser  = curUser[1];   curUser  = curUser[0];
  var tab       = useState('dashboard');   var setTab      = tab[1];       tab      = tab[0];
  var toast     = useState(null);          var setToast    = toast[1];     toast    = toast[0];
  var txs       = useState(function(){ return lsGet(LS_TXS, []); });       var setTxs = txs[1]; txs = txs[0];
  var cards     = useState(function(){ return lsGet(LS_CARDS, INIT_CARDS); }); var setCards = cards[1]; cards = cards[0];
  var fixedExps = useState(function(){ return lsGet(LS_FIXED, []); });     var setFixedExps = fixedExps[1]; fixedExps = fixedExps[0];
  var startDay  = useState(function(){ return lsGet(LS_START_DAY, 1); });  var setStartDay = startDay[1]; startDay = startDay[0];

  useEffect(function(){
    var r = fbRef('txs'); if(!r) return;
    r.on('value', function(snap){ var data = snap.val(); if(data){ var arr = Object.values(data).sort(function(a,b){ return new Date(b.date)-new Date(a.date); }); setTxs(arr); lsSet(LS_TXS, arr); } });
    var rf = fbRef('fixed'); if(rf) rf.on('value', function(snap){ var data = snap.val(); if(data){ var arr = Object.values(data); setFixedExps(arr); lsSet(LS_FIXED, arr); } });
  }, []);

  function addTx(tx, isFixed) {
    /* ★수정 4: 거래 내역 중복 등록 검증 로직 ★ */
    var dupIndex = txs.findIndex(function(t) {
      return t.store === tx.store && t.date === tx.date && t.amount === tx.amount && t.catId === tx.catId;
    });
    if (dupIndex !== -1) {
      var seqNum = txs.length - dupIndex;
      if (!window.confirm(seqNum + '번째 지출내역과 동일한 지출내역입니다.\n확인 후 등록 바랍니다.')) return;
    }

    if(fbDb) { fbSaveTx(tx); if(isFixed) fbSaveFixed(tx); } 
    else { setTxs(function(p){ var n=[tx].concat(p); lsSet(LS_TXS,n); return n; }); if(isFixed) setFixedExps(function(p){ var n=p.concat([tx]); lsSet(LS_FIXED,n); return n; }); }
    setToast('저장되었습니다'); setTab('dashboard'); setTimeout(function(){setToast(null);},2000);
  }

  function updTx(u) { if(fbDb){ fbSaveTx(u); } else { setTxs(function(p){ var n=p.map(function(t){return t.id===u.id?u:t;}); lsSet(LS_TXS,n); return n; }); } }
  function delTx(id) { if(fbDb){ fbDelTx(id); } else { setTxs(function(p){ var n=p.filter(function(t){return t.id!==id;}); lsSet(LS_TXS,n); return n; }); } }
  function bulkDel(ids) { ids.forEach(function(id){ delTx(id); }); }

  if(!loggedIn) return h(AuthScreen, {onLogin: function(u){ lsSet(LS_USER,u); setCurUser(u); setLoggedIn(true); }});

  return h('div', {style:{ background:C.bg, minHeight:'100vh', color:C.text, fontFamily:"'Pretendard', sans-serif", maxWidth:430, margin:'0 auto', position:'relative' }},
    tab==='dashboard' && h(Dashboard,  {txs:txs, onNav:setTab, startDay:startDay, onAdd:addTx, onDelete:delTx}),
    tab==='analysis'  && h(Analysis,   {txs:txs, startDay:startDay}),
    tab==='add'       && h(AddMenu,    {onAdd:addTx, onClose:function(){setTab('dashboard');}, cards:cards, fixedList:fixedExps, onDeleteFixed:delTx}),
    tab==='list'      && h(TxList,     {txs:txs, onUpdate:updTx, onDelete:delTx, onBulkDelete:bulkDel}),
    tab==='settings'  && h(Settings,   {txs:txs, onLogout:function(){lsDel(LS_USER); setLoggedIn(false);}, curUser:curUser, startDay:startDay, setStartDay:setStartDay}),
    h(BNav, {active:tab, onTab:setTab}),
    toast && h(Toast, {message:toast, onHide:function(){setToast(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
});
</script>
</body>
</html>
