function getFinMonth(dateStr, sDay) {
  var d = new Date(dateStr);
  var y = d.getFullYear();
  var m = d.getMonth();

    if (m < 0) { m = 11; y--; }
  }
  return { y: y, m: m };
}

// 👇👇 [지운 자리에 여기서부터 복사해서 붙여넣으세요] 👇👇
function fDash(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  var curY = nowFm.y;
  var curM = nowFm.m;
  var curQ = Math.floor(curM / 3);

  if (p === '이번달') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === curY && fm.m === curM; });
  }
  if (p === '이번분기') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); var tQ = Math.floor(fm.m / 3); return fm.y === curY && tQ === curQ; });
  }
  // '올해'
  return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === curY; });
}

function fPeriod(txs, p, sDay) {
  sDay = sDay || 1;
  var nowFm = getFinMonth(new Date().toISOString(), sDay);
  
  if (p === '주간') {
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6); weekAgo.setHours(0,0,0,0);
    return txs.filter(function(t) { return new Date(t.date) >= weekAgo; });
  }
  if (p === '월간') {
    return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y && fm.m === nowFm.m; });
  }
  return txs.filter(function(t) { var fm = getFinMonth(t.date, sDay); return fm.y === nowFm.y; });
}

// ★수정 2: 테마별 카드 디자인(GCard) 업그레이드 ★
function GCard(props) {
  var children = props.children;
  var style = props.style || {};
  var onClick = props.onClick;
  
  var baseStyle = {
    borderRadius: 16,
    padding: 16,
    cursor: onClick ? 'pointer' : 'default',
    transition: 'all 0.3s ease'
  };

  // 🏙️ 라이트 모드 (Modern Fintech)
  if (savedTheme === 'light') {
    Object.assign(baseStyle, {
      background: C.card,
      border: '1px solid ' + C.border,
      boxShadow: '0 4px 12px rgba(42, 51, 77, 0.06)'
    });
  } 
 // 🔮 코지 모드 (Aurora Glow) - v2.0 정밀 수정
  else if (savedTheme === 'cozy') {
    Object.assign(baseStyle, {
      background: C.card,
      border: '1px solid ' + C.border,
      backdropFilter: 'blur(18px)',
      boxShadow: '0 4px 16px ' + C.glow
    });
  }
 // 💎 Modern Glassmorphism - v4.0
  else {
    Object.assign(baseStyle, {
      background: C.card,
      border: '1px solid ' + C.border,
      backdropFilter: 'blur(16px)', // 유리 효과
      boxShadow: '0 8px 32px rgba(0,0,0,0.4), 0 0 12px ' + C.glow // 부드러운 그림자
    });
  }

  return h('div', {
    onClick: onClick,
    style: Object.assign(baseStyle, style)
  }, children);
}

function DonutChart(props) {
  var data = props.data || [];
  var size = props.size || 110;
  if (!data.length) return h('div',{style:{width:size,height:size,borderRadius:'50%',background:C.faint}});
  var total = data.reduce(function(s,d){return s+d.value;},0);
  if (!total) return h('div',{style:{width:size,height:size,borderRadius:'50%',background:C.faint}});
  var cx=size/2, cy=size/2, R=size/2*0.88, r=size/2*0.52;
  var angle = -Math.PI/2;
  var paths = [];
  data.forEach(function(d,i){
    var slice = (d.value/total)*2*Math.PI;
    if(slice < 0.01) return;
    var x1=cx+R*Math.cos(angle), y1=cy+R*Math.sin(angle);
    var x2=cx+R*Math.cos(angle+slice), y2=cy+R*Math.sin(angle+slice);
    var xi1=cx+r*Math.cos(angle+slice), yi1=cy+r*Math.sin(angle+slice);
    var xi2=cx+r*Math.cos(angle), yi2=cy+r*Math.sin(angle);
    var lg = slice > Math.PI ? 1 : 0;
    paths.push(h('path',{
      key:i,
      d:'M'+x1+','+y1+' A'+R+','+R+' 0 '+lg+' 1 '+x2+','+y2+' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+lg+' 0 '+xi2+','+yi2+' Z',
      fill:d.color, stroke:C.bg, strokeWidth:1.5
    }));
    angle += slice;
  });
  return h('svg',{width:size,height:size,viewBox:'0 0 '+size+' '+size}, paths);
}

function LineChartSVG(props) {
  var data = props.data || [];
  var height = props.height || 140;
  var w=320, pL=38, pR=10, pT=14, pB=24;
  var iw=w-pL-pR, ih=height-pT-pB;
  if(data.length<2) return h('div',{style:{height:height,display:'flex',alignItems:'center',justifyContent:'center'}},
    h('span',{style:{color:C.muted,fontSize:12}},'데이터 없음'));
  var maxE = Math.max.apply(null,data.map(function(d){return d.expense;}));
  var maxI = data[0].income ? Math.max.apply(null,data.map(function(d){return d.income||0;})) : maxE;
  var maxV = Math.max(maxE,maxI,1);
  function px(i){ return pL+i*(iw/(data.length-1)); }
  function pyE(v){ return pT+ih-(v/maxV)*ih; }
  function pyI(v){ return pT+ih-(v/maxV)*ih; }
  var ePts = data.map(function(d,i){return px(i)+','+pyE(d.expense);}).join(' ');
  var iPts = data[0].income ? data.map(function(d,i){return px(i)+','+pyI(d.income);}).join(' ') : null;
  return h('svg',{viewBox:'0 0 '+w+' '+height,width:'100%',height:height},
    [0,0.5,1].map(function(f,i){
      return h('line',{key:'g'+i,x1:pL,y1:pT+ih*f,x2:w-pR,y2:pT+ih*f,stroke:C.border,strokeDasharray:'4 4'});
    }),
    [maxV,maxV*0.5,0].map(function(v,i){
      return h('text',{key:'y'+i,x:pL-4,y:pT+ih*(i*0.5)+4,textAnchor:'end',fontSize:9,fill:C.muted},(v/10000).toFixed(0)+'만');
    }),
    data.map(function(d,i){
      return h('text',{key:'x'+i,x:px(i),y:height-4,textAnchor:'middle',fontSize:10,fill:C.muted},d.month);
    }),
    iPts && h('polyline',{points:iPts,fill:'none',stroke:C.green,strokeWidth:2.5,strokeLinejoin:'round'}),
    h('polyline',{points:ePts,fill:'none',stroke:C.red,strokeWidth:2.5,strokeLinejoin:'round'}),
    data.map(function(d,i){return h('circle',{key:'ec'+i,cx:px(i),cy:pyE(d.expense),r:4,fill:C.red});}),
    iPts && data.map(function(d,i){return h('circle',{key:'ic'+i,cx:px(i),cy:pyI(d.income||0),r:4,fill:C.green});})
  );
}

function SavingsModal(props) {
  var onClose = props.onClose;
  var txs = props.txs || [];
  var exp = txs.filter(function(t){return t.type==='expense';});
  var totE = exp.reduce(function(s,t){return s+t.amount;},0);
  var byCat = {};
  exp.forEach(function(t){byCat[t.catId]=(byCat[t.catId]||0)+t.amount;});
  var tips = [
    {icon:'☕',cat:'food',  base:0.28,label:'식비 28% 이하 목표'},
    {icon:'🛒',cat:'shop',  base:0.20,label:'쇼핑 20% 이하 목표'},
    {icon:'📱',cat:'comm',  base:0.05,label:'통신비 5% 이하 목표'},
    {icon:'🎬',cat:'culture',base:0.08,label:'문화생활 8% 이하 목표'}
  ];
  var annual = 0;
  var rows = tips.map(function(tip){
    var curr = byCat[tip.cat]||0;
    var tgt = totE*tip.base;
    var save = Math.max(Math.round(curr-tgt),0);
    annual += save*12;
    return {icon:tip.icon,label:tip.label,curr:curr,tgt:tgt,save:save};
  }).filter(function(r){return r.save>0;});
  return h(Sheet,{title:'🤖 AI 절약 제안',onClose:onClose},
    h('div',{style:{padding:'12px',background:C.green+'15',borderRadius:12,textAlign:'center',marginBottom:14}},
      h('p',{style:{color:C.muted,fontSize:12,margin:'0 0 4px'}},'지금 데이터 기준 연간 절약 가능'),
      h('p',{style:{color:C.green,fontSize:24,fontWeight:900,margin:0}},fmt(annual))
    ),
    rows.length===0
      ? h('p',{style:{color:C.muted,textAlign:'center',padding:'20px 0'}},'현재 지출 패턴이 양호합니다 👍')
      : rows.map(function(r,i){
          return h('div',{key:i,style:{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:'1px solid '+C.faint}},
            h('span',{style:{fontSize:24,flexShrink:0}},r.icon),
            h('div',{style:{flex:1}},
              h('p',{style:{color:C.text,fontSize:13,fontWeight:600,margin:'0 0 3px'}},r.label),
              h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
                h('span',{style:{color:C.red,fontSize:11}},'현재 '+fmt(r.curr)),
                h('span',{style:{color:C.muted,fontSize:11}},'→'),
                h('span',{style:{color:C.green,fontSize:11}},'목표 '+fmt(r.tgt))
              )
            ),
            h('span',{style:{color:C.green,fontSize:13,fontWeight:800,flexShrink:0}},'+'+fmtS(r.save)+'/월')
          );
        })
  );
}

var LS_GEMINI = 'flai_gemini_key';

/* ★추가: AI 음성 및 텍스트 분석용 함수 (재무분석 & 음성인식에 사용) */
function callGeminiText(promptText, apiKey, callback) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: promptText }],
    temperature: 0.3,
    max_tokens: 2000
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 30000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var data = JSON.parse(xhr.responseText);
        var text = data.choices[0].message.content;
        callback(null, text);
      } catch(e) { callback('응답 해석 실패', null); }
    } else {
      var em = 'HTTP ' + xhr.status;
      try { var ed=JSON.parse(xhr.responseText); if(ed.error) em=ed.error.message||em; } catch(e2){}
      callback(em, null);
    }
  };
  xhr.onerror = function() { callback('네트워크 오류', null); };
  xhr.ontimeout = function() { callback('요청 시간 초과', null); };
  xhr.send(body);
}
function callGeminiOCR(base64Image, mimeType, apiKey, callback) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var prompt = '이 영수증 또는 배달앱 캡처에서 정보를 추출해 JSON만 출력(설명없이):\n{"store_name":"상호명","amount":금액숫자,"date":"YYYY-MM-DD","category":"food|trans|edu|health|shop|culture|comm|util|other"}\n금액없으면0, 날짜없으면오늘날짜';
  var body = JSON.stringify({
    model: 'llama-3.2-90b-vision-preview',
    messages: [{
      role: 'user',
      content: [
        { type: 'text', text: prompt },
        { type: 'image_url', image_url: { url: 'data:'+(mimeType||'image/jpeg')+';base64,'+base64Image } }
      ]
    }],
    temperature: 0.1,
    max_tokens: 300
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 30000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var data = JSON.parse(xhr.responseText);
        var text = data.choices[0].message.content;
        text = text.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
        var s=text.indexOf('{'), e=text.lastIndexOf('}');
        if(s>=0&&e>s) text=text.slice(s,e+1);
        callback(null, JSON.parse(text));
      } catch(e2) { callback('파싱오류: '+e2.message, null); }
    } else {
      var em='HTTP '+xhr.status;
      try{var ed=JSON.parse(xhr.responseText);if(ed.error)em=ed.error.message||em;}catch(e3){}
      callback(em, null);
    }
  };
  xhr.onerror = function() { callback('네트워크 오류', null); };
  xhr.ontimeout = function() { callback('요청 시간 초과', null); };
  xhr.send(body);
}

function testGeminiKey(apiKey, onResult) {
  var url = 'https://api.groq.com/openai/v1/chat/completions';
  var body = JSON.stringify({
    model: 'llama-3.1-8b-instant',
    messages: [{ role: 'user', content: 'hi' }],
    max_tokens: 10
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.timeout = 15000;
  xhr.onload = function() {
    if(xhr.status>=200 && xhr.status<300) {
      try {
        var d=JSON.parse(xhr.responseText);
        if(d.choices && d.choices[0]) onResult('success','');
        else onResult('error','알 수 없는 응답');
      } catch(e){ onResult('error','응답 파싱 오류'); }
    } else {
      var em='HTTP '+xhr.status;
      try{var ed=JSON.parse(xhr.responseText);if(ed.error)em=ed.error.message;}catch(e2){}
      onResult('error', em);
    }
  };
  xhr.onerror = function() { onResult('cors',''); };
  xhr.ontimeout = function() { onResult('error','요청 시간 초과'); };
  xhr.send(body);
}

function TxList(props) {
  var txs = props.txs;
  var onUpdate = props.onUpdate;
  var onDelete = props.onDelete;
  var onBulkDelete = props.onBulkDelete;
  var search  = useState('');    var setSearch  = search[1];  search  = search[0];
  var fCat    = useState('all'); var setFCat    = fCat[1];    fCat    = fCat[0];
  var fMem    = useState('all'); var setFMem    = fMem[1];    fMem    = fMem[0];
  var dFrom   = useState('');    var setDFrom   = dFrom[1];   dFrom   = dFrom[0];
  var dTo     = useState('');    var setDTo     = dTo[1];     dTo     = dTo[0];
  var editTx  = useState(null);  var setEditTx  = editTx[1];  editTx  = editTx[0];
  var showF   = useState(false); var setShowF   = showF[1];   showF   = showF[0];
  var selMode = useState(false); var setSelMode = selMode[1]; selMode = selMode[0];
  var selected= useState({});    var setSelected= selected[1];selected = selected[0];
  var holdTimer=useRef(null);
  var touchStartPos = useRef({ x: 0, y: 0 }); // 터치 시작 위치 저장용 변수 추가
  var filtered = useMemo(function(){
    return txs.filter(function(tx){
      if(search && tx.store.toLowerCase().indexOf(search.toLowerCase())<0) return false;
      if(fCat!=='all' && tx.catId!==fCat) return false;
      if(fMem!=='all' && tx.member!==fMem) return false;
      if(dFrom && tx.date<dFrom) return false;
      if(dTo   && tx.date>dTo)   return false;
      return true;
    }).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  },[txs,search,fCat,fMem,dFrom,dTo]);
  var totE = filtered.filter(function(t){return t.type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  var hasF = fCat!=='all'||fMem!=='all'||dFrom||dTo;
  var selCount = Object.keys(selected).filter(function(k){return selected[k];}).length;
  function startHold(id) {
    if(selMode) return;
    holdTimer.current = setTimeout(function(){
      setSelMode(true);
      var s = {}; s[id]=true;
      setSelected(s);
      if(navigator.vibrate) navigator.vibrate(60);
    }, 600);
  }
  function cancelHold() {
    if(holdTimer.current) { clearTimeout(holdTimer.current); holdTimer.current=null; }
  }
  function tapItem(tx) {
    if(selMode) {
      var s = Object.assign({},selected);
      s[tx.id] = !s[tx.id];
      setSelected(s);
    } else {
      setEditTx(tx);
    }
  }
  function exitSel() { setSelMode(false); setSelected({}); }
  function delSelected() {
    var ids = Object.keys(selected).filter(function(k){return selected[k];}).map(Number);
    if(ids.length===0) return;
    onBulkDelete(ids); exitSel();
  }
  function selAll() {
    var s = {};
    filtered.forEach(function(t){s[t.id]=true;});
    setSelected(s);
  }
  return h('div',{style:{padding:'0 16px 95px',overflowY:'auto',height:'100vh'}},
    selMode
      ? h('div',{style:{padding:'18px 20px 8px',display:'flex',alignItems:'center',justifyContent:'space-between'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:10}},
            h('button',{onClick:exitSel,style:{background:'none',border:'none',cursor:'pointer',fontSize:22,color:C.muted,lineHeight:1}},'✕'),
            h('span',{style:{color:C.text,fontSize:16,fontWeight:700}},selCount+'개 선택')
          ),
          h('div',{style:{display:'flex',gap:8}},
            h('button',{onClick:selAll,style:{padding:'6px 12px',borderRadius:16,border:'none',cursor:'pointer',background:C.faint,color:C.muted,fontSize:12}},'전체선택'),
            h('button',{onClick:delSelected,disabled:selCount===0,
              style:{padding:'6px 14px',borderRadius:16,border:'none',cursor:'pointer',
                background:selCount>0?C.red:C.faint,color:selCount>0?'#fff':C.muted,fontSize:12,fontWeight:700}},
              '삭제 ('+selCount+')')
          )
        )
      : h(Hdr,{title:'거래 내역',right:
          h('button',{onClick:function(){setShowF(!showF);},
            style:{background:hasF?C.accent+'33':C.faint,border:'none',borderRadius:20,
              padding:'6px 12px',cursor:'pointer',color:hasF?C.accent:C.muted,fontSize:12}},
            '필터'+(hasF?' ●':''))
        }),
    selMode && h('div',{style:{background:C.red+'15',border:'1px solid '+C.red+'33',
        borderRadius:10,padding:'8px 12px',marginBottom:10,display:'flex',alignItems:'center',gap:8}},
      h('span',{style:{fontSize:14}},'☑️'),
      h('p',{style:{color:C.red,fontSize:11,margin:0}},'탭하여 선택/해제 · 삭제 버튼으로 한번에 제거')
    ),
    !selMode && filtered.length>0 && h('div',{style:{background:C.accent+'11',borderRadius:10,
        padding:'7px 12px',marginBottom:8,display:'flex',alignItems:'center',gap:6}},
      h('span',{style:{fontSize:13}},'💡'),
      h('p',{style:{color:C.muted,fontSize:11,margin:0}},'항목을 0.6초 길게 누르면 다중 선택 모드 활성화')
    ),
    !selMode && h('div',{style:{display:'flex',alignItems:'center',gap:10,background:C.card2,
      border:'1px solid '+C.border,borderRadius:12,padding:'10px 14px',marginBottom:10}},
      h('span',{style:{fontSize:16,color:C.muted}},'🔍'),
      h('input',{value:search,onChange:function(e){setSearch(e.target.value);},placeholder:'상호명 검색...',
        style:{flex:1,background:'none',border:'none',outline:'none',color:C.text,fontSize:14}}),
      search && h('button',{onClick:function(){setSearch('');},style:{background:'none',border:'none',cursor:'pointer',color:C.muted,fontSize:18}},'✕')
    ),
    !selMode && showF && h(GCard,{style:{marginBottom:12}},
      h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 5px'}},'📅 날짜 범위'),
      h('div',{style:{display:'flex',gap:8,marginBottom:10,alignItems:'center'}},
        h('input',{type:'date',value:dFrom,onChange:function(e){setDFrom(e.target.value);},
          style:{flex:1,padding:'7px 9px',borderRadius:8,background:C.faint,border:'1px solid '+C.border,color:C.text,fontSize:12,outline:'none'}}),
        h('span',{style:{color:C.muted}},'~'),
        h('input',{type:'date',value:dTo,onChange:function(e){setDTo(e.target.value);},
          style:{flex:1,padding:'7px 9px',borderRadius:8,background:C.faint,border:'1px solid '+C.border,color:C.text,fontSize:12,outline:'none'}})
      ),
      h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 5px'}},'🏷️ 카테고리'),
      h('div',{style:{display:'flex',flexWrap:'wrap',gap:4,marginBottom:10}},
        [['all','전체',C.accent]].concat(EX_CATS.map(function(c){return [c.id,c.icon+c.name,c.color];})).map(function(v){
          return h('button',{key:v[0],onClick:function(){setFCat(v[0]);},
            style:{padding:'4px 9px',borderRadius:16,border:'none',cursor:'pointer',
              background:fCat===v[0]?v[2]+'44':C.faint,color:fCat===v[0]?v[2]:C.muted,fontSize:11}},v[1]);
        })
      ),
      h('p',{style:{color:C.muted,fontSize:11,margin:'0 0 5px'}},'👤 구성원'),
      h('div',{style:{display:'flex',gap:6}},
        [['all','전체']].concat(MEMBERS.map(function(m){return [m.id,m.emoji+m.name];})).map(function(v){
          return h('button',{key:v[0],onClick:function(){setFMem(v[0]);},
            style:{padding:'5px 10px',borderRadius:16,border:'none',cursor:'pointer',
              background:fMem===v[0]?C.accent+'44':C.faint,color:fMem===v[0]?C.accent:C.muted,fontSize:11}},v[1]);
        })
      ),
      hasF && h('button',{onClick:function(){setFCat('all');setFMem('all');setDFrom('');setDTo('');},
        style:{marginTop:10,width:'100%',padding:7,borderRadius:8,border:'none',cursor:'pointer',
          background:C.red+'22',color:C.red,fontSize:12}},'필터 초기화')
    ),
    h(GCard,{style:{marginBottom:12}},
      h('div',{style:{display:'flex',justifyContent:'space-between'}},
        h('div',null,h('p',{style:{color:C.muted,fontSize:10,margin:0}},'조회 지출'),h('p',{style:{color:C.red,fontSize:16,fontWeight:800,margin:'2px 0 0'}},fmt(totE))),
        h('div',{style:{textAlign:'right'}},h('p',{style:{color:C.muted,fontSize:10,margin:0}},'건수'),h('p',{style:{color:C.text,fontSize:16,fontWeight:800,margin:'2px 0 0'}},filtered.length+'건'))
      )
    ),
    filtered.length===0
      ? h('div',{style:{textAlign:'center',padding:'40px 0'}},h('p',{style:{fontSize:48}},'🔍'),h('p',{style:{color:C.muted}},'검색 결과 없음'))
      : h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
          filtered.map(function(tx){
            var cat=getCat(tx.catId), mem=getMem(tx.member);
            var isSel = !!selected[tx.id];
            return h('div',{
              key:tx.id,
              onMouseDown:function(){startHold(tx.id);},
              onMouseUp:cancelHold,
              onMouseLeave:cancelHold,
              onTouchStart: function(e) {
                // 터치 시작 위치 기록
                touchStartPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                startHold(tx.id);
              },
              onTouchEnd: function(e) {
                cancelHold();
                // 손을 뗐을 때 위치와 시작 위치를 비교
                var touch = e.changedTouches[0];
                var moveX = Math.abs(touch.clientX - touchStartPos.current.x);
                var moveY = Math.abs(touch.clientY - touchStartPos.current.y);
                
                // 손가락이 x나 y축으로 10픽셀 이상 움직였다면 스크롤로 간주하고 무시
                if (moveX < 10 && moveY < 10) {
                  e.preventDefault(); // 브라우저 기본 클릭 동작 방지
                  tapItem(tx); // 움직임이 거의 없을 때만 수정창 열기
                }
              },
              onTouchMove: function() {
                cancelHold(); // 스크롤이 시작되면 '길게 누르기(삭제모드)' 타이머도 취소
              },
              onClick: function(e) {
                // 모바일 환경이 아닐 때(마우스 클릭 등)를 위한 대비

                border:'1px solid '+(isSel?C.red+'88':C.border),
                borderRadius:16,padding:16,cursor:'pointer',userSelect:'none'}
            },
              h('div',{style:{display:'flex',alignItems:'center',gap:12}},
                selMode && h('div',{style:{width:22,height:22,borderRadius:'50%',flexShrink:0,
                  background:isSel?C.red:C.faint,border:'2px solid '+(isSel?C.red:C.border),
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:12,color:'#fff',fontWeight:700}},isSel?'✓':''),
                h('div',{style:{width:44,height:44,borderRadius:12,background:cat.color+'22',
                  border:'1px solid '+cat.color+'44',display:'flex',alignItems:'center',
                  justifyContent:'center',fontSize:22,flexShrink:0}},cat.icon),
                h('div',{style:{flex:1,minWidth:0}},
                  h('p',{style:{color:C.text,fontSize:14,fontWeight:600,margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},tx.store),
                  h('div',{style:{display:'flex',alignItems:'center',gap:5}},

                    h('span',{style:{color:C.muted,fontSize:11}},tx.date+' · '+tx.method.slice(0,12))
                  )
                ),
                h('div',{style:{textAlign:'right',flexShrink:0}},
                  h('p',{style:{
  color: tx.type==='income' ? C.green : (tx.type==='invest' ? '#A29BFE' : C.text),
  fontSize:14, fontWeight:800, margin:'0 0 4px'
}}, 
  (tx.type==='income' ? '+' : (tx.type==='invest' ? '⮂ ' : '-')) + fmt(tx.amount)
),
                  h('span',{style:{background:cat.color+'22',color:cat.color,fontSize:10,fontWeight:600,padding:'2px 6px',borderRadius:16}},cat.name),
                  /* ★수정: 세부항목이 있으면 태그로 표시 ★ */
                  tx.subCat && h('span',{style:{border:'1px solid '+cat.color+'66',color:cat.color,fontSize:9,fontWeight:700,padding:'1px 5px',borderRadius:4,marginLeft:3}}, tx.subCat),
              tx.source==='fixed' && h('span',{style:{background:C.gold+'22',color:C.gold,fontSize:9,fontWeight:700,padding:'2px 6px',borderRadius:16,marginLeft:3}},'📌고정'),
!selMode && h('span',{style:{color:C.muted,fontSize:11,marginLeft:4}},' ✏️')

                )
              )
            );
          })
        ),
    editTx && h(EditModal,{tx:editTx,
      onSave:function(u){onUpdate(u);setEditTx(null);},

  );

function AuthScreen(props) {

  var showSPw = useState(false);  var setShowSPw = showSPw[1]; showSPw = showSPw[0];

  var findInput = useState(''); var setFindInput = findInput[1]; findInput = findInput[0];

  function chkPw(p) { if (!p || p.length < 8) return '최소 8자 이상'; if (!/[A-Za-z]/.test(p)) return '영문 포함'; if (!/[0-9]/.test(p)) return '숫자 포함'; return ''; }
  function chkId(id) { if (!id || id.length < 4) return '4자 이상'; if (!/^[a-zA-Z0-9_]+$/.test(id)) return '영문/숫자만'; return ''; }

  function doLogin() {
    setLoginMsg('');
    var users = lsGet(LS_USERS, []);
    var found = users.find(function(u){ return u.userId === loginId.trim(); });
    if (!found) { setLoginMsg('등록되지 않은 아이디입니다.'); return; }
    if (found.pw !== loginPw) { setLoginMsg('비밀번호가 틀립니다.'); return; }
    onLogin({userId: found.userId, name: found.name, email: found.email, phone: found.phone});
  }

  function doSignup() {
    /* ★블랙리스트 체크 */
    var blacks = lsGet(LS_BLACKLIST, []);
    if (blacks.some(function(b){ return b.userId === sId.trim() || b.phone === sPhone.trim(); })) {
      alert('🚫 차단된 정보입니다. 가입이 불가능합니다.'); return;
    }
    var e = {};
    if (!sName.trim()) e.name = '이름 입력 필수';
    if (chkId(sId.trim())) e.sid = chkId(sId.trim());
    if (chkPw(sPw)) e.pw = chkPw(sPw);
    if (sPw !== sPw2) e.pw2 = '비밀번호 불일치';
    setErrs(e); if (Object.keys(e).length > 0) return;
    var users = lsGet(LS_USERS, []);
    if (users.some(function(u){return u.userId===sId.trim();})) { setErrs({sid:'중복된 아이디'}); return; }
    var newUser = {userId: sId.trim(), name: sName.trim(), email: sEmail.trim(), phone: sPhone.trim(), pw: sPw};
    users.push(newUser); lsSet(LS_USERS, users);
    onLogin({userId: newUser.userId, name: newUser.name, email: newUser.email, phone: newUser.phone});
  }

  function doFind(type) {
    var users = lsGet(LS_USERS, []);
    var found = users.find(function(u){ return u.email === findInput || u.phone === findInput; });
    if(!found) { setFindRes('error:일치하는 정보가 없습니다.'); return; }
    if(type==='id') setFindRes('success:아이디는 ['+found.userId+'] 입니다.');

    h('div', {style:{display:'flex', gap:4, marginBottom:20, background:C.faint, borderRadius:12, padding:4}},
      [['login','로그인'], ['signup','회원가입']].map(function(v) { return h('button', {key:v[0], onClick:function(){setMode(v[0]);setErrs({});setLoginMsg('');}, style:{flex:1, padding:'10px 0', borderRadius:9, border:'none', cursor:'pointer', background:mode===v[0]?C.card:'none', color:mode===v[0]?C.text:C.muted, fontSize:14, fontWeight:mode===v[0]?700:400}}, v[1]); })
    ),
    mode==='login' && h('div', null,
      h('input', {value:loginId, onChange:function(e){setLoginId(e.target.value);}, placeholder:'아이디', style:inp('login')}),
      h('div', {style:{position:'relative', marginBottom:12}}, 
        h('input', {value:loginPw, onChange:function(e){setLoginPw(e.target.value);}, type:showLPw?'text':'password', placeholder:'비밀번호', style:Object.assign(inp('lpw'),{paddingRight:60})}),
        h('button', {onClick:function(){setShowLPw(!showLPw);}, style:{position:'absolute',right:10,top:12,background:'none',border:'none',color:C.muted,fontSize:12}}, showLPw?'숨기기':'보기')
      ),
      loginMsg && h('p',{style:{color:C.red, fontSize:12, marginBottom:10}}, '⚠️ '+loginMsg),
      h('button', {onClick:doLogin, style:{width:'100%', padding:15, borderRadius:12, border:'none', background:C.accent, color:'#fff', fontWeight:800}}, '로그인'),
      h('div',{style:{display:'flex', justifyContent:'center', gap:15, marginTop:20}},

}
/* ★추가: AI 음성 인식 컴포넌트 */
function VoiceIn(props) {
  var onAdd = props.onAdd;
  var onBack = props.onBack;
  var apiKey = lsGet(LS_GEMINI, '');
  var isRecording = useState(false); var setIsRecording = isRecording[1]; isRecording = isRecording[0];
  var transcript = useState('');     var setTranscript = transcript[1]; transcript = transcript[0];
  var analyzing = useState(false);   var setAnalyzing = analyzing[1]; analyzing = analyzing[0];

  function startVoice() {
    if(!apiKey) return alert('설정에서 Gemini API 키를 먼저 등록해주세요!');
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert('이 브라우저에서는 음성 인식을 지원하지 않습니다.');
    
    var recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.start();
    setIsRecording(true);
    setTranscript('듣고 있어요... 말씀해 주세요!');

    recognition.onresult = function(event) {
      var speech = event.results[0][0].transcript;
      setTranscript(speech);
      setIsRecording(false);
      analyzeSpeech(speech);
    };
    recognition.onerror = function() {
      setIsRecording(false);
      setTranscript('음성 인식에 실패했어요. 다시 시도해주세요.');
    };
  }

  function analyzeSpeech(text) {
    setAnalyzing(true);
    var prompt = "다음 문장을 가계부 내역으로 바꿔서 JSON만 출력해:\n문장: '" + text + "'\n형식: {\"store_name\":\"상호명(없으면 기타)\",\"amount\":숫자금액,\"type\":\"expense 또는 income\",\"category\":\"food|trans|edu|health|shop|culture|comm|other\"}";
    
    callGeminiText(prompt, apiKey, function(err, res) {
      setAnalyzing(false);
      if(err) { setTranscript('AI 분석 실패: ' + err); return; }
      try {
        var cleanJson = res.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
        var data = JSON.parse(cleanJson);
        if(!data.amount) { setTranscript('금액을 인식하지 못했어요. 다시 말해주세요.'); return; }
        
        onAdd({
          id: Date.now(), type: data.type || 'expense', amount: data.amount,
          catId: data.category || 'other', store: data.store_name,
          member: 'dad', date: new Date().toISOString().split('T')[0], method: '현금', source: 'voice'
        });
        alert('음성으로 내역이 저장되었습니다!');
        onBack();
      } catch(e) { setTranscript('AI가 문장을 이해하지 못했어요. 다시 말해주세요.'); }
    });
  }

  return h('div', {style:{padding:'0 16px 90px'}},
    h(Hdr, {title:'🎙️ AI 음성 인식', onBack:onBack}),
    h('div', {style:{textAlign:'center', marginTop:40}},
      h('div', {onClick: startVoice, style:{
        width:120, height:120, borderRadius:'50%', background: isRecording ? C.red : C.accent,
        display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto',
        boxShadow: isRecording ? '0 0 20px '+C.red : '0 10px 20px '+C.accent+'44', cursor:'pointer', transition:'0.3s'
      }}, h('span', {style:{fontSize:50}}, isRecording ? '🛑' : '🎤')),
      h('p', {style:{marginTop:30, fontSize:16, fontWeight:700, color:C.text}}, transcript || '마이크를 누르고 말씀해 주세요!'),
      h('p', {style:{marginTop:10, fontSize:12, color:C.muted}}, '예: "이마트에서 장보기로 5만원 썼어"'),
      analyzing && h('p', {style:{marginTop:20, color:C.green, fontWeight:800}}, '🤖 AI가 분석하고 저장하는 중...')
    )
  );
}

// ── localStorage 키 상수 ─────────────────────────────
var LS_USER    = 'flai_user';
var LS_TXS     = 'flai_txs';
var LS_CARDS   = 'flai_cards';
var LS_MEMBERS = 'flai_members';
var LS_USERS   = 'flai_users';
var LS_BUDGET  = 'flai_budget';
var LS_FIXED   = 'flai_fixed';
function lsGet(key, def) {
  try {
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch(e) { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}
function lsDel(key) {
  try { localStorage.removeItem(key); } catch(e) {}
}

(function(){if(!lsGet(LS_USERS,null))lsSet(LS_USERS,[]);})();

// ── 메인 App ─────────────────────────────────────────
function App() {
  var savedUser = lsGet(LS_USER, null);
  var loggedIn  = useState(!!savedUser);   var setLoggedIn = loggedIn[1];  loggedIn = loggedIn[0];
  var curUser   = useState(savedUser);     var setCurUser  = curUser[1];   curUser  = curUser[0];
  var tab       = useState('dashboard');   var setTab      = tab[1];       tab      = tab[0];
  var toast     = useState(null);          var setToast    = toast[1];     toast    = toast[0];
  var txs   = useState(function(){ return lsGet(LS_TXS, []); });
  var setTxs = txs[1]; txs = txs[0];
  var cards   = useState(function(){ return lsGet(LS_CARDS, INIT_CARDS); });
  var fixedExps = useState(function(){ return lsGet(LS_FIXED, []); });
  var setFixedExps = fixedExps[1]; fixedExps = fixedExps[0];
  var setCards = cards[1]; cards = cards[0];
  var startDay = useState(function(){ return lsGet(LS_START_DAY, 1); }); // 기본값 1일
  var setStartDay = startDay[1]; startDay = startDay[0];

  // ★§4 수정: Firebase 실시간 리스너 — 가족 공유 핵심 ★
  useEffect(function(){
    var r = fbRef('txs');
    if(!r) return; // Firebase 없으면 로컬만 사용
    r.on('value', function(snap){
      var data = snap.val();
      if(data && typeof data === 'object'){
        var arr = Object.values(data)
          .filter(function(t){ return t && t.id; })
          .sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
        setTxs(arr);
        lsSet(LS_TXS, arr); // 로컬 백업
      }
    }, function(err){ console.error('[FB 리스너 오류]', err); });
  var rf = fbRef('fixed');
    if(rf) {
      rf.on('value', function(snap){
        var data = snap.val();
        if(data && typeof data === 'object'){
          var arr = Object.values(data).filter(function(f){ return f && f.id; });
          setFixedExps(arr);
          lsSet(LS_FIXED, arr);
        }
      });
    }  
return function(){ r.off(); if(rf) rf.off(); }; // 언마운트 시 리스너 해제
  }, []);
  // ★§4 Firebase 리스너 끝 ★

  useEffect(function(){
    if(!fbDb) lsSet(LS_TXS, txs); // Firebase 없을 때만 로컬 저장
  }, [txs]);

  useEffect(function(){
    lsSet(LS_CARDS, cards);
  }, [cards]);
useEffect(function(){
    if(!fbDb) lsSet(LS_FIXED, fixedExps);
  }, [fixedExps]);
// ★ 고정지출 매월 자동 추가 로직 ★
  useEffect(function(){
    if(fixedExps.length === 0) return;
    var now = new Date();
    var thisY = now.getFullYear();
    var thisM = now.getMonth();

    fixedExps.forEach(function(fx){
      if(!fx.active) return;
      // 등록월부터 현재월까지 순회
      var startDate = new Date(fx.createdAt);
      var sy = startDate.getFullYear();
      var sm = startDate.getMonth();
      var y = sy, m = sm;
      while(y < thisY || (y === thisY && m <= thisM)) {
        var dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(fx.dayOfMonth).padStart(2,'0');
        // 이미 해당 월에 이 고정지출이 추가되었는지 확인
        var exists = false;
        for(var i=0;i<txs.length;i++){
          if(txs[i].fixedId===fx.fixedId && txs[i].date && txs[i].date.slice(0,7)===dateStr.slice(0,7)){
            exists=true; break;
          }
        }
        if(!exists) {
          var autoTx = {
            id: Date.now() + Math.floor(Math.random()*10000),
            type:'expense', amount:fx.amount, catId:fx.catId,
            store:fx.store, member:fx.member, date:dateStr,
            method:fx.method, source:'fixed', fixedId:fx.fixedId,
            dayOfMonth:fx.dayOfMonth
          };
          if(fbDb) {
            fbSaveTx(autoTx);
          } else {
            setTxs(function(p){
              // 중복 체크 한번 더
              var dup = false;
              for(var j=0;j<p.length;j++){
                if(p[j].fixedId===fx.fixedId && p[j].date && p[j].date.slice(0,7)===dateStr.slice(0,7)){
                  dup=true;break;
                }
              }
              if(dup) return p;
              var next = [autoTx].concat(p);
              lsSet(LS_TXS, next);
              return next;
            });
          }
        }
        // 다음 월로
        m++;
        if(m>11){m=0;y++;}
      }
    });
  }, [fixedExps, txs.length]);

  function show(msg) {
    setToast(msg);
    setTimeout(function(){ setToast(null); }, 2500);
  }

  // ★§4 수정: CRUD — Firebase 있으면 Firebase, 없으면 로컬 ★
  function addTx(tx, isFixed) {
    if(fbDb) {
      fbSaveTx(tx);
      show(isFixed?'📌 고정지출 등록 🔥 매월 자동 반복됩니다!':'저장됨 🔥 가족 모두에게 공유됩니다!');
    } else {
      setTxs(function(p){
        var next = [tx].concat(p);
        lsSet(LS_TXS, next);
        return next;
      });
      show(isFixed?'📌 고정지출이 등록되었습니다!':'저장되었습니다!');
    }
    // 고정지출이면 템플릿도 저장
    if(isFixed && tx.fixedId) {
      var fxTemplate = {
        id: tx.fixedId,
        fixedId: tx.fixedId,
        amount: tx.amount,
        catId: tx.catId,
        store: tx.store,
        member: tx.member,
        method: tx.method,
        dayOfMonth: tx.dayOfMonth,
        active: true,
        createdAt: tx.date
      };
      if(fbDb) {
        fbSaveFixed(fxTemplate);
      } else {
        setFixedExps(function(p){
          var next = p.concat([fxTemplate]);
          lsSet(LS_FIXED, next);
          return next;
        });
      }
    }
    setTab('dashboard');
  }
 function updTx(u) {
    if(fbDb) {
      // Firebase를 사용 중이면 해당 항목의 경로를 찾아 날짜를 포함해 덮어쓰기
      var r = fbRef('txs/tx_' + u.id);
      if(r) {
        r.set(u).then(function(){
          show('수정 완료! (날짜 포함)');
        }).catch(function(e){
          console.error('[수정실패]', e);
        });
      }
    } else {
      // 로컬 스토리지만 사용할 경우
      setTxs(function(p){
        var next = p.map(function(t){ return t.id===u.id ? u : t; });
        lsSet(LS_TXS, next);
        return next;
      });
      show('수정되었습니다!');
    }
  }
  function delTx(id) {
    if(fbDb) {
      fbDelTx(id); // Firebase 삭제 → 리스너 자동 반영
    } else {
      setTxs(function(p){
        var next = p.filter(function(t){ return t.id!==id; });
        lsSet(LS_TXS, next);
        return next;
      });
    }
    show('삭제되었습니다');
  }
  function bulkDel(ids) {
    if(fbDb) {
      ids.forEach(function(id){ fbDelTx(id); }); // Firebase 일괄 삭제
    } else {
      setTxs(function(p){
        var next = p.filter(function(t){ return ids.indexOf(t.id)<0; });
        lsSet(LS_TXS, next);
        return next;
      });
    }
    show(ids.length+'건 삭제됨');
  }
  // ★§4 끝 ★

  function addCard(c) {
    setCards(function(p){
      var next = p.concat([c]);
      lsSet(LS_CARDS, next);
      return next;
    });
    show('카드가 등록되었습니다!');
  }
  function updateCard(c) {
    setCards(function(p){
      var next = p.map(function(x){ return x.id===c.id ? c : x; });
      lsSet(LS_CARDS, next);
      return next;
    });
    show('카드가 수정되었습니다!');
  }
  function deleteCard(id) {
    setCards(function(p){
      var next = p.filter(function(x){ return x.id!==id; });
      lsSet(LS_CARDS, next);
      return next;
    });
    show('카드가 삭제되었습니다');
  }
function updateFixed(fx) {
    if(fbDb) {
      fbSaveFixed(fx);
    } else {
      setFixedExps(function(p){
        var next = p.map(function(f){ return f.id===fx.id ? fx : f; });
        lsSet(LS_FIXED, next);
        return next;
      });
    }
    show('고정지출이 수정되었습니다!');
  }
  function deleteFixed(id) {
    if(fbDb) {
      fbDelFixed(id);
    } else {
      setFixedExps(function(p){
        var next = p.filter(function(f){ return f.id!==id; });
        lsSet(LS_FIXED, next);
        return next;
      });
    }
    show('고정지출이 삭제되었습니다');
  }

  function handleLogin(userInfo) {
    lsSet(LS_USER, userInfo);
    setCurUser(userInfo);
    setLoggedIn(true);
  }

  function logout() {
    lsDel(LS_USER);
    setCurUser(null);
    setLoggedIn(false);
    setTab('dashboard');
  }

  if(!loggedIn) {
    return h(AuthScreen, {onLogin: handleLogin});
  }

  return h('div', {style:{
    background:C.bg, minHeight:'100vh', color:C.text,
    fontFamily:"'Pretendard', 'Apple SD Gothic Neo', sans-serif", /* ★옛날 폰트 삭제하고 프리텐다드 적용★ */
    maxWidth:430, margin:'0 auto', position:'relative'
  }},
tab==='dashboard' && h(Dashboard,  {txs:txs, onNav:setTab, startDay:startDay}),
    tab==='analysis'  && h(Analysis,   {txs:txs, startDay:startDay}),
    tab==='add'       && h(AddMenu,    {onAdd:addTx, onClose:function(){setTab('dashboard');}, cards:cards, onRegCard:addCard, onUpdateCard:updateCard, onDeleteCard:deleteCard, fixedList:fixedExps, onUpdateFixed:updateFixed, onDeleteFixed:deleteFixed}),
    tab==='list'      && h(TxList,     {txs:txs, onUpdate:updTx, onDelete:delTx, onBulkDelete:bulkDel}),
    tab==='settings'  && h(Settings,   {txs:txs, onLogout:logout, curUser:curUser, cards:cards, onRegCard:addCard, onUpdateCard:updateCard, onDeleteCard:deleteCard, startDay:startDay, setStartDay:setStartDay}),
    h(BNav, {active:tab, onTab:setTab}),
    toast && h(Toast, {message:toast, onHide:function(){setToast(null);}})
  ); // 👈 (복구됨) 앱 화면을 그리는 코드 닫기!
} // 👈 (복구됨) App 함수 닫기!

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));

}); // window.onload 닫힘
